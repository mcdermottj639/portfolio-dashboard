    </ul>
    <p>Dividend income is typically small for a growth/AI book — the tax lever here is harvesting, not yield. <i>Not tax advice.</i></p>` },
  'technical signals': { tag:'Portfolio', t:'Technical Signals', h:`
    <p>A quick momentum read on each holding using two classic indicators, so you can spot what's stretched or rolling over without opening every chart.</p>
    <div class="hsub">The two signals</div>
    <ul>
      <li><span class="hk">RSI (Relative Strength Index, 0–100)</span> — measures recent up- vs down-moves. <b>Above 70</b> = overbought (ran hot, may pull back); <b>below 30</b> = oversold (beaten down, may bounce); ~40–60 is neutral.</li>
      <li><span class="hk">Price vs 50-day SMA</span> — is the stock above or below its 50-day average price? <b>Above</b> = uptrend intact; <b>below</b> = trend weakening. The 50-DMA often acts as support/resistance.</li>
    </ul>
    <div class="hsub">What to look for</div>
    <ul>
      <li>RSI is a <i>context</i> tool, not a trigger — strong stocks can stay overbought for weeks. Use it with the trend.</li>
      <li>A name above 70 RSI <i>and</i> far above its 50-DMA is extended — a candidate to trim, not chase.</li>
    </ul>` },
  'fundamentals': { tag:'Portfolio', t:'Fundamentals', h:`
    <p>The business behind each ticker: valuation and growth metrics, so a position is judged on the company, not just the chart.</p>
    <div class="hsub">What the metrics mean</div>
    <ul>
      <li><span class="hk">P/E (price/earnings)</span> — price per $1 of annual earnings. Higher = more growth priced in (and more downside if growth disappoints).</li>
      <li><span class="hk">Forward P/E</span> — same, but on <i>next</i> year's expected earnings. Lower than trailing P/E means analysts expect earnings to grow.</li>
      <li><span class="hk">Revenue growth (YoY)</span> — how fast sales are expanding. The engine of a growth stock.</li>
      <li><span class="hk">Profit margin</span> — how much of each sales dollar becomes profit.</li>
      <li><span class="hk">Market cap</span> — total company value; <span class="hk">Div yield</span> — annual dividend as a % of price.</li>
    </ul>
    <p>Coverage accumulates across days as the data provider rotates through holdings, so a blank field usually fills in on a later run rather than meaning "no data."</p>` },
  'positions under': { tag:'Portfolio', t:'Small Positions', h:`
    <p>Holdings worth less than the small-position threshold, grouped together. Individually they're <b>too small to move the needle</b> on returns, but they add clutter and each one still needs monitoring.</p>
    <div class="hsub">What to look for</div>
    <ul>
      <li>The total tells you how much capital is scattered across odd-lots — often worth <b>consolidating</b> into your core convictions.</li>
      <li>Many of these are leftovers from trims, fractional dividends, or positions that fell hard. Decide: add to a real size, or close.</li>
    </ul>` },

  /* ════════ PLAN / PICKS TAB ════════ */
  'flow positioning': { tag:'Accounts', t:'Flow &amp; Positioning', h:`
    <p>Every other card reads the <i>company</i> — its price, its fundamentals. This one reads <b>who is acting on it</b>: analysts, corporate insiders, and the federal government. It covers the names in <b>both accounts</b> — 📊 held in the self-directed margin book, 🤖 held in the agentic account, 🎯 in the agentic target but not opened yet.</p>
    <div class="hsub">The columns</div>
    <ul>
      <li><span class="hk">Revisions</span> — the direction analyst consensus is moving. Scored mostly on the <b>change</b>, not the level: almost everything carries a "buy" rating, so the level says little, while a name being steadily upgraded (or quietly downgraded) says a lot.</li>
      <li><span class="hk">Insider</span> — open-market Form 4 buys and sells only. Grants, option exercises, gifts and tax withholding are stripped out — they're mechanical and would make every large cap look like a wall of selling. <b>Buying counts far more than selling</b>: insiders buy for one reason and sell for a dozen.</li>
      <li><span class="hk">Surprise</span> — earnings beats/misses, recency-weighted, with each quarter capped so one freak number can't dominate.</li>
      <li><span class="hk">Awards</span> — growth in federal contract dollars. Meaningful for government-exposed names, silent for everyone else.</li>
      <li><span class="hk">Flow</span> — the blend. A name with too little data <b>abstains</b> rather than showing a misleading middling score.</li>
    </ul>
    <div class="hsub">What it does NOT do</div>
    <ul>
      <li>It does <b>not</b> move the agentic target. The sleeve is switched off during a burn-in so the signal can be judged on real data before it earns a say.</li>
      <li><span class="hk">Congressional clusters</span> carry <b>zero weight, permanently</b>. Disclosure lags the actual trade by 40–116 days, and the mega-cap names that feed is dominated by are excluded outright — they already sit inside the concentration cap the target enforces. Shown because it's interesting, not because it's actionable.</li>
      <li><span class="hk">Lobbying</span> is a regulatory-exposure flag, not a buy or sell signal.</li>
    </ul>
    <p class="hnote">Research and education only.</p>`},
  'flow read': { tag:'Analyze', t:'Flow read', h:`
    <p>The one-line version of the <b>Flow &amp; Positioning</b> card for this ticker — analyst revision direction, insider cluster activity, earnings surprise and federal awards, blended into a 0–10 score.</p>
    <p>Display-only: it doesn't feed the recommendation above it or the agentic target. "Partial read" means some signals were available but too few to blend a score.</p>`},
  'account performance': { tag:'Accounts', t:'Account Performance', h:`
    <p>How the <b>agentic account (••••3900)</b> is actually doing — measured properly, which for a self-funded account is harder than it sounds.</p>
    <div class="hsub">Why the return isn't just "value ÷ what I started with"</div>
    <p>You add money to this account over time, and Robinhood exposes no transfers feed. A deposit raises the balance without you earning anything — so a naive calculation reports funding as profit (a $1.0k → $3.5k deposit would read as <i>+250%</i>).</p>
    <ul>
      <li><span class="hk">Return since {date}</span> — a <b>time-weighted</b> return: each day's gain is chained together with deposits and withdrawals stripped out. This is the number that says whether the strategy works.</li>
      <li><span class="hk">S&amp;P 500 same window</span> — SPY over the identical period, so the comparison is fair. The sub-line shows how far ahead or behind you are.</li>
      <li><span class="hk">Money made</span> — dollars earned, net of every deposit.</li>
      <li><span class="hk">You put in</span> — starting balance plus everything you've added since.</li>
    </ul>
    <div class="hsub">The two chart modes</div>
    <ul>
      <li><span class="hk">Return %</span> — the deposit-adjusted growth line against SPY.</li>
      <li><span class="hk">Value $</span> — the raw account balance, with your cumulative contributions as a dashed line beneath it. <b>The gap between the two lines is the money the account made.</b></li>
    </ul>
    <p class="hnote">Tracking starts from the first recorded snapshot and can't be backfilled — the broker publishes no account-equity history, so the producer writes one point per day going forward. Deposits are <i>inferred</i> (an equity change that price moves don't explain), so a deposit made on a very volatile day may be estimated.</p>` },
  'rebalance log': { tag:'Accounts', t:'Rebalance Log', h:`
    <p>The agentic account's own track record: every confirmed deploy or rebalance, graded against what happened next.</p>
    <ul>
      <li><span class="hk">Contribution</span> — the dollar-weighted result of that decision's trades since it was placed.</li>
      <li><span class="hk">vs SPY</span> — whether the same money in the index would have done better. <span class="hk">Ahead / Behind / Open</span> is the verdict; "open" means it's too early to call.</li>
    </ul>
    <p>The point is falsifiability — a strategy that logs its decisions can be shown to be working or not, instead of just staying busy.</p>
    <p class="hnote">Research and education only.</p>` },
  'where the plan stands': { tag:'Plan · Agentic', t:'Where the plan stands', h:`
    <p>The live state of the agentic account's automation: whether a rebalance <b>ticket</b> is outstanding, how much cash is idle, and what happens next.</p>
    <div class="hsub">Ticket statuses</div>
    <ul>
      <li><span class="hk">proposed</span> — planned but not placed. Under the auto tier it executes unattended; over it, it waits for your one-tap confirm.</li>
      <li><span class="hk">confirmed</span> → <span class="hk">sells-placed</span> → <span class="hk">buys-placed</span> → <span class="hk">done</span> — sells go first, and their proceeds fund the buys the same session (limited margin settles instantly).</li>
    </ul>
    <div class="hsub">The idle-cash clock</div>
    <p>Cash sitting for 10 days forces deployment in tranches. Without a deadline, "wait for a pullback" never expires and a rising market can strand a deposit indefinitely.</p>`},
  'the target and why these names': { tag:'Plan · Agentic', t:'The target', h:`
    <p>The <b>destination</b> for ••••3900 — not what it currently holds. Refreshed weekly by deep multi-factor research, then run through deterministic caps.</p>
    <div class="hsub">Inclusion vs. size</div>
    <p>The research returns two separate judgements: is the business worth owning at <i>some</i> price (decides whether it's in at all), and how good is <i>today's</i> price (decides how big). A stretched entry <b>shrinks</b> a position rather than vetoing it — otherwise an extended market yields an empty book instead of a smaller, defensive one.</p>
    <div class="hsub">Status column</div>
    <ul>
      <li><span class="hk">on target</span> / <span class="hk">over</span> / <span class="hk">under</span> — drift vs. the weight, flagged past the 5pp trigger.</li>
      <li><span class="hk">to open</span> — recommended, not held yet. <span class="hk">phase-out</span> — dropped by the latest research but held one more cycle (two strikes) so a re-inclusion next week costs nothing.</li>
      <li>Anything else is a deferral — see the next card.</li>
    </ul>`},
  'what s blocked and what clears it': { tag:'Plan · Agentic', t:"What's blocked", h:`
    <p>Deferrals never change a target <b>weight</b> — only <b>when</b> the money moves. These are the same checks the producer's planner runs before writing a ticket, so the badges here match what the executor will actually do.</p>
    <div class="hsub">The reasons</div>
    <ul>
      <li><span class="hk">wash-sale</span> — a loss on this name was realized in <i>either</i> taxable account within 30 days. The IRS window is per taxpayer, so a loss in ••••0741 blocks a rebuy here.</li>
      <li><span class="hk">earnings</span> — reports within 7 days. Wait for the print rather than gambling on the gap.</li>
      <li><span class="hk">below stop</span> — trading at or below the target's stop: the setup is broken, not cheap.</li>
      <li><span class="hk">below / above entry</span> — outside the research's entry band. Too cheap means re-verify the thesis; too rich means wait for the pullback the research priced in.</li>
    </ul>
    <div class="hsub">Why zones expire</div>
    <p>Entry zones older than 7 days go <b>advisory</b>. When most of a target reads out-of-band at once, the guard is measuring its own staleness, not the companies. Below-stop still binds.</p>`},
  'the waiting ground': { tag:'Plan · Agentic', t:'The waiting ground', h:`
    <p>A deferred name's dollars don't idle in cash — they wait in <b>VTI</b>, a broad-market placeholder, and are released to fund the name once it clears.</p>
    <div class="hsub">Why VTI specifically</div>
    <ul>
      <li>Not <b>SPY</b> — that's the target's own ballast, so parking there would hide the placeholder inside a real position. VTI and SPY track different indexes, so they're never "substantially identical" for wash-sale purposes.</li>
      <li>Not <b>QQQ</b> — roughly half of it is the megacap-tech cluster the 48% cap exists to contain.</li>
    </ul>
    <div class="hsub">Cost</div>
    <p>Releasing is a real short-term taxable sale, so releases are floored, sized to the actual shortfall, and run through the same losses-first ordering and day-trade guard as any other sell.</p>`},
  'agentic-whole-plan': { tag:'Plan · Agentic', t:'The whole plan — how ••••3900 runs itself', h:`
    <p><b>A second, separate brokerage account that invests itself.</b> Research picks the names, code decides when the trades actually happen, and a robot places them on a schedule. It is deliberately the <i>cautious</i> book: no borrowing, no options, diversified, and slow to change its mind. (The other account, ••••0741, runs the opposite mandate on purpose — concentrated and aggressive. A change that makes one look like the other is a bug.)</p>

    <div class="hsub">The loop, once around</div>
    <ul>
      <li><span class="hk">1 · Research (weekly, Mondays)</span> — Several independent analyses run in parallel over a fresh universe: <b>momentum</b>, <b>quality</b>, <b>growth</b>, <b>catalyst</b>, and <b>valuation</b>. Each scores every candidate 0-10. A sixth, <b>flow</b> (who is actually buying/selling — analyst revisions, insider filings, earnings surprises), is measured but currently carries <b>zero weight</b> until it proves itself.</li>
      <li><span class="hk">2 · Adversarial check</span> — Every finalist is handed to a separate skeptic whose job is to <i>refute</i> it, not confirm it. It answers two things separately: is this a business worth owning at <i>some</i> price, and is <i>today's</i> price any good. That split matters — "great company, wrong price" shrinks the position instead of vetoing it, so an expensive market yields a smaller book rather than an empty one.</li>
      <li><span class="hk">3 · Sizing, with hard caps</span> — Conviction proposes weights; deterministic code disposes. Names that move together are capped as one bet (the big AI/tech complex ≤48% combined), wilder names get smaller slots than steady ones for the same conviction, and the caps count what is <i>inside</i> index funds too — 20% SPY quietly carries a lot of the same megacap tech.</li>
      <li><span class="hk">4 · Execution (hourly, weekdays)</span> — A robot compares the target to what the account actually holds and writes a ticket: sells first, then buys. Small routine tickets it places unattended; anything larger is pushed to the phone for a one-tap confirm. It places nothing outside that.</li>
      <li><span class="hk">5 · Grading</span> — Every rebalance is logged and scored against what happened next <i>and</i> against the S&P 500, so the strategy can be judged rather than just repeated.</li>
    </ul>

    <div class="hsub">Why it often does nothing</div>
    <p>Most hourly checks end in "no action", and that is the design working. A trade is blocked when any of these is true:</p>
    <ul>
      <li><span class="hk">Earnings within ~7 days</span> — wait for the print rather than gamble on it.</li>
      <li><span class="hk">Price outside the entry band</span> — too expensive means wait for the pullback; well below the plan means re-check the thesis before buying a falling knife.</li>
      <li><span class="hk">Wash-sale window (30 days)</span> — if a loss was booked on that name recently in <i>either</i> account, rebuying wastes the tax deduction. The IRS counts per person, not per account.</li>
      <li><span class="hk">Bought or sold too recently</span> — a 14-day minimum hold and a 14-day re-entry cooldown. Added after two disagreeing weekly targets flipped nearly the whole book in 48 hours, every leg taxable.</li>
      <li><span class="hk">Sold something today</span> — nothing bought today is sold today, so the account can never accumulate day-trades it isn't allowed to have.</li>
      <li><span class="hk">The whole book is down too much</span> — see below.</li>
    </ul>

    <div class="hsub">The circuit breaker</div>
    <p>Every rule above is about <i>one name</i>. One rule is about the <b>entire account</b>: if the book falls <b>8%</b> below its high, all new buying stops — no matter how good any individual idea looks. At <b>12%</b> it also raises cash to 20% of the book, selling losers first. Buying only resumes above <b>−6%</b>, not at −8%, so it can't flicker on and off around the line.</p>
    <p>Two details that took real care: the drop is measured <b>after removing deposits</b>, so adding money can never mask a decline (a deposit would otherwise push the balance to a "new high" at the worst possible moment); and while it's tripped, money waits in <b>cash</b> rather than the usual placeholder fund, since that placeholder is itself 100% stock market.</p>

    <div class="hsub">The waiting ground</div>
    <p>When a name is blocked, its dollars don't sit idle — they wait in a broad-market fund (VTI) and are released to buy the real name once it clears. VTI specifically, not SPY: SPY is already part of the target, so parking there would hide the placeholder inside a real position.</p>

    <div class="hsub">Reading the tape</div>
    <p>Deployment is paced by how jumpy the market is. In a calm market, idle cash is forced in after 10 days; when volatility is elevated that stretches to 15, and when it's stressed, 20 days and in half-sized pieces. This changes only <i>how fast</i> money goes in — never which names are chosen, and it never delays a sale.</p>

    <div class="hsub">Taxes</div>
    <p>This is a taxable account, and every position is short-term, so tax is treated as a real cost rather than an afterthought: sales are ordered losses-first, positions underwater past a threshold are harvested deliberately, each ticket estimates its own tax impact, and the wash-sale ledger spans both accounts.</p>

    <div class="hsub">What it will never do</div>
    <ul>
      <li>Borrow money or use leverage — the account is unlevered, always.</li>
      <li>Short a stock, or trade options.</li>
      <li>Place a large trade without a confirmation from the owner.</li>
      <li>Sell shares that are backing an obligation, or take a trade that breaks a rule above because a target "said so".</li>
    </ul>

    <p style="margin-top:12px;opacity:.8"><b>The honest summary:</b> a disciplined, diversified, unlevered strategy that trades rarely, explains every refusal, keeps its own scorecard, and stops itself when the whole book is falling. It is not a prediction engine and it is not guaranteed to make money — it is a set of rules applied consistently, which is mostly what separates a strategy from a series of impulses. Not financial advice.</p>` },
  'guardrails': { tag:'Plan · Agentic', t:'Guardrails', h:`
    <p>The standing rules the automated executor cannot cross. Each is enforced in code, and most were added after a specific mistake.</p>
    <div class="hsub">Why they exist</div>
    <ul>
      <li><span class="hk">Cluster + vol caps</span> — sector labels hid the fact that the big AI/tech names trade as one bet, and a fixed % weight means very different risk in a wide-range name than in an index.</li>
      <li><span class="hk">Min-hold + re-entry cooldown</span> — the weekly research is memoryless, so two disagreeing targets once flipped the entire book in 48 hours, all short-term taxable. A target refresh expresses <i>intent</i>; these decide <i>when</i> intent becomes trades.</li>
      <li><span class="hk">PDT guard</span> — limited margin makes this a margin account for FINRA, and the book is under $25k with an hourly executor. Nothing bought today is sold today, categorically.</li>
    </ul>`},
  'how the loop runs': { tag:'Plan · Agentic', t:'How the loop runs', h:`
    <p>The five stages between "research has an opinion" and "shares change hands", and who owns each one.</p>
    <ul>
      <li><b>Research</b> proposes — weekly, or early when a deposit lands or a held name gaps hard.</li>
      <li><b>Finalize</b> disposes — caps are re-enforced deterministically, so they hold regardless of what the research returned.</li>
      <li><b>Plan</b> turns drift into a ticket, applying every guardrail.</li>
      <li><b>Execute</b> places it hourly, unattended within the auto tier, one-tap above it.</li>
      <li><b>Grade</b> logs it against what happened next and against SPY — the account's own track record.</li>
    </ul>`},
  'agentic portfolio': { tag:'Accounts', t:'Agentic Portfolio', h:`
    <p>What the agentic account (••••3900) actually <b>holds</b> — a separate, unlevered limited-margin account (instant settlement, no borrowing), distinct from your margin book.</p>
    <div class="hsub">Reading the table</div>
    <ul>
      <li><span class="hk">Position</span> — the holding's value and its share of the book, with cost basis under the ticker.</li>
      <li><span class="hk">Day / YTD</span> — day move from the live quote's prior close; YTD off the daily-bar series (— until bars are captured).</li>
      <li><span class="hk">Unreal. P&amp;L</span> — gain or loss against cost. <span class="hk">Trade</span> — the buy/sell that would bring this name to its target weight, or the reason it's deferred.</li>
      <li>A holding tagged <span class="hk">off-target</span> isn't in the current research target and would be exited; <span class="hk">waiting ground</span> is the parking placeholder, which is held on purpose, never exited.</li>
    </ul>
    <div class="hsub">Where the target lives</div>
    <p>Target weights, entry zones, stop/TP levels and every deferral moved to the <b>Plan tab's Agentic side</b> — they were the same numbers in two places, and the wider table pushed P&amp;L and Day/YTD off a phone screen. This card answers "what do I own and how is it doing"; the Plan tab answers "what happens next and why".</p>
    <p>The <b>🤖 hand-off button</b> carries a deploy/rebalance prompt that places fractional dollar orders after your review.</p>` },
  'action center': { tag:'Plan', t:'Action Center', h:`
    <p>The decide-and-act surface: a ranked feed of live signals, then a concrete cash-raising-and-redeploying plan. It's portfolio-derived, so it populates whether you open this tab before or after the portfolio finishes loading.</p>
    <div class="hsub">Two tiers</div>
    <ul>
      <li><span class="hk">Do-now</span> — the ranked live-signal feed (margin, concentration, earnings, overbought/oversold, correlated cluster, retail buzz).</li>
      <li><span class="hk">The-plan</span> — a structured 3-step plan.</li>
    </ul>
    <p>This is the <b>self-directed ••••0741</b> book, and it runs the <b>aggressive</b> mandate — concentrated, high-beta, levered on purpose. Ballast and diversification are the agentic account's job. The plan reflects that: it cuts what's <i>broken</i>, not what's red.</p>
    <div class="hsub">The plan steps</div>
    <ul>
      <li><b>Step 1 — Cut what's broken:</b> exits are a <b>thesis test</b> (50-DMA rolled under the 100-DMA with price decisively below it, or a −25% stop breach), never the sign of P&amp;L. Then <b>margin posture</b>, then a concentration <i>readout</i>. Includes a tax-netting line.</li>
      <li><b>Step 2 — Deploy into the mandate:</b> the pool is split across momentum-ranked core / high-beta satellite / asymmetric sleeves, inverse-vol within each. A separate <b>press room</b> block shows what pressing to the ceiling would buy, what it costs to carry, and what it does to your margin-call distance — advisory, with no order button.</li>
      <li><b>Step 3 — Guardrails:</b> the margin bands, never sell covered-call collateral, vol-scaled stops, house money at 2× cost, never add to a broken trend, size for earnings gaps.</li>
    </ul>
    <div class="hsub">Margin: bands, not a cap</div>
    <p>Margin is measured as <b>utilisation of your credit line</b> — the number Robinhood shows you (line = buying power + loan). Two bands: <b>cruise ${fmt(SD_UTIL_CRUISE*100,0)}%</b>, which the plan will deploy up to on its own, and a hard <b>ceiling ${fmt(SD_UTIL_MAX*100,0)}%</b>, the only level that makes the plan raise cash (from the weakest-momentum names you can actually deliver). Below cruise there is no alert at all.</p>
    <div class="hsub">Concentration is reported, not policed</div>
    <p>There is <b>no name cap and no cluster cap</b> on this side any more. A leader that is 90% of equity and still leading is the mandate working; selling it to satisfy a percentage is a risk dial overruling the strategy. What you get instead is the size of the bet stated plainly, the account-level impact of a −20% day in it, and the vol-scaled stop that is the actual protection. The <b>TRIM</b> alert fires only when a big position is <i>also</i> weak — size plus weakness, not size.</p>
    <p>The buy and sell steps each have a <b>🤖 hand-off button</b> that builds the order prompt. It's a framework, not advice.</p>` },
  'top picks today': { tag:'Plan', t:'Top 3 Picks Today', h:`
    <p>The three highest-conviction ideas from today's scan, each with a full setup: thesis, entry zone, stop, and profit targets. These are the names the plan's high-conviction sleeve deploys into.</p>
    <div class="hsub">What each card gives you</div>
    <ul>
      <li><span class="hk">Entry zone</span> — the price range to buy in; <span class="hk">Stop</span> — where the thesis is wrong, so you exit.</li>
      <li><span class="hk">TP1 / TP2</span> — first and second profit targets to scale out.</li>
      <li><span class="hk">Risk/reward</span> — the ratio of potential gain (to target) vs potential loss (to stop). Look for ≥ 2:1.</li>
      <li>A <b>catalyst-risk note</b> appears when earnings land inside the trade's swing window — a print can blow through your stop on a gap.</li>
    </ul>
    <p>The picks are <b>sector-diversified</b>, and a "🧭 the plan picked this" badge links a card back to its slot in the Action Center.</p>` },
  'composite scores': { tag:'Plan', t:'Composite Scores', h:`
    <p>The single 0–100 score that ranks every candidate, and the chart of how the top names stack up. It blends four independent angles so no one factor dominates.</p>
    <div class="hsub">The four components</div>
    <ul>
      <li><span class="hk">Technical — 33%</span> — momentum/setup, blending RSI with where price sits in its 52-week range.</li>
      <li><span class="hk">Fundamentals — 28%</span> — valuation and growth quality.</li>
      <li><span class="hk">Risk/Reward — 19%</span> — upside to target vs downside to stop.</li>
      <li><span class="hk">Social — 20%</span> — retail buzz (mention rank + velocity), a spotlight on names heating up.</li>
    </ul>
    <p>Finalists are <b>sector-diversified</b> (capped per sector) so the list isn't five flavors of the same trade. A higher composite = a more complete setup, not a guarantee.</p>` },
  'scoring breakdown': { tag:'Plan', t:'Scoring Breakdown', h:`
    <p>The full, sortable and sector-filterable table behind the composite — every candidate with its component scores exposed, so you can see <i>why</i> a name ranks where it does.</p>
    <div class="hsub">Reading the cues</div>
    <ul>
      <li><span class="hk">Social column</span> — retail buzz, 20% of the composite, with an inline label. <b>Grey</b> = no data (scored a neutral 5), not bearish.</li>
      <li><span class="hk">ᵛ marker</span> — value-only fundamentals (growth data unavailable from the provider that day).</li>
      <li>Sort by any component to find, say, the best <i>fundamental</i> names regardless of momentum, or vice-versa.</li>
    </ul>
    <p>Use the sector filter to screen within a theme you already understand.</p>` },
  'track record': { tag:'Plan', t:'Track Record', h:`
    <p>Honest scorekeeping: past picks graded on a closing basis, so the engine's accuracy is visible rather than assumed.</p>
    <div class="hsub">How picks are graded</div>
    <ul>
      <li>Each archived pick is marked <b>hit TP1</b>, <b>hit TP2</b>, <b>stopped out</b>, or <b>still open</b>, judged from daily closing prices.</li>
      <li><span class="hk">Resolved vs open</span> — a pick is <b>resolved</b> once a close reaches a target (a <b>win</b>) or its stop (a <b>loss</b>). Until then it's <b>open</b> (still running) and is excluded from the hit-rate.</li>
      <li><span class="hk">Hit-rate</span> — share of <i>resolved</i> picks that reached a target before stopping. <span class="hk">Record</span> — wins·losses. <span class="hk">Avg return</span> — the mean outcome.</li>
    </ul>
    <div class="hsub">Reading the card</div>
    <ul>
      <li>The strip of chips is the most-recent outcomes at a glance (✅ win · ⛔ loss · • open). Tap <b>View graded detail</b> to expand the full per-scan breakdown with entry/exit levels.</li>
      <li>A hit-rate around or above 50% with risk/reward ≥ 2:1 is mathematically profitable even with plenty of losers.</li>
      <li>Small samples are noisy — weight this more as the resolved count grows.</li>
    </ul>` },
  'pick-earn': { tag:'Plan', t:'Earnings Preview', h:`
    <p>The next earnings report for the soonest-reporting top pick. Earnings are the single biggest scheduled catalyst — and the biggest scheduled <b>risk</b> — for a swing trade.</p>
    <div class="hsub">Why it matters</div>
    <ul>
      <li>A report can <b>gap</b> the stock through your stop overnight, so a normal stop won't protect you.</li>
      <li>Options often price in a big <b>implied move</b> beforehand and lose value (IV crush) right after.</li>
    </ul>
    <p>If a pick reports inside your intended holding window, size smaller or wait until after the print to enter.</p>` },
  'income ideas': { tag:'Plan', t:'Income Ideas', h:`
    <p>Covered-call opportunities on holdings where you own <b>≥ 100 shares</b> (one option contract = 100 shares). A way to generate cash income from stock you already hold.</p>
    <div class="hsub">How a covered call works</div>
    <ul>
      <li>You <b>sell</b> a call against your shares and keep the <b>premium</b> immediately.</li>
      <li>The suggested strike is the nearest <b>~30-delta monthly</b> call — roughly a 30% chance of finishing in-the-money.</li>
      <li>Trade-off: if the stock rockets past the strike, your shares get <b>called away</b> (sold) at that strike — you cap your upside in exchange for the income.</li>
    </ul>
    <p>Best on names you're neutral-to-mildly-bullish on and would be content to sell at the strike.</p>` },
  'catalysts news': { tag:'Plan', t:'Catalysts &amp; News', h:`
    <p>Recent headlines for your top picks, gathered during the morning research scan, color-coded by sentiment. Context for <i>why</i> a name is moving or being talked about.</p>
    <div class="hsub">Reading it</div>
    <ul>
      <li>Ticker color: <span style="color:#10b981;font-weight:700">green</span> = bullish, <span style="color:#ef4444;font-weight:700">red</span> = bearish, grey = neutral.</li>
      <li>News explains catalysts the score can't — an upgrade, a product launch, a regulatory headline.</li>
    </ul>
    <p>Headlines are a snapshot from scan time; confirm anything time-sensitive before acting.</p>` },

  /* ════════ OPTIONS TAB ════════ */
  'options exposure': { tag:'Options', t:'Options Exposure', h:`
    <p>A roll-up of the risk across all your open and pending option contracts — the "how exposed am I?" summary before you read individual positions.</p>
    <div class="hsub">What the figures mean</div>
    <ul>
      <li><span class="hk">Net delta</span> — your total directional exposure expressed in share-equivalents. Positive = net long (you profit if prices rise).</li>
      <li><span class="hk">Put cash secured</span> — cash you'd need if every short put were assigned (you'd be forced to buy the shares).</li>
      <li><span class="hk">Shares capped</span> — shares that could be called away by short calls.</li>
      <li><span class="hk">Open premium at risk</span> — net premium currently exposed in open positions.</li>
    </ul>
    <p>This is the single screen that tells you whether your options book is leaning bullish, bearish, or income-neutral.</p>` },
  'upcoming expirations': { tag:'Options', t:'Upcoming Expirations', h:`
    <p>A calendar of when your contracts expire. Expiration is a hard deadline — options decay fastest in their final weeks and become all-or-nothing at the end.</p>
    <div class="hsub">Why watch this</div>
    <ul>
      <li>Contracts near expiry need a decision: <b>close</b>, <b>roll</b> (move to a later date), or <b>let expire</b>.</li>
      <li>Short options near expiry that are in-the-money risk <b>assignment</b> — plan before the last day, not on it.</li>
      <li><span class="hk">Theta (time decay)</span> accelerates in the final ~2 weeks: good if you're the seller, painful if you're the buyer.</li>
    </ul>` },
  'your options': { tag:'Options', t:'Your Options', h:`
    <p>Each option you hold, with full live <b>greeks</b>, P&amp;L, assignment odds, and a payoff diagram. The greeks tell you how the position will react to what the stock does next.</p>
    <div class="hsub">The greeks</div>
    <ul>
      <li><span class="hk">Delta (Δ)</span> — change in option price per $1 move in the stock; also ≈ probability of finishing in-the-money.</li>
      <li><span class="hk">Theta (Θ)</span> — value lost per day to time decay. Negative for buyers, positive for sellers.</li>
      <li><span class="hk">Vega</span> — sensitivity to implied volatility. High vega = the position swings when fear/IV changes.</li>
      <li><span class="hk">Gamma (Γ)</span> — how fast delta itself changes; biggest near the strike and near expiry.</li>
    </ul>
    <div class="hsub">Other cues</div>
    <ul>
      <li><span class="hk">IV-rank badge</span> — whether the option is cheap or rich vs its own recent volatility range.</li>
      <li><span class="hk">Roll suggestions</span> on short calls — a named later expiry / higher strike to extend the trade.</li>
    </ul>` },
  'trade ideas': { tag:'Options', t:'Trade Ideas', h:`
    <p>Generated, filterable option setups that fit your holdings and the current read — research and education only, not recommendations.</p>
    <div class="hsub">The structures</div>
    <ul>
      <li><span class="hk">Long call</span> — leveraged bullish bet; defined risk (the premium), unlimited upside.</li>
      <li><span class="hk">Covered call</span> — income against shares you own; caps upside.</li>
      <li><span class="hk">Cash-secured put</span> — get paid to potentially buy a stock lower.</li>
      <li><span class="hk">Call debit spread / collar</span> — <b>defined-risk, multi-leg</b> structures (estimate-only); the payoff diagram is drawn from the combined legs.</li>
    </ul>
    <p>Single-leg ideas are <b>live-priced and delta-targeted</b>; multi-leg ones use a per-symbol volatility estimate. Always confirm the real bid/ask and open interest before trading.</p>` },
  'covered call income': { tag:'Options', t:'Covered-Call Income', h:`
    <p>An income ranker for your 100+ share holdings, sorted by <b>annualized yield</b> — so you can compare premium income across names on equal footing.</p>
    <div class="hsub">The math</div>
    <ul>
      <li><span class="hk">Annualized yield</span> = premium ÷ price × (365 ÷ days to expiry). It scales a one-off premium into a yearly rate for comparison.</li>
      <li><span class="hk">Income</span> — actual dollars you'd collect for selling the call now.</li>
    </ul>
    <div class="hsub">The trade-off</div>
    <p>You keep the premium no matter what, but you <b>cap your upside</b> at the strike — if the stock blows past it, the shares are called away. Best on names you're neutral on and happy to sell at the strike.</p>` },
  'cash secured put income': { tag:'Options', t:'Cash-Secured Put Income', h:`
    <p>An income ranker for <b>selling puts</b> — getting paid premium for agreeing to buy a stock at a lower price if it falls there.</p>
    <div class="hsub">How it works</div>
    <ul>
      <li>You set aside cash to cover the purchase (<b>cash-secured</b>) and sell a put below the current price.</li>
      <li>If the stock stays up, you keep the premium and never buy. If it falls below the strike, you buy the shares — at a net cost reduced by the premium.</li>
      <li><span class="hk">Annualized yield</span> lets you rank opportunities like any income stream.</li>
    </ul>
    <p>Only sell puts on names you'd genuinely be happy to <b>own</b> at the strike — assignment is the point, not a failure.</p>` },
  'options p l': { tag:'Options', t:'Options P&amp;L', h:`
    <p>Your <b>closed</b> option trades and what they actually made or lost — the realized scoreboard for your options activity.</p>
    <div class="hsub">What to look for</div>
    <ul>
      <li>Separates options results from your stock P&amp;L so you can see whether the options program is adding value on its own.</li>
      <li>Look at the <b>pattern</b>: are losses small and wins larger (healthy), or the reverse (selling premium and getting run over)?</li>
    </ul>` },
  'options knowledge': { tag:'Options', t:'Options Knowledge', h:`
    <p>A built-in primer on the options concepts used throughout this tab — keep it open as a glossary while you read the other cards.</p>
    <p>Covers the greeks, intrinsic vs extrinsic value, implied volatility and IV rank, assignment, and the common strategies (calls, puts, spreads, covered calls, cash-secured puts). Education only.</p>` },

  /* ════════ ANALYZE TAB ════════ */
  'cmp-head': { tag:'Analyze', t:'Comparison', h:`
    <p>A side-by-side of the two tickers you're comparing — valuation, momentum, and quality metrics in one table so relative strengths and weaknesses jump out.</p>
    <div class="hsub">How to use it</div>
    <ul>
      <li>Compare names in the <b>same theme</b> to decide which is the better expression of a trade (e.g. one chip-maker vs another).</li>
      <li>Lower P/E with similar growth = the cheaper bet; higher RSI = more extended near-term.</li>
      <li>No single column wins — weigh valuation against growth and momentum together.</li>
    </ul>` },
  'recommendation': { tag:'Analyze', t:'Recommendation', h:`
    <p>The headline verdict for this ticker — a setup score and a plain-English read that blends the technical picture with the fundamentals.</p>
    <div class="hsub">What feeds the score</div>
    <ul>
      <li><span class="hk">Pattern 34% · Signal 30% · Risk 21% · Fundamentals 15%</span> — the setup combines chart structure, momentum, risk/reward, and a fundamentals/quality sub-score.</li>
      <li>Two <b>confidence dampeners</b> (they don't move the score, only your confidence): an <b>imminent earnings print</b> (≤7 days → gap/IV-crush risk) and a <b>high-VIX regime</b> on a bullish call.</li>
    </ul>
    <div class="hsub">The whole trade plan lives here</div>
    <ul>
      <li><span class="hk">Entry / Stop / Target 1 / Target 2</span> — the four levels that turn the thesis into a trade (entry-to-stop vs entry-to-target is your <b>risk/reward</b>; aim ≥ 2:1). Pick levels when it's a screened name, otherwise computed swing levels.</li>
      <li><span class="hk">Size</span> — how many shares to risk ≈1% / 2% of your book on the distance to the stop (a tight stop → more shares).</li>
      <li>The <b>hand-off</b> + Robinhood buttons carry these levels straight into an order ticket — review/confirm before placing.</li>
    </ul>
    <p>The meta line shows the fundamentals score and any dampeners transparently, so you see exactly what's driving the call. It's a structured read, not advice.</p>` },
  'chart pattern verdict': { tag:'Analyze', t:'Chart Pattern Verdict', h:`
    <p>A <b>second opinion</b> built from price <b>structure alone</b> — completely independent of the recommendation above it (which blends RSI, trend, momentum and fundamentals). This one only reads chart patterns.</p>
    <div class="hsub">How it's built</div>
    <ul>
      <li>Every directional pattern (head &amp; shoulders, cup, double bottom, flags, triangles, wedges) is scanned across <b>every timeframe</b>.</li>
      <li>Each hit votes bull or bear, weighted by its <span class="hk">confidence</span> × <span class="hk">volume/RSI confirmation</span> × the pattern's own <span class="hk">historical hit-rate</span> on this name × the <span class="hk">timeframe</span> (longer = heavier).</li>
      <li>The votes net out to <b>Bullish / Bearish / Mixed / No structure</b> with a conviction %.</li>
    </ul>
    <div class="hsub">The point is agree vs diverge</div>
    <ul>
      <li><span class="hk">Agrees</span> with the Analyze call → two independent reads lining up = higher conviction.</li>
      <li><span class="hk">Diverges</span> → a clean pattern is fighting the blended/fundamental read; size down or wait for them to align.</li>
      <li><span class="hk">No structure</span> → nothing to confirm or contradict; the Analyze call stands alone.</li>
    </ul>
    <p>This pill is the short version — tap <b>📊 Chart</b> to open the analyzer, where the patterns driving it are drawn on the chart with their timeframes, confirmation and hit-rates. Heuristic and for research only.</p>` },
  'interactive chart': { tag:'Analyze', t:'Interactive Chart', h:`
    <p>The full <b>Chart Analyzer</b> — one large price chart you can actually work with (open it with the <b>📊 Chart</b> button by the ticker box or the Chart-read pill).</p>
    <div class="hsub">What it does</div>
    <ul>
      <li><span class="hk">Timeframes</span> — 1M / 3M / 6M / YTD (daily) and 1Y / 5Y (monthly). Moving averages are computed over full history so they span the whole view.</li>
      <li><span class="hk">Line or Candles</span>, plus a volume overlay and an RSI(14) sub-panel.</li>
      <li><span class="hk">Pattern scanner</span> — tap a filter to detect head &amp; shoulders (and inverse), cup &amp; handle, double bottom, bull flag, ascending/descending triangles, falling/rising wedges, or to draw trendlines and support/resistance zones.</li>
      <li>Each detected pattern marks its swing points, draws the neckline/rim &amp; a measured target, and adds a volume/RSI confirmation check plus a historical hit-rate for that pattern on that name.</li>
      <li>When a pattern is selected, the <b>timeframe chips glow</b> (●) for every timeframe that also shows it — your at-a-glance confluence map.</li>
    </ul>
    <div class="hsub">Timeframes change the read</div>
    <ul>
      <li><span class="hk">Short (1M/3M)</span> — a quick, smaller move (days–2 weeks); tighter target/stop, noisier. Tactical.</li>
      <li><span class="hk">Medium (6M/YTD)</span> — a swing move over weeks; larger target, the level matters more. Size like a real position.</li>
      <li><span class="hk">Long (1Y/5Y)</span> — a major structural move over months; slowest but most significant.</li>
      <li><span class="hk">Confluence</span> — the same pattern glowing on several frames is the strongest setup. If frames disagree, the <b>longer</b> one usually wins the bigger picture.</li>
    </ul>
    <div class="hsub">The SMA20 &amp; SMA50 lines</div>
    <ul>
      <li><span class="hk">What they are</span> — the average close over the last 20 (short-term, ~1mo) and 50 (intermediate, ~2½mo) bars; a smoothed trend line. On 1Y/5Y they're 20/50-<i>month</i> averages.</li>
      <li><span class="hk">Price vs line</span> — above = bullish bias, below = bearish; above both = strong uptrend, below both = downtrend, between = transition.</li>
      <li><span class="hk">Slope</span> — rising = strengthening trend, flat = stalling, falling = weakening (SMA20 turns first).</li>
      <li><span class="hk">Support/resistance</span> — in an uptrend, dips often bounce off the SMA20/50 (buy zones + stop refs); in a downtrend they cap rallies.</li>
      <li><span class="hk">20/50 cross</span> — SMA20 above SMA50 = momentum up, below = down (the fast cousin of the 50/200 golden/death cross).</li>
      <li><span class="hk">Gap to line</span> — far above the SMA20 = extended/overbought; hugging a flat MA = consolidation before the next move.</li>
    </ul>
    <p>Heuristic and for research only — a read is a tendency, not a signal.</p>` },
  'limited snapshot data': { tag:'Analyze', t:'Limited Snapshot Data', h:`
    <p>This name doesn't have enough captured history yet for the full analysis, so some cards are locked.</p>
    <p>The producer fetches heavy historical data once per day. A ticker outside your holdings/picks may only get partial coverage until the <b>next full run</b> records its daily bars. Nothing is broken — check back after the next morning scan.</p>` },
  'your position': { tag:'Analyze', t:'Your Position', h:`
    <p>If you already hold this ticker, this card grounds the analysis in <i>your</i> actual position — shares, average cost, current value, and unrealized P&amp;L.</p>
    <p>It changes the question from "is this a good stock?" to "what should <b>I</b> do with what I hold?" — add, trim, hold, or exit — and makes the levels below personally relevant.</p>` },
  'earnings': { tag:'Analyze', t:'Earnings', h:`
    <p>This ticker's next earnings date and recent history. Earnings are the biggest scheduled catalyst — and risk — for a single name.</p>
    <div class="hsub">What to look for</div>
    <ul>
      <li><b>Days until the report</b> — inside ~1–2 weeks, expect elevated option premiums and gap risk.</li>
      <li>Trading <i>through</i> a print is a coin-flip on the reaction; many traders size down or wait until after.</li>
    </ul>` },
  'indicators': { tag:'Analyze', t:'Indicators', h:`
    <p>The full technical indicator panel for this ticker — the momentum, trend, and volatility readings that build the setup score.</p>
    <div class="hsub">Common reads</div>
    <ul>
      <li><span class="hk">RSI</span> — overbought above 70 / oversold below 30.</li>
      <li><span class="hk">Moving averages (50/200-day)</span> — price above = uptrend; a "golden cross" (50 over 200) is a bullish trend signal, a "death cross" the opposite.</li>
      <li><span class="hk">Trend vs the averages</span> tells you whether momentum agrees with the thesis.</li>
      <li><span class="hk">Timeframes</span> (the line under the grid) — the trend on short / medium / long horizons at once. A setup is strongest when they <b>agree</b>; a name up on the day but down on the longer frame is a weaker signal.</li>
    </ul>
    <p>No single indicator is a trigger — they're strongest when several line up.</p>` },
  'historical edge': { tag:'Analyze', t:'Historical Edge', h:`
    <p>A back-test of what <i>usually</i> happened next when this stock was in a similar condition (e.g. a similar RSI). It answers "is this setup actually favorable, historically?"</p>
    <div class="hsub">Reading it</div>
    <ul>
      <li>The <b>match band</b> widens automatically (RSI ±8 up to ±20) until there's a usable sample size — a bigger sample is more reliable.</li>
      <li>It shows the average forward return and how often the move was positive after similar setups.</li>
    </ul>
    <p>History is a guide, not a guarantee — regime changes (rates, sentiment) can break past patterns.</p>` },
  'levels scenarios': { tag:'Analyze', t:'Levels & Scenarios', h:`
    <p>Two things in one card: the price <b>levels</b> that matter, then a bull / base / bear projection anchored to an <b>expected-move band</b>.</p>
    <div class="hsub">Support &amp; resistance</div>
    <ul>
      <li><span class="hk">Support</span> — where buyers have repeatedly stepped in; a logical place to buy and to set a stop just below.</li>
      <li><span class="hk">Resistance</span> — where sellers step in; a logical place to take profit. A clean break above it on volume can become new support. Levels are zones, not exact lines.</li>
    </ul>
    <div class="hsub">The expected-move band</div>
    <ul>
      <li>It's a <b>±1σ (one standard deviation)</b> range — statistically, the stock stays inside it about <b>~68%</b> of the time over the window.</li>
      <li>Labeled <span class="hk">market-implied</span> when built from live option IV (the market's own forecast), or <span class="hk">estimated</span> when using a realized-volatility proxy.</li>
    </ul>
    <p>Use it to sanity-check targets and stops: a target outside the ±1σ band is an aggressive ask.</p>` },
  'options play': { tag:'Analyze', t:'Options Play', h:`
    <p>An options expression of this stock's setup — a way to trade the same thesis with defined risk or leverage instead of shares.</p>
    <div class="hsub">Notes</div>
    <ul>
      <li>It's an <b>estimate</b> unless you already hold live contracts on the name (then it flags your real greeks instead).</li>
      <li>Links over to the full <b>Options</b> tab to build it out.</li>
      <li>Confirm the actual bid/ask and open interest before trading — thin chains can erase the edge.</li>
    </ul>` },
  'valuation catalysts': { tag:'Analyze', t:'Valuation &amp; Catalysts', h:`
    <p>The fundamental case: is the stock cheap or expensive for its growth, and what upcoming events could move it?</p>
    <div class="hsub">What it covers</div>
    <ul>
      <li><span class="hk">Valuation</span> — forward P/E, PEG, analyst target upside; whether the price already bakes in the growth.</li>
      <li><span class="hk">Catalysts</span> — earnings, product cycles, or news that could re-rate the stock.</li>
    </ul>
    <p>Valuation tells you the <i>odds</i>; catalysts tell you the <i>timing</i>. A great business at a stretched price can still be a poor near-term entry.</p>` },
  'sentiment buzz': { tag:'Analyze', t:'Sentiment & Buzz', h:`
    <p>Two qualitative context signals in one card — neither feeds the setup score, both add color the numbers miss.</p>
    <div class="hsub">📰 News</div>
    <ul>
      <li>Recent headlines scored bullish / neutral / bearish. A cluster of bullish headlines into a rising price = narrative and momentum agreeing.</li>
      <li>Bearish news while the stock holds up can signal resilience — or a delayed reaction. Read the actual headlines, not just the color. Sentiment lags fast-breaking events.</li>
    </ul>
    <div class="hsub">🗣️ Retail buzz</div>
    <ul>
      <li>Attention, not opinion — the source has <b>no bull/bear sentiment</b>. Buzz is built from <b>mention rank + velocity</b> (how much it's talked about and how fast that's rising) plus Robinhood popularity.</li>
      <li>Rising buzz can precede volatility in <i>either</i> direction — a spotlight, not a direction. Most quality large-caps barely register; a neutral reading just means "not a meme right now."</li>
    </ul>` },
  'overlap with your book': { tag:'Analyze', t:'Overlap With Your Book', h:`
    <p>How this ticker relates to what you <b>already own</b> — so you don't accidentally double down on the same bet.</p>
    <div class="hsub">Why it matters</div>
    <ul>
      <li>Buying a name that's <b>highly correlated</b> with your big holdings adds concentration, not diversification — they'll fall together.</li>
      <li>Low or negative correlation to your book is what genuinely <b>diversifies</b> risk.</li>
    </ul>
    <p>Check this before adding: a "new" idea that moves with your top position isn't really new exposure.</p>` },
  'compare': { tag:'Analyze', t:'Compare', h:`
    <p>Type a second ticker to put it head-to-head with the one you're analyzing. The fastest way to choose between two candidates.</p>
    <p>Enter a symbol and the comparison table below fills in — valuation, momentum, and quality side by side. Great for "which chipmaker?" or "is my holding still the best name in its theme?"</p>` },
  'when this analysis is wrong': { tag:'Analyze', t:'When This Analysis Is Wrong', h:`
    <p>The pre-mortem: the specific conditions that would <b>break</b> this thesis. The most valuable card on the page, because it's where discipline lives.</p>
    <div class="hsub">How to use it</div>
    <ul>
      <li>It names the levels and events that invalidate the setup — your <b>exit triggers</b>, decided in advance while you're calm.</li>
      <li>Knowing your "I'm wrong" line <i>before</i> entering is what keeps a small planned loss from becoming a big emotional one.</li>
    </ul>
    <p>If you can't articulate what would make you wrong, the position is too speculative to size up.</p>` },

  /* ════════ MARKETS TAB ════════ */
  'indexes': { tag:'Markets', t:'Indexes', h:`
    <p>The major market benchmarks at a glance, with YTD and 5-year context — the backdrop every individual stock trades against.</p>
    <div class="hsub">What to look for</div>
    <ul>
      <li>A stock fighting a falling market needs a strong reason; most names follow the index.</li>
      <li>Compare <b>YTD vs 5Y</b> to gauge whether the current year is normal or stretched relative to the longer trend.</li>
    </ul>` },
  'risk gauges': { tag:'Markets', t:'Risk Gauges', h:`
    <p>A <b>risk-on / risk-off</b> read on market mood, synthesized from how risk assets are moving versus safe havens today.</p>
    <div class="hsub">The logic</div>
    <ul>
      <li><span class="hk">Risk-on</span> — equities and credit outperforming gold and long bonds; appetite for risk is high.</li>
      <li><span class="hk">Risk-off</span> — money fleeing to gold and Treasuries; defensive, fearful tape.</li>
    </ul>
    <p>It frames your day: adding aggressive longs into a hard risk-off tape is fighting the current.</p>` },
  'sector heatmap': { tag:'Markets', t:'Sector Heatmap', h:`
    <p>All eleven market sectors colored by performance — where money is flowing today and over the year. Tap the toggle to switch views.</p>
    <div class="hsub">The two views</div>
    <ul>
      <li><span class="hk">Day</span> — today's move per sector; the short-term rotation.</li>
      <li><span class="hk">vs S&amp;P YTD (relative strength)</span> — each sector's return <i>minus</i> the S&amp;P's, surfacing true <b>leaders and laggards</b> rather than just what's up.</li>
    </ul>
    <p>Leadership rotation is a tell: defensives leading often signals caution; cyclicals/tech leading signals appetite.</p>` },
  'us vs international': { tag:'Markets', t:'US vs International', h:`
    <p>US stocks (SPY) against developed-international (EFA) and emerging markets (EEM), all indexed to compare returns directly.</p>

/* ── payoff-at-expiration diagram ── */
function payoffSeries(spec){
  // Normalize any structure to a list of option legs (+ optional stock leg) so one routine draws
  // single-leg positions, covered calls, debit spreads and collars alike.
  const contracts=spec.contracts||1; let legs, stock=null;
  if(Array.isArray(spec.legs)&&spec.legs.length){
    legs=spec.legs.map(function(l){return {type:l.type,side:l.side,strike:+l.strike,prem:+l.prem||0,qty:l.qty||1};});
    if(spec.stock&&spec.stock.shares)stock={shares:spec.stock.shares,basis:+spec.stock.basis};
  } else {
    legs=[{type:spec.type,side:spec.side,strike:+spec.strike,prem:+spec.prem||0,qty:contracts}];
    if(spec.covered&&spec.type==='call'&&spec.side==='short'&&spec.costBasis!=null)stock={shares:100*contracts,basis:+spec.costBasis};
  }
  const strikes=legs.map(function(l){return l.strike;}).filter(function(s){return s>0;});
  const ref=(spec.px&&spec.px>0)?spec.px:(strikes[0]||1);
  const span=strikes.concat(ref);
  const lo=Math.max(0.01,Math.min.apply(null,span)*0.55), hi=Math.max.apply(null,span)*1.45, N=30;
  const labels=[], data=[];
  for(let i=0;i<=N;i++){ const S=lo+(hi-lo)*i/N; let pl=0;
    legs.forEach(function(l){ const intr=l.type==='call'?Math.max(S-l.strike,0):Math.max(l.strike-S,0); const m=100*l.qty;
      pl+=l.side==='long'?(intr-l.prem)*m:(l.prem-intr)*m; });
    if(stock)pl+=(S-stock.basis)*stock.shares;
    labels.push('$'+(S>=100?Math.round(S):S.toFixed(1))); data.push(+pl.toFixed(0));
  }
  return {labels,data};
}

  if(ovHost){ const v=azChartVerdict(sym); const dirl=(v.dir==='bullish'||v.dir==='bearish');
    let tag=''; try{ const a=analyzeStock(sym); if(a){ const cmp=azVerdictVsAnalyze(v,a.tone); tag='<span style="font-size:11px;font-weight:700;color:'+cmp.color+'">'+cmp.icon+' '+cmp.short+'</span>'; } }catch(e){}
    let h='<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><span style="font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#9ca3af">Chart read</span>'+
      '<span style="padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:'+v.color+'1f;color:'+v.color+'">'+v.icon+' '+v.label.replace(' structure','')+(dirl?' · '+v.conf+'%':'')+'</span>'+tag+'</div>';
    if(v.groups.length)h+='<div style="font-size:10.5px;color:#9ca3af;margin-top:5px;line-height:1.5">'+v.groups.map(g=>(g.bias==='bullish'?'▲':'▼')+' '+g.name+' <span style="opacity:.75">'+g.tfs.join('·')+'</span>').join('   ')+'</div>';

  const det=(_azCM.pattern!=='none'&&S.length>=10)?azCMDetect(S,_azCM.pattern):null;

}
function azCMDetect(S,pat){ switch(pat){
  case 'hs':return azCMHS(S,false); case 'ihs':return azCMHS(S,true); case 'cup':return azCMCup(S); case 'double':return azCMDouble(S); case 'flag':return azCMFlag(S);
  case 'asctri':return azCMTriWedge(S,'asctri'); case 'desctri':return azCMTriWedge(S,'desctri'); case 'fallwedge':return azCMTriWedge(S,'fallwedge'); case 'risewedge':return azCMTriWedge(S,'risewedge');
  case 'trend':return azCMTrend(S); case 'sr':return azCMSR(S); default:return null; } }

/* ── pattern math ─────────────────────────────────────────────────── */
// ZigZag swing pivots: alternating H/L swings, each confirmed only after an adaptive %
// reversal off the running extreme (threshold ≈ 4× the median bar move, clamped 2.5–8%).
// More robust than fixed-window fractals for tight/noisy spacing. A tentative final swing
// is appended so a still-forming right shoulder / handle / flag is visible.
function azCMPivots(S){ const n=S.length; if(n<7)return [];
  const hi=S.map(b=>b.h!=null?b.h:b.c), lo=S.map(b=>b.l!=null?b.l:b.c), cl=S.map(b=>b.c);
  const rs=[]; for(let i=1;i<n;i++)rs.push(Math.abs(cl[i]/cl[i-1]-1)); rs.sort((a,b)=>a-b);
  const med=rs[Math.floor(rs.length/2)]||0.01, thr=Math.min(0.08,Math.max(0.025,med*4));
  const piv=[]; let dir=0, exHi=hi[0], exLo=lo[0], exHiIdx=0, exLoIdx=0;
  for(let i=1;i<n;i++){
    if(dir>0){ if(hi[i]>exHi){exHi=hi[i];exHiIdx=i;} if((exHi-lo[i])/exHi>=thr){ piv.push({i:exHiIdx,type:'H',price:exHi}); dir=-1; exLo=lo[i]; exLoIdx=i; } }
    else if(dir<0){ if(lo[i]<exLo){exLo=lo[i];exLoIdx=i;} if((hi[i]-exLo)/exLo>=thr){ piv.push({i:exLoIdx,type:'L',price:exLo}); dir=1; exHi=hi[i]; exHiIdx=i; } }
    else { if(hi[i]>exHi){exHi=hi[i];exHiIdx=i;} if(lo[i]<exLo){exLo=lo[i];exLoIdx=i;}
      if((exHi-lo[i])/exHi>=thr){ piv.push({i:exHiIdx,type:'H',price:exHi}); dir=-1; exLo=lo[i]; exLoIdx=i; }
      else if((hi[i]-exLo)/exLo>=thr){ piv.push({i:exLoIdx,type:'L',price:exLo}); dir=1; exHi=hi[i]; exHiIdx=i; } }
  }
  if(dir>0)piv.push({i:exHiIdx,type:'H',price:exHi}); else if(dir<0)piv.push({i:exLoIdx,type:'L',price:exLo});
  const seq=[]; for(const p of piv){ const last=seq[seq.length-1]; if(!last||last.type!==p.type)seq.push(p);
    else if((p.type==='H'&&p.price>last.price)||(p.type==='L'&&p.price<last.price))seq[seq.length-1]=p; }
  return seq; }
function _cmNF(title,summary){ return {found:false,title,summary,points:[],lines:[]}; }
function _cmTrendBefore(S,i){ const j=Math.max(0,i-Math.round(i*0.6)-3); return i>3?(S[i].c-S[j].c)/S[j].c:0; }

// Head & Shoulders (top) and its Inverse. inv=true mirrors the logic onto swing lows.
function azCMHS(S,inv){ const title=(inv?'Inverse Head & Shoulders':'Head & Shoulders');
  const piv=azCMPivots(S); const peakT=inv?'L':'H', troughT=inv?'H':'L';
  // peak "size" — for a top, higher price is a bigger peak; for inverse, lower price is.
  const big=(a,b)=>inv?a<b:a>b; const peaks=piv.filter(p=>p.type===peakT);
  if(piv.length<5||peaks.length<3)return _cmNF(title,'Needs three '+(inv?'troughs':'peaks')+' with a deeper middle and a neckline through the swings between them — not present in this window.');
  let best=null;
  for(let s=0;s+4<piv.length;s++){ const w=piv.slice(s,s+5);
    if(!(w[0].type===peakT&&w[1].type===troughT&&w[2].type===peakT&&w[3].type===troughT&&w[4].type===peakT))continue;
    const LS=w[0],T1=w[1],H=w[2],T2=w[3],RS=w[4];
    if(!(big(H.price,LS.price)&&big(H.price,RS.price)))continue; // head most extreme
    const span=Math.abs(H.price);
    const shoulderSym=Math.abs(LS.price-RS.price)/span;                 // shoulders level?
    const headProm=Math.abs(H.price-(inv?Math.min(LS.price,RS.price):Math.max(LS.price,RS.price)))/span;
    const neckSlope=Math.abs(T1.price-T2.price)/span;                   // neckline roughly flat?
    if(shoulderSym>0.10||headProm<0.02||neckSlope>0.07)continue;
    const trend=_cmTrendBefore(S,LS.i)*(inv?-1:1);                      // prior up-(down for inv)trend into LS
    let conf=70; conf+=(0.06-Math.min(shoulderSym,0.06))/0.06*12; conf+=Math.min(headProm,0.12)/0.12*10;
    conf+=(0.05-Math.min(neckSlope,0.05))/0.05*5; conf+=trend>0?5:-8; conf=Math.max(35,Math.min(95,Math.round(conf)));
    if(!best||conf>best.conf)best={conf,LS,T1,H,T2,RS}; }
  if(!best)return _cmNF(title,'Found swing structure but no clean three-'+(inv?'trough':'peak')+' set with a deeper '+(inv?'middle low':'head')+', level shoulders and a flat neckline.');
  const {LS,T1,H,T2,RS}=best, n=S.length;
  const neckAt=i=>T1.price+(T2.price-T1.price)*((i-T1.i)/((T2.i-T1.i)||1));
  const height=Math.abs(H.price-neckAt(H.i)); const tgt=inv?neckAt(n-1)+height:neckAt(n-1)-height;
  const col=inv?'#10b981':'#ef4444';
  return { found:true, conf:best.conf, title,
    points:[{i:LS.i,price:LS.price,color:'#f59e0b',label:'Left shoulder'},{i:H.i,price:H.price,color:col,label:inv?'Head (low)':'Head (high)'},{i:RS.i,price:RS.price,color:'#f59e0b',label:'Right shoulder'}],
    lines:[{i0:T1.i,p0:T1.price,i1:n-1,p1:neckAt(n-1),color:'#6366f1',dash:[6,4],width:1.6,label:'Neckline'},
           {i0:Math.min(LS.i,H.i),p0:tgt,i1:n-1,p1:tgt,color:col,dash:[3,4],width:1.2,label:'Target'}],
    target:tgt, neckline:+neckAt(n-1).toFixed(2),
    bias:inv?'bullish':'bearish',
    summary:(inv?'Bullish reversal':'Bearish reversal')+' — three '+(inv?'troughs with a deeper middle low':'peaks with a higher middle (the head)')+', shoulders roughly level. A '+(inv?'close above':'close below')+' the neckline ($'+(+neckAt(n-1).toFixed(2))+') confirms; the measured move projects ≈ the head depth to about $'+tgt.toFixed(2)+'.',
    how:(inv?'Trigger on a neckline breakout (ideally on rising volume); invalidated on a relapse below the right-shoulder low.':'Trigger on a neckline breakdown (ideally on rising volume); invalidated on a recovery above the right shoulder. Until the neckline breaks it is still just a shape.') }; }

// Cup with Handle — rounded base between two rims at a similar level, then a shallow handle.
function azCMCup(S){ const title='Cup with Handle'; const c=S.map(b=>b.c), n=c.length; if(n<22)return _cmNF(title,'Needs a longer base (rounded cup + handle) than this window holds.');
  const highs=azCMPivots(S).filter(p=>p.type==='H'); if(highs.length<2)return _cmNF(title,'No two rim-highs at a similar level with a rounded base between them.');
  let best=null;
  for(let a=0;a<highs.length-1;a++){ for(let b=a+1;b<highs.length;b++){ const L=highs[a],R=highs[b]; const cupLen=R.i-L.i; if(cupLen<8)continue;
    let bi=L.i,bv=Infinity; for(let i=L.i;i<=R.i;i++)if(c[i]<bv){bv=c[i];bi=i;} const rim=Math.min(L.price,R.price);
    const depth=(rim-bv)/rim; if(depth<0.12||depth>0.55)continue; const rimSym=Math.abs(L.price-R.price)/rim; if(rimSym>0.08)continue;
    const posFrac=(bi-L.i)/cupLen; // U-shape → bottom near the middle (V-bottoms penalized)
    // handle: shallow pullback after the right rim, not retracing more than ~half the cup
    const tail=c.slice(R.i); let hLow=R.price,hIdx=R.i; for(let i=R.i;i<n;i++)if(c[i]<hLow){hLow=c[i];hIdx=i;}
    const handleDepth=(R.price-hLow)/R.price, handleLen=n-1-R.i, hasHandle=handleLen>=2&&handleDepth>0.005&&handleDepth<depth*0.6;
    let conf=60; conf+=(1-Math.min(rimSym,0.08)/0.08)*12; conf+=(1-Math.abs(posFrac-0.5)/0.5)*12; conf+=hasHandle?14:-6;
    conf+=(depth>=0.15&&depth<=0.4)?4:0; conf=Math.max(35,Math.min(93,Math.round(conf)));
    if(!best||conf>best.conf)best={conf,L,R,bi,bv,rim,depth,hasHandle,hLow,hIdx,handleDepth}; } }
  if(!best)return _cmNF(title,'Saw highs but no rounded base recovering to a matching rim with a shallow handle.');
  const {L,R,bi,bv,rim,depth,hasHandle,hLow,hIdx}=best, tgt=rim+depth*rim;
  const pts=[{i:L.i,price:L.price,color:'#f59e0b',label:'Left rim'},{i:bi,price:bv,color:'#6366f1',label:'Cup base'},{i:R.i,price:R.price,color:'#f59e0b',label:'Right rim'}];
  if(hasHandle)pts.push({i:hIdx,price:hLow,color:'#10b981',label:'Handle low'});

           {i0:bi,p0:tgt,i1:S.length-1,p1:tgt,color:'#10b981',dash:[3,4],width:1.2,label:'Target'}],
    target:tgt, breakout:+rim.toFixed(2),
    summary:'Bullish continuation — a '+(depth*100).toFixed(0)+'%-deep rounded base recovered to its rim'+(hasHandle?', then a shallow handle drift':' (handle not yet clearly formed)')+'. A breakout above the rim ($'+rim.toFixed(2)+') projects roughly the cup depth to about $'+tgt.toFixed(2)+'.',
    how:'Buy strength through the rim, ideally as handle volume dries up then expands on the breakout. Invalidated if it sinks back into the lower half of the cup or the handle gives back more than ~half its depth.' }; }

// Double Bottom — two swing lows at a similar level with a peak between (W), reversal up.
function azCMDouble(S){ const title='Double Bottom'; const piv=azCMPivots(S); const lows=piv.filter(p=>p.type==='L');
  if(lows.length<2)return _cmNF(title,'No two swing lows at a matching level with a peak between them.');
  const c=S.map(b=>b.c), n=S.length; let best=null;
  for(let a=0;a<lows.length-1;a++){ for(let b=a+1;b<lows.length;b++){ const L1=lows[a],L2=lows[b]; if(L2.i-L1.i<6)continue;
    const eq=Math.abs(L1.price-L2.price)/Math.min(L1.price,L2.price); if(eq>0.04)continue;
    let mi=L1.i,mv=-Infinity; for(let i=L1.i;i<=L2.i;i++)if(c[i]>mv){mv=c[i];mi=i;} const lowAvg=(L1.price+L2.price)/2;
    const prom=(mv-lowAvg)/lowAvg; if(prom<0.04)continue; const trend=_cmTrendBefore(S,L1.i);
    let conf=64; conf+=(1-Math.min(eq,0.04)/0.04)*16; conf+=Math.min(prom,0.2)/0.2*12; conf+=trend<0?6:-6; conf=Math.max(35,Math.min(94,Math.round(conf)));
    if(!best||conf>best.conf)best={conf,L1,L2,mi,mv,lowAvg}; } }
  if(!best)return _cmNF(title,'Found swing lows but none paired at a similar level with a strong enough peak between them.');
  const {L1,L2,mi,mv,lowAvg}=best, tgt=mv+(mv-lowAvg);

    lines:[{i0:mi,p0:mv,i1:n-1,p1:mv,color:'#6366f1',dash:[6,4],width:1.6,label:'Neckline'},
           {i0:L1.i,p0:tgt,i1:n-1,p1:tgt,color:'#10b981',dash:[3,4],width:1.2,label:'Target'}],
    target:tgt, neckline:+mv.toFixed(2),
    summary:'Bullish reversal — two lows near $'+lowAvg.toFixed(2)+' (a "W") with a peak between. A close above the middle peak / neckline ($'+mv.toFixed(2)+') confirms and projects to about $'+tgt.toFixed(2)+' (the W height added to the breakout).',

// Bull Flag — a sharp pole, then a shallow downward/sideways consolidation, continuation up.
function azCMFlag(S){ const title='Bull Flag'; const c=S.map(b=>b.c), n=S.length; if(n<12)return _cmNF(title,'Needs a sharp advance (pole) then a short pullback (flag) — window too short.');
  let best=null;
  for(let pe=6;pe<n-2;pe++){ for(let pl=4;pl<=16;pl++){ const ps=pe-pl; if(ps<0)continue; const pole=(c[pe]-c[ps])/c[ps]; if(pole<0.12)continue;
    const flagLen=n-1-pe; if(flagLen<3||flagLen>pl*1.6)continue; let fmin=c[pe],fmax=c[pe]; for(let i=pe;i<n;i++){ if(c[i]<fmin)fmin=c[i]; if(c[i]>fmax)fmax=c[i]; }
    const retr=(c[pe]-fmin)/(c[pe]-c[ps]); if(retr<0.1||retr>0.5)continue;     // a genuine, shallow pullback (not just continued trend)
    if(fmax>c[pe]*1.08)continue;                                              // a flag consolidates — it shouldn't keep making big new highs (that's just trend)
    if(c[n-1]<fmin*1.001)continue;                                            // flag not broken down
    const tight=(fmax-fmin)/c[pe];                                            // tight channel preferred
    let conf=58; conf+=Math.min(pole,0.5)/0.5*16; conf+=(1-Math.min(retr,0.5)/0.5)*14; conf+=(0.12-Math.min(tight,0.12))/0.12*8;
    conf=Math.max(35,Math.min(93,Math.round(conf)));
    if(!best||conf>best.conf)best={conf,ps,pe,pole,fmin,fmax,flagLen}; } }
  if(!best)return _cmNF(title,'No sharp pole followed by a shallow, intact consolidation — either no strong run or the pullback ran too deep.');
  const {ps,pe,pole,fmin,fmax}=best, n2=S.length; const tgt=fmax+(c[pe]-c[ps]);
  return { found:true, conf:best.conf, title, bias:'bullish',
    points:[{i:ps,price:c[ps],color:'#6366f1',label:'Pole base'},{i:pe,price:c[pe],color:'#10b981',label:'Pole top'},{i:n2-1,price:c[n2-1],color:'#f59e0b',label:'Flag (now)'}],
    lines:[{i0:pe,p0:fmax,i1:n2-1,p1:fmax,color:'#6366f1',dash:[6,4],width:1.6,label:'Flag top / breakout'},
           {i0:ps,p0:tgt,i1:n2-1,p1:tgt,color:'#10b981',dash:[3,4],width:1.2,label:'Target'}],
    target:tgt, breakout:+fmax.toFixed(2),
    summary:'Bullish continuation — a +'+(pole*100).toFixed(0)+'% pole then a shallow consolidation that held above support. A breakout over the flag top ($'+fmax.toFixed(2)+') projects the pole height to about $'+tgt.toFixed(2)+'.',
    how:'Enter on the flag-top breakout, ideally on a volume expansion after the pullback’s volume faded. Invalidated if it breaks below the flag low (the consolidation’s bottom).' }; }

// Least-squares fit over pivot points → {m:slope per bar, b:intercept}.
function _cmFit(pts){ const n=pts.length; if(n<2)return null; let sx=0,sy=0,sxx=0,sxy=0; for(const p of pts){ sx+=p.i; sy+=p.price; sxx+=p.i*p.i; sxy+=p.i*p.price; } const d=n*sxx-sx*sx; if(!d)return null; const m=(n*sxy-sx*sy)/d; return {m,b:(sy-m*sx)/n}; }
// Converging trendline geometry from recent swing highs/lows — drives triangles & wedges.
function _cmGeom(S){ const piv=azCMPivots(S); const H=piv.filter(p=>p.type==='H'), L=piv.filter(p=>p.type==='L'); if(H.length<2||L.length<2)return null;
  const hh=H.slice(-3), ll=L.slice(-3), fh=_cmFit(hh), fl=_cmFit(ll); if(!fh||!fl)return null;
  const avg=S.reduce((a,b)=>a+b.c,0)/S.length, i0=Math.min(hh[0].i,ll[0].i), iL=Math.max(hh[hh.length-1].i,ll[ll.length-1].i), i1=S.length-1;
  const res=i=>fh.m*i+fh.b, sup=i=>fl.m*i+fl.b, wStart=res(i0)-sup(i0), wEnd=res(iL)-sup(iL);
  // convergence measured over the pivot span (not extrapolated past the data, where lines cross at the apex)
  const apex=(fh.m-fl.m)!==0?(fl.b-fh.b)/(fh.m-fl.m):1e9;
  return { H:hh, L:ll, fh, fl, avg, i0, iL, i1, apex, mhN:fh.m/avg, mlN:fl.m/avg, wStart, wEnd, converging:wEnd>0&&wEnd<wStart*0.85 }; }
// Triangles (flat side + sloping side) and wedges (both sides sloping, converging).
function azCMTriWedge(S,kind){ const titles={asctri:'Ascending Triangle',desctri:'Descending Triangle',fallwedge:'Falling Wedge',risewedge:'Rising Wedge'};
  const g=_cmGeom(S), title=titles[kind]; if(!g)return _cmNF(title,'Needs at least two swing highs and two swing lows forming converging trendlines — not present here.');
  // triangle = one side flat + the other clearly sloped; wedge = both sides sloped the same way + converging.
  const FLAT=0.0018, SLOPE=0.0025; const up=v=>v>SLOPE, dn=v=>v<-SLOPE, flat=v=>Math.abs(v)<=FLAT, dnAny=v=>v<-FLAT, upAny=v=>v>FLAT;
  const minH=Math.abs(g.wStart)/g.avg>=0.03; let ok=false, bias='neutral';
  if(kind==='asctri'){ ok=flat(g.mhN)&&up(g.mlN); bias='bullish'; }       // flat ceiling + rising lows
  else if(kind==='desctri'){ ok=flat(g.mlN)&&dn(g.mhN); bias='bearish'; } // flat floor + falling highs
  else if(kind==='fallwedge'){ ok=dnAny(g.mhN)&&dnAny(g.mlN)&&g.converging; bias='bullish'; }
  else if(kind==='risewedge'){ ok=upAny(g.mhN)&&upAny(g.mlN)&&g.converging; bias='bearish'; }
  ok=ok&&minH;
  if(!ok)return _cmNF(title,'Found swing structure but the trendline slopes don’t match a '+title.toLowerCase()+' (highs '+(g.mhN>FLAT?'rising':g.mhN<-FLAT?'falling':'flat')+', lows '+(g.mlN>FLAT?'rising':g.mlN<-FLAT?'falling':'flat')+(minH?'':'; range too tight')+').');
  const n=S.length, resAt=i=>g.fh.m*i+g.fh.b, supAt=i=>g.fl.m*i+g.fl.b, height=Math.abs(g.wStart);
  // draw the converging lines out to the apex (or the last bar, whichever comes first) so they don't cross visually
  const iEnd=(g.apex>g.iL&&g.apex<n-1)?Math.round(g.apex):n-1;
  const bullBreak=bias==='bullish', bk=bullBreak?resAt(iEnd):supAt(iEnd), tgt=bullBreak?bk+height:bk-height;
  const pts=g.H.map(p=>({i:p.i,price:p.price,color:'#ef4444',label:'Swing high'})).concat(g.L.map(p=>({i:p.i,price:p.price,color:'#10b981',label:'Swing low'})));
  const conf=Math.max(40,Math.min(90,Math.round(58+(g.converging?12:0)+Math.min(g.H.length+g.L.length,6)*3+(height/g.avg>0.05?6:0))));
  return { found:true, conf, title, bias, points:pts,
    lines:[{i0:g.i0,p0:resAt(g.i0),i1:iEnd,p1:resAt(iEnd),color:'#ef4444',dash:[6,4],width:1.5,label:'Resistance'},
           {i0:g.i0,p0:supAt(g.i0),i1:iEnd,p1:supAt(iEnd),color:'#10b981',dash:[6,4],width:1.5,label:'Support'},
           {i0:Math.floor((g.i0+n-1)/2),p0:tgt,i1:n-1,p1:tgt,color:bullBreak?'#10b981':'#ef4444',dash:[3,4],width:1.2,label:'Target'}],
    breakout:+bk.toFixed(2), target:tgt,
    summary:(bias==='bullish'?'Bullish':'Bearish')+' — '+(kind==='asctri'?'a flat resistance ceiling with higher lows pressing into it':kind==='desctri'?'a flat support floor with lower highs pressing down':kind==='fallwedge'?'two down-sloping lines converging (a falling wedge typically resolves up)':'two up-sloping lines converging (a rising wedge typically resolves down)')+'. A '+(bullBreak?'break above resistance':'break below support')+' (~$'+bk.toFixed(2)+') projects the pattern height to about $'+tgt.toFixed(2)+'.',
    how:'Wait for a decisive close '+(bullBreak?'above the upper line':'below the lower line')+' — ideally on expanding volume. Until it breaks, price can keep ping-ponging inside the lines; the apex is where it must resolve. Invalidated on a close back through the opposite line.' }; }

/* Numeric value for a sortable column (parses the formatted strings the row carries). */
function pickSortVal(c,key){
  const liveRsi=_picksRSI[c.ticker]!=null?_picksRSI[c.ticker]:c.rsi;
  const liveP=(_picksLive[c.ticker]&&_picksLive[c.ticker].price)||c.price;
  switch(key){
    case 'ticker': return c.ticker;
    case 'price': return liveP;
    case 'rsi': return liveRsi;
    case 'fwdPE': { const n=parseFloat(c.fwdPE); return isFinite(n)?n:1e9; }
    case 'rr': { const n=parseFloat(c.rr); return isFinite(n)?n:-1; }
    case 'rev': { const n=parseFloat(String(c.revGrowth).replace('+','')); return isFinite(n)?n:-1e9; }
    case 'tech': return c.tech; case 'fund': return c.fund; case 'social': return c.social!=null?c.social:5;
    case 'rank': return c.rank;
    default: return c.composite;
  }
}
function renderPicksTable(){
  const el=document.getElementById('picks-table'); if(!el)return;
  // filter
  let rows=PICK_CANDIDATES.filter(c=>{
    if(_pickFilter.sector!=='all'&&pickSector(c)!==_pickFilter.sector)return false;
    if(_pickFilter.hideFlagged&&c.flag&&c.flag!=='ok')return false;
    return true;
  });
  // sort
  const sk=_pickSort.key,dir=_pickSort.dir;
