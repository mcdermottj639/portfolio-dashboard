/* ═══ Shared execution guards for the agentic account ═══════════════════════════════════════════
   Two surfaces now read these — the Agentic Portfolio card (Accounts tab) and the Plan tab's
   agentic side — and BOTH mirror producer/agentic-deploy.mjs. Extracted (v108) so the card, the
   plan page and the producer's ticket can't drift apart: a badge that says "buy deferred" while
   the executor buys anyway is worse than no badge. Constants mirror agentic-deploy.mjs exactly. */
const AG_EARN_BLACKOUT_D=7,      // EARNINGS_BLACKOUT_DAYS — no NEW money ≤7d before a print
      AG_ENTRY_TOL_PCT=2.5,      // ENTRY_TOLERANCE_PCT — how far under the floor before below-entry
      AG_ENTRY_PREM_PCT=2.0,     // ENTRY_PREMIUM_PCT — how far over the ceiling before above-entry
      AG_ENTRY_STALE_D=7,        // ENTRY_ZONE_STALE_DAYS — older zones go ADVISORY
      AG_WASH_WINDOW_D=30,       // WASH_WINDOW_DAYS — IRS wash-sale window
      AG_MIN_HOLD_D=14,          // MIN_HOLD_DAYS
      AG_REENTRY_D=14,           // REENTRY_COOLDOWN_DAYS
      AG_AUTO_CAP=10000,         // AUTO_TURNOVER_CAP — unattended-execution ceiling per ticket (owner raised $1,000 → $10,000, 2026-08-25)
      AG_MIN_BUY=25,             // MIN_BUY — dust floor
      AG_IDLE_DEPLOY_D=10,       // CASH_IDLE_DEPLOY_DAYS — idle-cash deadline
      AG_IDLE_TRANCHE_PCT=34,    // CASH_IDLE_TRANCHE_PCT
      AG_IDLE_SWEEP_FLOOR=250,   // CASH_IDLE_SWEEP_FLOOR
      AG_PARK_VEHICLE='VTI',     // PARK_VEHICLE — the waiting ground
      AG_PARK_MIN=100,           // PARK_MIN
      AG_CLUSTER_CAP=48,         // riskweights.mjs CLUSTER_CAPS['megacap-tech']
      AG_DEFENSIVE_MIN=15;       // riskweights.mjs AG_DEFENSIVE_MIN — the book's only FLOOR (v124)
const agToday=()=>new Date().toISOString().slice(0,10);
/* Best live price for a name in the agentic book: the held position's mark → today's pick scan →
   the recorded quote. Shared so the card and the Plan page price the same guards identically. */
function agenticPxOf(sym,heldPos){
  const h=(heldPos||[]).find(p=>p&&p.symbol===sym); if(h&&h.px>0)return h.px;
  const pk=(typeof azPick==='function')?azPick(sym):null; if(pk&&pk.price>0)return pk.price;
  const q=(typeof azQuote==='function')?azQuote(sym):null;
  if(q){ const p=parseFloat(q.last_extended_hours_trade_price||q.last_trade_price||q.ask_price||q.mark_price||q.adjusted_previous_close||0)||0; if(p>0)return p; }
  return 0;
}
/* Wash-sale ledger → {SYM:{until,date,account}} for names still inside the window. data.agentic
   .recentLosses spans BOTH taxable books since v105 (each entry tagged `account`) because the IRS
   window is per TAXPAYER — a loss booked in ••••0741 blocks a rebuy in ••••3900 too. */
function agenticWashMap(A){
  const today=agToday(), m={};
  if(A&&Array.isArray(A.recentLosses)) for(const e of A.recentLosses){
    if(!e||!e.sym||!e.date)continue;
    const d=new Date(e.date+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+AG_WASH_WINDOW_D+1);
    const until=d.toISOString().slice(0,10);
    if(until>today&&(!m[e.sym]||until>m[e.sym].until)) m[e.sym]={until,date:e.date,account:e.account||'agentic'};
  }
  return m;
}
/* Parse a research entry zone ("120-135", "at market; core hold", "$120 – $135") → {lo,hi}. */
function agenticEntryBounds(e){
  if(!e)return{lo:0,hi:0};
  const m=String(e).replace(/,/g,'').match(/\d+(\.\d+)?/g); if(!m||!m.length)return{lo:0,hi:0};
  const lo=parseFloat(m[0]), hi=m.length>1?parseFloat(m[1]):lo;
  return (hi>=lo)?{lo,hi}:{lo,hi:lo};
}
/* Execution-discipline deferrals for research-target names. `rows` = [{sym,px,_entry,_stop}].
   Returns {map,zoneAge,stale}. The entry band is SYMMETRIC, TOLERANCED and AGEING (v102): a 0.2%
   miss under the floor must not park a position, a name trading ABOVE its zone is deferred too, and
   zones older than AG_ENTRY_STALE_D go advisory — when a whole target reads out-of-band at once the
   guard is measuring its own staleness, not the companies. `below-stop` stays absolute: that one is
   the real thesis-broken signal. A wash-blocked name is skipped — that deferral owns the name. */
function agenticExecMap(rows,targetAsOf,washMap){
  const today=agToday(), P=(v)=>'$'+(+v).toFixed(2), map={};
  const zoneAge=(()=>{ if(!targetAsOf)return null;
    const a=Date.parse(String(targetAsOf).slice(0,10)+'T00:00:00Z'), b=Date.parse(today+'T00:00:00Z');
    return (isFinite(a)&&isFinite(b))?Math.round((b-a)/86400000):null; })();
  const stale=zoneAge!=null&&zoneAge>AG_ENTRY_STALE_D;
  for(const x of (rows||[])){
    if(!x||!x.sym)continue;
    if(washMap&&washMap[x.sym])continue;
    const er=(typeof azEarn==='function')?azEarn(x.sym):null;
    let dAway=null;
    if(er&&er.date){ const d=Date.parse(String(er.date).slice(0,10)+'T00:00:00Z');
      if(isFinite(d))dAway=Math.round((d-Date.parse(today+'T00:00:00Z'))/86400000); }
    const {lo:eLow,hi:eHigh}=agenticEntryBounds(x._entry), stop=+x._stop||0, px=+x.px||0;
    if(dAway!=null&&dAway>=0&&dAway<=AG_EARN_BLACKOUT_D)
      map[x.sym]={reason:'earnings',until:er.date,label:`⏸ earns ${(typeof azDateLbl==='function')?azDateLbl(er.date):er.date}`,note:`reports ${er.date} (≤${AG_EARN_BLACKOUT_D}d) — wait for the print, then buy with full info`};
    else if(px>0&&stop>0&&px<=stop)
      map[x.sym]={reason:'below-stop',label:'⚠️ below stop',note:`${P(px)} is at/below the target stop ${P(stop)} — setup broken, re-verify before deploying`};
    else if(!stale&&px>0&&eLow>0&&px<eLow*(1-AG_ENTRY_TOL_PCT/100))
      map[x.sym]={reason:'below-entry',label:'⚠️ re-verify',note:`${P(px)} is ${((1-px/eLow)*100).toFixed(1)}% below planned entry ${x._entry} (tolerance ${AG_ENTRY_TOL_PCT}%) — re-check the thesis (esp. post-earnings) before buying`};
    else if(!stale&&px>0&&eHigh>0&&px>eHigh*(1+AG_ENTRY_PREM_PCT/100))
      map[x.sym]={reason:'above-entry',label:'⏳ wait for pullback',note:`${P(px)} is ${((px/eHigh-1)*100).toFixed(1)}% above planned entry ${x._entry} (tolerance ${AG_ENTRY_PREM_PCT}%) — the research priced this entry deliberately; chasing it gives up the reward:risk`};
  }
  return {map,zoneAge,stale};
}

/* The account's book, derived one way for every surface on this page (the hero, the perf card and
   the tracker card all need it — keep them incapable of disagreeing). */
function agenticBook(A){
  const cash=A?Math.max(0,+A.cash||0):0;
  const held=(A&&Array.isArray(A.positions))?A.positions.filter(p=>p&&p.symbol&&p.qty>0):[];
  const invested=held.reduce((s,p)=>s+Math.max(0,+p.value||0),0);
  return { cash, held, invested, equity:A?(+A.equity||(cash+invested)):0 };
}

/* Account-level day move: only the positions move, so this sums qty×(px − prior close) from the
   live quotes and expresses it against equity (cash included) — "how much did the account move
   today", the same basis renderSnapshot uses for the margin book. */
function agenticDay(A){
  const held=(A&&Array.isArray(A.positions))?A.positions.filter(p=>p&&p.symbol&&p.qty>0):[];
  let now=0, prev=0;
  for(const p of held){
    const q=(typeof azQuote==='function')?azQuote(p.symbol):null;
    const pc=q?(parseFloat(q.adjusted_previous_close||q.previous_close||0)||0):0;
    const px=+p.px||0, qty=+p.qty||0;
    if(pc>0&&px>0){ now+=qty*px; prev+=qty*pc; }
  }
  return prev>0?{d:now-prev, base:prev}:null;
}

function renderAgenticPerf(){

  const lbl=t=>{ try{ return new Date(dkey(t)+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){ return dkey(t); } };
  const sinceLbl=lbl(st.since);

  // series ends on the live figure — but the RETURN stays the recorded, deposit-adjusted one.

function renderAgenticCard(){
  const el=document.getElementById('agentic-content'); if(!el)return;
  const A=(window.__DATA&&window.__DATA.agentic)||null;
  const {cash,held:heldPos,invested:investedNow,equity}=agenticBook(A);
  const book=Math.max(0,equity);            // unlevered: the account's own equity IS the book (1×)
  const P=(v)=>'$'+(+v).toFixed(2);
  const ovMap=(window.__SNAP&&window.__SNAP.ovMap)||{};
  const smaMap=(window.__SNAP&&window.__SNAP.smaMap)||{};
  const secOfPick=(c)=>(typeof pickSector==='function')?pickSector(c):(String(c.sector||'').split('·')[0].trim()||'—');
  const secOf=(sym)=>{ const o=ovMap[sym]; let s=o&&o.Sector?titleCase(o.Sector):null;
    if(s&&/^(N\/?A|None|Trade Commercial)$/i.test(s))s=null;
    if(!s&&typeof ASSET_MAP!=='undefined'&&ASSET_MAP[sym]&&ASSET_MAP[sym]!=='Stocks')s=ASSET_MAP[sym];
    return s||'—'; };
  const pxOf=(sym)=>agenticPxOf(sym,heldPos);
  // ── Wash-sale guard (taxable accounts): data.agentic.recentLosses is a rolling ledger of realized
  //    losses (broker trade history; since v105 it spans BOTH taxable accounts — ••••3900 AND the
  //    self-directed ••••0741, each entry tagged `account` — because the IRS window is per taxpayer,
  //    not per account). Buying any name back inside 30 calendar days of realizing a loss on it
  //    disallows the loss, so we BLOCK that name from the deploy hand-off and flag its Trade cell
  //    "wait" until the window clears. The target WEIGHT is unchanged — only the execution is deferred. ──
  const _todayISO=agToday();
  const washMap=agenticWashMap(A);   // shared with the Plan tab's agentic side (v108)
  const washUntilLbl=(sym)=>{ const w=washMap[sym]; if(!w)return ''; const d=new Date(w.until+'T00:00:00Z'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
  // ── target names: prefer the persisted research-driven target (data.agentic.target, refreshed weekly
  //    by the deep multi-factor research) so the card shows drift vs. the REAL deployed basket; fall back
  //    to an on-the-fly heuristic pool (top picks + leaders + index + held) only when it's absent. ──
  const T=(A&&A.target&&Array.isArray(A.target.names)&&A.target.names.length)?A.target.names:null;
  const heldValOf=(sym)=>{ const h=heldPos.find(p=>p.symbol===sym); return h?Math.max(0,+h.value||0):0; };
  let chosen, targetSrc, targetAsOf=(A&&A.target&&A.target.asOf)||null;
  if(T){
    targetSrc='research';
    chosen=T.map(n=>{ const sym=n.ticker; if(!sym)return null; const cv=heldValOf(sym);
      return {sym,sector:n.sector||secOf(sym),tgt:+n.weightPct||0,px:pxOf(sym),curVal:cv,held:cv>0,kind:'',_stop:+n.stop||0,_tp:+n.target||0,_entry:n.entry||''}; }).filter(Boolean);
    const tsum=chosen.reduce((s,x)=>s+x.tgt,0)||1; chosen.forEach(x=>{ x.tgt=x.tgt/tsum*100; });
    chosen.sort((a,b)=>b.tgt-a.tgt);
  } else {
    targetSrc='heuristic';
    // candidate pool — fully independent of the margin book
    const pool=new Map();
  heldPos.forEach(p=>{ pool.set(p.symbol,{sym:p.symbol,sector:secOf(p.symbol),score:6,curVal:Math.max(0,+p.value||0),px:p.px||pxOf(p.symbol),held:true,kind:''}); });
  const pickRows=[...((typeof PICK_PICKS!=='undefined'&&Array.isArray(PICK_PICKS))?PICK_PICKS:[]),
                 ...((typeof PICK_CANDIDATES!=='undefined'&&Array.isArray(PICK_CANDIDATES))?PICK_CANDIDATES:[])];
  pickRows.forEach(c=>{ const t=c&&c.ticker; if(!t)return; const comp=(typeof c.composite==='number')?c.composite:null;
    if(c.downtrend||c.cooldown){ if(!pool.has(t))return; }   // never seed the target from a falling knife / recent stop-out (held names still count)
    if(pool.has(t)){ const e=pool.get(t); if(!e.kind)e.kind='pick'; if(comp!=null)e.score=Math.max(e.score,comp); }
    else if(comp!=null){ pool.set(t,{sym:t,sector:secOfPick(c)||'—',score:comp,curVal:0,px:pxOf(t),held:false,kind:'pick'}); } });
  [{sym:'SPY',base:6.4},{sym:'QQQ',base:5.9}].forEach(ix=>{ if(pool.has(ix.sym))return; const px=pxOf(ix.sym);
    let s=ix.base; const sm=smaMap[ix.sym]; if(sm&&px>0)s+= px>=sm?0.4:-0.6;
    pool.set(ix.sym,{sym:ix.sym,sector:'Index',score:s,curVal:0,px,held:false,kind:'index'}); });
  const LEADERS=(()=>{ try{ const dl=window.__DATA&&window.__DATA.leaders; if(Array.isArray(dl)&&dl.length)return dl; }catch(e){}
    return [{sym:'NVDA',sector:'Technology'},{sym:'MSFT',sector:'Technology'},{sym:'AAPL',sector:'Technology'},{sym:'AVGO',sector:'Technology'},{sym:'GOOGL',sector:'Communication Services'},{sym:'META',sector:'Communication Services'},{sym:'AMZN',sector:'Consumer Cyclical'},{sym:'LLY',sector:'Healthcare'},{sym:'UNH',sector:'Healthcare'},{sym:'JPM',sector:'Financial Services'},{sym:'V',sector:'Financial Services'},{sym:'COST',sector:'Consumer Defensive'},{sym:'WMT',sector:'Consumer Defensive'},{sym:'XOM',sector:'Energy'}]; })();
  LEADERS.forEach(ld=>{ const sym=ld&&ld.sym; if(!sym||pool.has(sym))return; const px=pxOf(sym); if(!(px>0))return;
    let s=6; const sm=smaMap[sym]; if(sm)s+= px>=sm?0.4:-0.4;
    pool.set(sym,{sym,sector:ld.sector||secOf(sym),score:s,curVal:0,px,held:false,kind:'leader'}); });
  // ── selection: incumbents (current agentic holdings) guaranteed in, best non-held fill, sector-capped ──
  const TOTAL_CAP=15, PER_SEC=4;
  const heldArr=[...pool.values()].filter(x=>x.held).sort((a,b)=>b.curVal-a.curVal);
  const ADD_SLOTS=Math.max(3,12-heldArr.length);
    chosen=heldArr.slice(0,TOTAL_CAP);
  const secCount={}; chosen.forEach(x=>{ const s=x.sector||'—'; if(s!=='—')secCount[s]=(secCount[s]||0)+1; });
  const addPool=[...pool.values()].filter(x=>!x.held&&x.px>0).sort((a,b)=>b.score-a.score);
  let added=0;
  for(const x of addPool){ if(chosen.length>=TOTAL_CAP||added>=ADD_SLOTS)break; const s=x.sector||'—';
    if(s!=='—'&&(secCount[s]||0)>=PER_SEC)continue; chosen.push(x); secCount[s]=(secCount[s]||0)+1; added++; }
  if(chosen.length<3){ el.innerHTML=`<div class="tech-empty">Not enough scored names yet — load today's picks to build the target.</div>`; return; }
  const sumSc=chosen.reduce((s,x)=>s+x.score,0)||1, FLOOR=0.035;
  chosen.forEach(x=>{ x.w=Math.min(PLAN_SINGLE_CAP,Math.max(FLOOR,x.score/sumSc)); });
  const sumW=chosen.reduce((s,x)=>s+x.w,0)||1;
  chosen.forEach(x=>{ x.tgt=x.w/sumW*100; });
    chosen.sort((a,b)=>b.tgt-a.tgt);
  }
  // ── sizing to the unlevered book + drift. (The synthesized stop/TP brackets that used to hang off
  //    each row went with the TP/St column in v109 — the Plan tab carries the target's real levels.) ──
  chosen.forEach(x=>{ x.tgtVal=book>0?x.tgt/100*book:0; x.cur=book>0?(x.curVal/book*100):0; x.drift=x.cur-x.tgt;
    x.delta=x.tgtVal-(x.curVal||0); x.shares=(x.px>0)?x.delta/x.px:null; x.side=x.delta>0?'BUY':(x.delta<0?'SELL':'HOLD'); });
  // ── Execution-discipline deferrals (v93): don't deploy NEW money into a name that is (a) inside a ~7d
  //    EARNINGS blackout — a pre-print overnight gap can erase the edge, so wait for the number; or (b)
  //    gapped THROUGH its planned entry/stop — a name crashing below the level we planned to buy at needs a
  //    thesis re-verify (the GOOGL-after-earnings case), not a reflexive "bargain" buy. Same treatment as the
  //    wash-sale guard: the target WEIGHT is unchanged, only the BUY is deferred + flagged. Research target
  //    only (the heuristic pool carries no entry zones / research thesis to re-verify). Mirrors the producer's
  //    agentic-deploy.mjs planner so the card and the ticket agree. ──
  //    v102 — the entry check is now a SYMMETRIC, TOLERANCED, AGEING band, mirroring agentic-deploy.mjs:
  //    a 0.2%-under-the-floor miss is noise and must not park a position; a name trading ABOVE its zone is
  //    deferred too (nothing guarded that side before, so a target that priced its entries below spot would
  //    have been bought straight through); and zones written more than ENTRY_STALE_D ago go ADVISORY, because
  //    when most of a target reads "out of band" at once the guard is measuring its own staleness, not the
  //    companies. `below-stop` stays absolute — that one is the real thesis-broken signal.
  const EARN_BLACKOUT_D=AG_EARN_BLACKOUT_D, ENTRY_TOL_PCT=AG_ENTRY_TOL_PCT, ENTRY_PREM_PCT=AG_ENTRY_PREM_PCT, ENTRY_STALE_D=AG_ENTRY_STALE_D;
  // Research target only — the heuristic pool carries no entry zones / thesis to re-verify.
  const _eg=(targetSrc==='research')?agenticExecMap(chosen,targetAsOf,washMap):{map:{},zoneAge:null,stale:false};
  const execMap=_eg.map, _zoneAge=_eg.zoneAge, _zonesStale=_eg.stale;
  const execBadge=(sym)=>{ const e=execMap[sym]; if(!e)return ''; const tag=e.reason==='earnings'?'wait for print':e.reason==='above-entry'?'too rich':'re-verify';
    return `<span class="badge" style="background:#fef3c7;color:#92400e" title="${e.note}">${e.label}</span> <span style="color:#9ca3af;font-size:10px">${tag}</span>`; };
  const chosenSet=new Set(chosen.map(x=>x.sym));
  // The index-parking vehicle is absent from the target BY DESIGN (deferred weight waits there), so
  // the off-target-orphan rule must skip it — otherwise the card tells you to liquidate the very
  // position the planner keeps rebuilding, an infinite taxable churn loop. Mirrors the same
  // exemption in agentic-deploy.mjs. Only exempt while something is actually parked.
  const parkedNow=!!(A&&A.parked&&+A.parked.dollars>0);
  const isPark=(sym)=>parkedNow&&sym===AG_PARK_VEHICLE&&!chosenSet.has(sym);
  const orphans=heldPos.filter(p=>!chosenSet.has(p.symbol)&&(+p.value||0)>0&&!isPark(p.symbol));
  // ── render — the holdings tracker for what ••••3900 ACTUALLY holds: position, trailing performance
  //    (day/YTD/P&L) and the rebalance trade. v109 dropped the **Target %/Drift** column, the TP/stop
  //    sub-line and the "Targets to open" strip: the Plan tab's Agentic side (v108) now owns the target
  //    — weights, entry zones, stop/TP, per-name status incl. over/under-by-Xpp — so keeping them here
  //    was the same numbers in two places, and the wider table pushed the columns that are genuinely
  //    account-side (P&L, day/YTD) off a phone screen. What stays is what you can only answer from the
  //    book itself, plus the Trade cell, since that's what the hand-off button below actually places. ──
  const shFmt=(n)=>{ const a=Math.abs(n); return a>=10?fmt(a,0):fmt(a,2); };
  const holdThr=Math.max(5,(book||0)*0.01);
  const pctCell=(v,dec=1)=>{ if(v==null||!isFinite(v))return '<span style="color:#9ca3af">—</span>';
    const r=+v.toFixed(dec); // color by what the READER sees: a value that displays as 0.0% is neutral, not "-0.0%" red
    const col=r>0?'#065f46':(r<0?'#991b1b':'#6b7280'); return `<span style="color:${col};font-weight:600">${r>0?'+':''}${fmt(Math.abs(r)===0?0:r,dec)}%</span>`; };
  const plCell=(pl,cost)=>{ if(!(cost>0))return '<span style="color:#9ca3af">—</span>';
    const col=pl>=0?'#065f46':'#991b1b', pct=pl/cost*100;
    return `<span style="color:${col};font-weight:600">${pl>=0?'+':'−'}${fmtD(Math.abs(pl))}</span><br><span style="color:#9ca3af;font-size:11px">${pl>=0?'+':''}${fmt(pct,1)}%</span>`; };
  const perfCell=(day,ytd)=>`${pctCell(day)}<br><span style="font-size:11px">${ytd==null?'<span style="color:#9ca3af">—</span>':pctCell(ytd)}</span>`;
  // wash-sale badge: a BUY into a name this account realized a loss on within 30d would disallow that loss
  const washAcctLbl=(sym)=>{ const w=washMap[sym]; return (w&&w.account==='main')?'in your self-directed ••••0741 account':'in this account'; };
  const washBadge=(sym)=>`<span class="badge" style="background:#fef3c7;color:#92400e" title="Wash-sale: you realized a loss on ${sym} ${washAcctLbl(sym)} on ${washMap[sym]?new Date(washMap[sym].date+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}. Rebuying in ANY of your accounts within 30 days disallows the loss — hold off until ${washUntilLbl(sym)}.">⚠️ wait · wash-sale</span> <span style="color:#9ca3af;font-size:10px">to ${washUntilLbl(sym)}</span>`;
  // the rebalance action for this holding. The TP/stop that used to stack underneath now lives on the
  // Plan tab with the rest of the target's levels — they were monitor-only here, never actionable.
  const tradeCell=(sym,side,delta,shares)=>{
    let top;
    if(book<=0||shares==null) top='<span style="color:#9ca3af">—</span>';
    else if(side==='HOLD'||Math.abs(delta)<holdThr) top='<span class="badge" style="background:#f3f4f6;color:#6b7280">hold</span>';
    else if(side==='BUY'&&washMap[sym]) top=washBadge(sym);
    else if(side==='BUY'&&execMap[sym]) top=execBadge(sym);
    else { const col=side==='BUY'?'#065f46':'#991b1b';
      top=`<span style="color:${col};font-weight:700">${side==='BUY'?'+':'−'}${shFmt(shares)} sh</span> <span style="color:#9ca3af;font-size:10px">≈${fmtD(Math.abs(delta))}</span>`; }
    return top; };
  // ── unified holdings table: iterate what the account ACTUALLY holds (incl. off-target orphans) ──
  const chosenBySym=new Map(chosen.map(x=>[x.sym,x]));
  let holdingsBlock='', totCost=0,totVal=0,totDayNow=0,totDayPrev=0,totYtdNow=0,totYtdBase=0;
  if(heldPos.length){
    const hrows=heldPos.map(p=>{
      const c=chosenBySym.get(p.symbol);
      const qty=+p.qty||0, avg=+p.avgCost||0, px=+p.px||(c&&c.px)||pxOf(p.symbol);
      const val=Math.max(0,+p.value||(qty*px)), cost=qty*avg, pl=val-cost;
      const q=azQuote(p.symbol); const prev=q?(parseFloat(q.adjusted_previous_close||q.previous_close||0)||0):0;
      const dayPct=(prev>0&&px>0)?((px-prev)/prev*100):null;
      const bars=azBars(p.symbol); const start=bars.length?bars[0]:0;
      const ytdPct=(start>0&&px>0)?((px/start-1)*100):null;
      const curPct=book>0?val/book*100:0;
      const park=isPark(p.symbol);
      const off=!c&&!park;
      let side,delta,shares;
      if(c){ side=c.side; delta=c.delta; shares=c.shares; }
      else if(park){ delta=0; shares=0; side='HOLD'; }               // waiting ground — released to fund its name, never exited
      else { delta=-val; shares=px>0?-val/px:null; side='SELL'; }  // orphan → trim to exit
      const sector=(c&&c.sector)||secOf(p.symbol);
      totCost+=cost; totVal+=val;
      if(prev>0&&px>0){ totDayNow+=qty*px; totDayPrev+=qty*prev; }

  })();
  const statusCard=`
    <div class="card"><div class="card-title collapsible" data-toggle="b-agp-status" onclick="toggleSection('b-agp-status')"><span>🤖 Where the plan stands <span class="card-hint">(ticket · cash · next action)</span></span><span class="chevron">▼</span></div><div id="b-agp-status">
      <div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 10px;line-height:1.5">This account runs itself between your confirmations: research sets the destination, a deterministic planner turns drift into a ticket, and an hourly executor places what falls inside the auto tier. Everything below is state the producer and executor own — this page reads it, it never places an order.</div>
      ${pendLine}
      <div class="pk-metrics" style="grid-template-columns:repeat(2,1fr);margin-top:10px">
        <div class="pk-m"><div class="pk-m-l">Book</div><div class="pk-m-v">${book>0?fmtD(book):'—'}</div></div>
        <div class="pk-m"><div class="pk-m-l">Idle cash</div><div class="pk-m-v">${fmtD(cash)}${book>0?` <span style="font-size:11px;color:#9ca3af">${fmt(cashPct,1)}%</span>`:''}</div></div>
        <div class="pk-m"><div class="pk-m-l">On target</div><div class="pk-m-v">${rows.filter(x=>x.held).length}/${rows.length} <span style="font-size:11px;color:#9ca3af">names held</span></div></div>
        <div class="pk-m"><div class="pk-m-l">Last rebalance</div><div class="pk-m-v">${lastDec?dLbl(lastDec.date):'—'}</div></div>
      </div>
      ${idleDays!=null?`<div class="fund-note" style="margin:10px 0 0;${idleDays>=AG_IDLE_DEPLOY_D?'background:#fffbeb;border-color:#fde68a':''}"><b>⏱ Idle-cash clock:</b> cash has been sitting since <b>${dLbl(A.cashIdleSince)}</b> (${idleDays}d of ${AG_IDLE_DEPLOY_D}). ${idleDays>=AG_IDLE_DEPLOY_D?`The deadline has passed — entry bands are <b>waived</b> and cash deploys in ${AG_IDLE_TRANCHE_PCT}% tranches (swept whole below ${fmtD(AG_IDLE_SWEEP_FLOOR)}).`:`At ${AG_IDLE_DEPLOY_D}d the entry bands are waived and cash deploys in ${AG_IDLE_TRANCHE_PCT}% tranches — "wait for a pullback" is not allowed to run forever.`}</div>`:''}
      ${orphans.length?`<div class="fund-note" style="margin:10px 0 0"><b>Off-target holdings:</b> ${orphans.map(p=>`<b>${p.symbol}</b> (${fmtD(p.value)})`).join(' · ')} — held but not in the current target. The planner exits ${orphans.length>1?'these':'this'} to fund the underweight names, subject to the ${AG_MIN_HOLD_D}-day min-hold below.</div>`:''}
      <div style="text-align:center;margin-top:12px"><span class="dp-link" onclick="switchTab('portfolio');setAccount('agentic')">🤖 See the actual book — holdings · drift · performance · rebalance log →</span></div>
    </div></div>`;

  // ── 2. the target and why ────────────────────────────────────────────────────────────────────
  const statusOf=(x)=>{
    if(washMap[x.sym])return {t:'wash-sale hold',c:'#92400e',b:'#fef3c7'};
    if(execMap[x.sym])return {t:execMap[x.sym].reason==='earnings'?'earnings blackout':execMap[x.sym].reason==='below-stop'?'below stop':execMap[x.sym].reason==='above-entry'?'above entry':'below entry',c:'#92400e',b:'#fef3c7'};
    if(x.phaseOut)return {t:'phasing out',c:'#6b7280',b:'#f3f4f6'};
    if(!x.held)return {t:'to open',c:'#1d4ed8',b:'#dbeafe'};
    if(Math.abs(x.drift)>=AGENTIC_DRIFT)return {t:(x.drift>0?'over':'under')+' by '+fmt(Math.abs(x.drift),1)+'pp',c:'#991b1b',b:'#fee2e2'};
    return {t:'on target',c:'#065f46',b:'#d1fae5'};
  };
  const tRows=rows.slice().sort((a,b)=>b.tgt-a.tgt).map(x=>{
    const s=statusOf(x);
    // Sector only in the name cell. A real target carries 3-5 sleeve drivers per name, which wrapped
    // rows to five lines and pushed Status — the column this table exists for — off a phone screen;
    // the drivers live in the thesis expander below instead.
    return `<tr><td><span class="sym">${x.sym}</span>${x.phaseOut?' <span style="color:#6b7280;font-size:9px">phase-out</span>':''}<br><span style="color:#9ca3af;font-size:10.5px">${x.sector}</span></td>`+
      `<td class="tr"><b>${fmt(x.tgt,0)}%</b><br><span style="color:#9ca3af;font-size:11px">${book>0?fmtD(x.tgt/100*book):'—'}</span></td>`+
      // Status sits next to Target on purpose: "is this on track or blocked" is the question this
      // table exists to answer, and the levels columns are wide enough to push it off a phone screen.
      `<td class="tr"><span class="badge" style="background:${s.b};color:${s.c};white-space:nowrap">${s.t}</span></td>`+
      `<td class="tr" style="font-size:11px">${x._entry?String(x._entry).replace(/\s*\(.*\)$/,''):'—'}<br><span style="color:#9ca3af">now ${x.px>0?P(x.px):'—'}</span></td>`+
      `<td class="tr" style="font-size:11px"><span style="color:#991b1b">${x._stop>0?P(x._stop):'—'}</span> · <span style="color:#065f46">${x._tp>0?P(x._tp):'—'}</span></td></tr>`;
  }).join('');
  // `drivers` are the sleeves that scored this name ≥7 — attributed deterministically by
  // finalize-target from the sleeve scores, not taken on the model's word.
  const theses=rows.filter(x=>x.thesis||x.drivers.length).map(x=>`<div class="harv-line"><span style="flex:1"><b>${x.sym}</b> <span style="color:#9ca3af">${fmt(x.tgt,0)}%</span>${x.drivers.length?` <span style="color:#9ca3af;font-size:10.5px">· ${x.drivers.join(' · ')}</span>`:''}${x.thesis?`<div style="font-size:11.5px;color:var(--text);opacity:.85;margin-top:2px;line-height:1.45">${x.thesis}</div>`:''}</span></div>`).join('');
  const targetCard=`
    <div class="card"><div class="card-title collapsible" data-toggle="b-agp-target" onclick="toggleSection('b-agp-target')"><span>🎯 The target — and why these names <span class="card-hint">${rows.length} names · as of ${T.asOf||'—'}</span></span><span class="chevron">▼</span></div><div id="b-agp-target">
      <div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 10px;line-height:1.5">The destination, not the book. Weekly deep multi-factor research (momentum · quality · growth · catalyst → adversarial verify → synthesis) proposes an allocation; <b>finalize-target</b> then re-enforces the correlation-cluster and vol-scaled caps deterministically, so the caps hold no matter what the research says. Business quality decides <b>inclusion</b>; today's price decides <b>size</b> — a stretched entry shrinks a position instead of vetoing it.</div>
      <div style="overflow-x:auto" class="sticky-first"><table><thead><tr><th>Name</th><th class="tr">Target</th><th class="tr">Status</th><th class="tr">Entry · now</th><th class="tr">Stop · TP</th></tr></thead><tbody>${tRows}</tbody></table></div>
      ${T.method?`<details class="trk-detail" style="margin-top:10px"><summary>View the research's construction note</summary><div style="font-size:11.5px;color:var(--text);opacity:.85;line-height:1.55;margin-top:6px">${String(T.method).replace(/\|/g,'<br>·')}</div></details>`:''}
      ${theses?`<details class="trk-detail" style="margin-top:6px"><summary>View the per-name thesis &amp; drivers</summary><div style="margin-top:6px">${theses}</div></details>`:''}
    </div></div>`;

  // ── 3. what's blocked and why ────────────────────────────────────────────────────────────────
  const washRows=rows.filter(x=>washMap[x.sym]);
  const execRows=rows.filter(x=>execMap[x.sym]);
  const blocked=washRows.length+execRows.length;
  const blockList=[
    ...washRows.map(x=>{ const w=washMap[x.sym];
      return {sym:x.sym,tag:'wash-sale',col:'#92400e',bg:'#fef3c7',
        why:`A loss on ${x.sym} was realized ${w.account==='main'?'in your self-directed ••••0741 book':'in this account'} on <b>${dLbl(w.date)}</b>. The IRS window is per <i>taxpayer</i>, not per account, so rebuying here before <b>${dLbl(w.until)}</b> would disallow that loss.`,
        clears:`buy unblocks ${dLbl(w.until)}`}; }),
    ...execRows.map(x=>{ const e=execMap[x.sym];
      const clears=e.reason==='earnings'?`after the ${dLbl(e.until)} print`:e.reason==='above-entry'?`on a pullback into ${x._entry||'the entry zone'}`:e.reason==='below-entry'?'after a thesis re-verify':'after a thesis re-verify';
      return {sym:x.sym,tag:e.reason.replace('-',' '),col:'#92400e',bg:'#fef3c7',why:e.note.charAt(0).toUpperCase()+e.note.slice(1)+'.',clears}; })
  ];
  const blockedCard=`
    <div class="card"><div class="card-title collapsible" data-toggle="b-agp-block" onclick="toggleSection('b-agp-block')"><span>⏸ What's blocked — and what clears it <span class="card-hint">${blocked?blocked+' name'+(blocked===1?'':'s')+' deferred':'nothing deferred'}</span></span><span class="chevron">▼</span></div><div id="b-agp-block">
      <div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 10px;line-height:1.5">A deferral never changes a target <b>weight</b> — only <b>when</b> the money moves. These are the same checks <code>agentic-deploy.mjs</code> runs before it writes a ticket, so what you read here is what the executor will actually do.</div>
      ${agDrawdownBanner()}${agRegimeBanner()}
      ${blockList.length?blockList.map(b=>`<div class="act-item" style="background:${b.bg}55;border-color:${b.bg}"><div class="act-body"><div class="act-title" style="color:var(--text)"><b>${b.sym}</b> <span class="act-tag" style="background:${b.col};color:#fff">${b.tag}</span></div><div class="act-detail" style="color:var(--text);opacity:.85">${b.why} <span style="color:#9ca3af">— ${b.clears}.</span></div></div></div>`).join(''):
        `<div class="tech-empty">Nothing is deferred right now — every target name is clear to trade on its next pass.</div>`}
      ${zonesStale?`<div class="fund-note" style="margin:10px 0 0;background:#fffbeb;border-color:#fde68a"><b>⚠️ Entry zones are advisory:</b> this target is <b>${zoneAge}d</b> old (over the ${AG_ENTRY_STALE_D}-day limit), so the entry-band checks are <b>off</b>. When a whole target reads out-of-band at once, the guard is measuring its own staleness rather than the companies. <b>Below-stop</b> still binds — that one is the real thesis-broken signal.</div>`:
        `<div class="fund-note" style="margin:10px 0 0">Entry checks are <b>live</b> (target is ${zoneAge==null?'—':zoneAge+'d'} old, limit ${AG_ENTRY_STALE_D}d): a name more than <b>${AG_ENTRY_TOL_PCT}%</b> below its entry floor defers for a re-verify, more than <b>${AG_ENTRY_PREM_PCT}%</b> above its ceiling waits for a pullback. Small misses are tolerated on purpose — a 0.2% miss parking a position is how cash gets stranded.</div>`}
    </div></div>`;

  // ── 4. the waiting ground ────────────────────────────────────────────────────────────────────
  const parkVal=(()=>{ const h=heldPos.find(p=>p.symbol===AG_PARK_VEHICLE); return h?Math.max(0,+h.value||0):0; })();
  const parkCard=`
    <div class="card"><div class="card-title collapsible" data-toggle="b-agp-park" onclick="toggleSection('b-agp-park')"><span>🅿️ The waiting ground <span class="card-hint">${parked?fmtD(parked.dollars)+' parked in '+(parked.vehicle||AG_PARK_VEHICLE):'nothing parked'}</span></span><span class="chevron">▼</span></div><div id="b-agp-park">
      <div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 10px;line-height:1.5">When a name is deferred, its dollars don't sit in cash — they wait in <b>${AG_PARK_VEHICLE}</b>, a broad-market placeholder, and are released to fund the name once it clears. <b>${AG_PARK_VEHICLE}, not SPY</b>: SPY is the target's own ballast, so parking there would bury the placeholder inside a real position — and the two track different indexes, so they're never "substantially identical" for wash-sale purposes. Not QQQ either, since half of it is the megacap-tech cluster the ${AG_CLUSTER_CAP}% cap exists to contain.</div>
      ${parked?`
        <div class="pk-metrics" style="grid-template-columns:repeat(2,1fr)">
          <div class="pk-m"><div class="pk-m-l">Parked (cost)</div><div class="pk-m-v">${fmtD(parked.dollars)}</div></div>
          <div class="pk-m"><div class="pk-m-l">${parked.vehicle||AG_PARK_VEHICLE} held now</div><div class="pk-m-v">${parkVal>0?fmtD(parkVal):'—'}</div></div>
        </div>
        <div class="fund-note" style="margin:10px 0 0">Waiting on behalf of <b>${(parked.forNames||[]).join(', ')||'—'}</b>, parked since <b>${dLbl(parked.since)}</b>. Each release is a real short-term taxable sale, so it's floored at ${fmtD(AG_PARK_MIN)}, sized to the actual shortfall, and runs through the same losses-first ordering and day-trade guard as any other sell.</div>
        <div class="fund-note" style="margin:8px 0 0">${AG_PARK_VEHICLE} is deliberately <b>exempt from the off-target exit rule</b> — it is absent from the target by design, so treating it as an orphan would liquidate it on every pass while parking rebuilt it, an infinite taxable churn loop.</div>`:
        `<div class="tech-empty">Nothing parked — no target name is currently deferred with money waiting behind it.</div>`}
    </div></div>`;

  // ── 5. the rulebook ──────────────────────────────────────────────────────────────────────────
  const rule=(icon,name,val,why)=>`<div class="harv-line"><span style="flex:1"><b>${icon} ${name}</b> <span style="color:#9ca3af">${val}</span><div style="font-size:11.5px;color:var(--text);opacity:.8;margin-top:2px;line-height:1.45">${why}</div></span></div>`;
  const rulesCard=`
    <div class="card"><div class="card-title collapsible" data-toggle="b-agp-rules" onclick="toggleSection('b-agp-rules')"><span>📏 Guardrails <span class="card-hint">the standing rules the executor can't cross</span></span><span class="chevron">▼</span></div><div id="b-agp-rules">
      <div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 10px;line-height:1.5">Every one of these is enforced in code, not prose — most were added after a specific mistake. They bind the automated executor whether or not a target "says so".</div>
      ${rule('🧬','Correlation-cluster cap',AG_CLUSTER_CAP+'% megacap-tech','A "sector-diversified" label hid the fact that NVDA/MSFT/GOOGL/AMZN/META/AAPL all trade as one bet. Payments cap 20%, staples 25%; index is uncapped.')}
      ${rule('📉','Vol-scaled single-name cap','wider 52wk range → smaller max','10% in a high-range biotech is not 10% in SPY. Conviction sets the weight; realized range caps it.')}
      ${rule('🛡️','Defensive floor','≥'+AG_DEFENSIVE_MIN+'% of book'+agDefensiveNote(),'Every other rule on this card is a CEILING — this is the only floor. Nothing previously made the book own a stabilizer, so a target could hold 0% staples, 0% utilities and 0% healthcare forever: the composite weights momentum and growth at 0.44 combined against valuation\'s 0.18, so an expensive fast name always outranks a cheap stable one. Counts staples, utilities, telecom, REITs, managed care and low-vol vehicles — but only if the name actually trades like one (52wk range no wider than a normal large-cap), so a high-multiple healthcare name does not qualify on its GICS label alone. SPY/'+AG_PARK_VEHICLE+' count only through their small defensive sleeves.')}
      ${rule('⏳','Min-hold',AG_MIN_HOLD_D+' days','A name bought inside the window is not exited or trimmed. Overridden only by a business-broken verdict, a loss past −10% (risk control outranks churn control), or a harvest/park release. Added after two consecutive targets flipped the whole book in 48 hours.')}
      ${rule('🔁','Re-entry cooldown',AG_REENTRY_D+' days','A name this account sold inside the window is not rebought — it covers the gain-sells the 30-day wash ledger cannot see. The weight parks in '+AG_PARK_VEHICLE+' meanwhile.')}
      ${rule('🧾','Wash-sale window',AG_WASH_WINDOW_D+' days, cross-account','The IRS window is per taxpayer, so the ledger reads BOTH taxable books. A loss booked in ••••0741 blocks a rebuy here — the exact trade that partially disallowed a −$431 NVDA loss once.')}
      ${rule('📅','Earnings blackout','≤'+AG_EARN_BLACKOUT_D+' days','No NEW money into a name about to report. Wait for the print, then buy with full information.')}
      ${rule('🎯','Entry band','−'+AG_ENTRY_TOL_PCT+'% / +'+AG_ENTRY_PREM_PCT+'%, advisory past '+AG_ENTRY_STALE_D+'d','Symmetric on purpose: too cheap means re-verify the thesis, too rich means wait for the pullback the research priced in.')}
      ${rule('⚖️','Drift trigger',(T.driftTriggerPp||AGENTIC_DRIFT)+'pp','A name is only rebalanced once it drifts this far from target — small gaps are not worth the spread or the tax.')}
      ${rule('🤖','Auto tier',fmtD(AG_AUTO_CAP)+' / ticket','Turnover at or under this executes unattended; anything larger becomes a one-tap proposal pushed to your phone.')}
      ${rule('🚫','PDT guard','nothing bought today is sold today','Limited margin makes this a margin account for FINRA, and the book is under $25k with an hourly executor — so zero round trips, categorically, rather than counting day trades.')}
      ${rule('🪙','Dust floor',fmtD(AG_MIN_BUY)+' minimum buy','A ticket once placed a $1.80 order. Below this the spread and the bookkeeping cost more than the position is worth.')}
      ${rule('⏱','Idle-cash deadline',AG_IDLE_DEPLOY_D+' days','Nothing ever forced cash IN, so "wait for a pullback" had no expiry and a rising market could strand a deposit indefinitely. Past the deadline the bands are waived and cash deploys in '+AG_IDLE_TRANCHE_PCT+'% tranches.')}
      ${rule('🛑','Book drawdown breaker',AG_DD_SOFT_PCT+'% pause / '+AG_DD_HARD_PCT+'% raise cash','Every other rule here is per-NAME; this is the only one that looks at the whole book. Past '+AG_DD_SOFT_PCT+'% below its peak no new money goes in at all, and deferred dollars stay in cash rather than the waiting ground. Past '+AG_DD_HARD_PCT+'% it also raises cash to 20% of book, losses first. Measured deposit-adjusted, so funding the account cannot cancel it, and it resumes only above '+AG_DD_RESUME_PCT+'%.')}
      ${rule('🌡️','Regime pacing','VIX '+AG_VIX_ELEVATED+' / '+AG_VIX_STRESSED,'The idle-cash deadline used to fire identically at VIX 12 and VIX 35. Elevated stretches it ×1.5, stressed ×2 and halves the tranche. It paces deployment only — it never picks names, sizes positions, or blocks a sell.')}
      ${rule('🧮','Cluster caps see through the index','SPY/'+AG_PARK_VEHICLE+'/QQQ composition counts','A book could hold 44.8% megacap-tech directly, add 20% SPY on top, and still report itself inside the '+AG_CLUSTER_CAP+'% cap while really carrying ~54%. Caps now count what is inside the index sleeves — and a breach trims the DIRECT names, never the index ballast, since that is the diversifier.')}
      ${rule('🔓','No leverage','unlevered 1×','Limited margin grants instant settlement only. The account cannot borrow, so the book is its own equity.')}
    </div></div>`;

  // ── 6. how the loop runs ─────────────────────────────────────────────────────────────────────
  const step=(n,title,body)=>`<div class="act-item" style="background:rgba(99,102,241,0.10);border-color:#6366f1"><div class="act-icon">${n}</div><div class="act-body"><div class="act-title" style="color:var(--text)">${title}</div><div class="act-detail" style="color:var(--text);opacity:.82">${body}</div></div></div>`;
  const loopCard=`
    <div class="card"><div class="card-title collapsible" data-toggle="b-agp-loop" onclick="toggleSection('b-agp-loop')"><span>🔁 How the loop runs <span class="card-hint">research → target → ticket → fill</span></span><span class="chevron">▼</span></div><div id="b-agp-loop">
      <div class="act-list">
        ${step('1','Research — weekly, or early','A multi-sleeve deep research run (momentum · quality · growth · catalyst, with an adversarial verify pass) proposes names and weights. It also runs early when a deposit lands or a held name gaps ≥6% — the system reacts to events, not just the calendar.')}
        ${step('2','Finalize — caps re-enforced','<code>finalize-target.mjs</code> re-applies the cluster and vol-scaled caps to whatever the research returned, and a held name the research dropped is retained one cycle as a <b>phase-out</b> (zero trades) unless the verdict was explicitly business-broken. A target refresh expresses intent; it is not an execution order.')}
        ${step('3','Plan — drift becomes a ticket','The deploy planner compares the target to the real book and writes a ticket: exits first, then harvests, then buys — losses sold first for tax, with every guardrail above applied. Deferred weight parks in '+AG_PARK_VEHICLE+'.')}
        ${step('4','Execute — hourly, within the tier','An hourly executor places tickets at or under the '+fmtD(AG_AUTO_CAP)+' auto tier unattended and pushes anything larger for your one-tap confirm. Sells fund the buys in the same session; nothing bought today is sold today.')}
        ${step('5','Grade — the account\'s own record','Every confirmed rebalance is logged and graded against what happened next and against SPY, so the strategy can be judged rather than just repeated.')}
      </div>
      <div style="text-align:center;margin-top:12px"><span class="dp-link" onclick="switchTab('portfolio');setAccount('agentic')">🧾 Rebalance log &amp; account performance →</span></div>
      <div class="disclaimer" style="margin-top:12px">⚠️ Not financial advice. This page reports what the automated system intends and why; it places nothing. Levels are monitor-only — fractional positions can't carry resting stops.</div>
    </div></div>`;

  host.innerHTML=hero+statusCard+targetCard+blockedCard+parkCard+rulesCard+loopCard;
}
window.renderAgenticPlan=renderAgenticPlan;

/* ═══ Rebalance Log (v93) — the agentic account's OWN track record. Reads data.agentic.decisions (the
   graded ledger build-data maintains from producer/agentic-decisions.json): every owner-confirmed
   deploy/rebalance, graded vs what happened next + vs SPY. Mirror of the picks Track Record, for the
   account's allocation calls instead of the daily picks. ═══ */
function renderAgenticLog(){
  const el=document.getElementById('agentic-log-content'); if(!el)return;
  const A=(window.__DATA&&window.__DATA.agentic)||null;
  const D=A&&A.decisions;
  if(!D||!Array.isArray(D.decisions)||!D.decisions.length){ el.innerHTML=`<div class="tech-empty">No rebalance decisions logged yet. Each confirmed deploy/rebalance is recorded here and graded against what happens next (and vs SPY) — the account's own track record.</div>`; return; }
  const chip=(v)=> v==='ahead'?'<span class="badge" style="background:#dcfce7;color:#065f46">✅ ahead</span>':(v==='behind'?'<span class="badge" style="background:#fee2e2;color:#991b1b">🔻 behind</span>':'<span class="badge" style="background:#f3f4f6;color:#6b7280">• open</span>');
  const pct=(v)=> v==null?'<span style="color:#9ca3af">—</span>':`<span style="color:${v>=0?'#065f46':'#991b1b'};font-weight:600">${v>=0?'+':''}${fmt(v,1)}%</span>`;
  const rows=D.decisions.map(d=>{
    const g=d.grade||{};
    const trades=(d.trades||[]).map(t=>`${t.side==='BUY'?'+':'−'}${t.sym}`).join(' ')||'—';
    const days=g.daysSince!=null?g.daysSince+'d':'';
    const rat=d.rationale?(d.rationale.length>96?d.rationale.slice(0,94)+'…':d.rationale):'';
    return `<tr>
      <td><b>${d.date}</b><br><span style="color:#9ca3af;font-size:10.5px">${d.kind}${days?' · '+days:''}</span></td>
      <td style="font-size:11.5px">${trades}${rat?`<br><span style="color:#9ca3af;font-size:10px">${rat}</span>`:''}</td>
      <td class="tr">${pct(g.avgContrib)}<br><span style="font-size:10px;color:#9ca3af">vs SPY ${g.alpha==null?'—':(g.alpha>=0?'+':'')+fmt(g.alpha,1)+'pp'}</span></td>
      <td class="tr">${chip(g.verdict)}</td>
    </tr>`;
  }).join('');
  const s=D.stats||{};
  const hdr=`<div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 8px;line-height:1.5">Every owner-confirmed deploy/rebalance on <b>••••3900</b>, graded against what happened next — the account's own track record. <b>Contribution</b> = dollar-weighted price move since the decision (a trim that then fell counts positive); <b>vs SPY</b> = the same window's alpha. A call &lt;5d old is still <b>open</b>. Monitor/education only.</div>
    <div class="fund-note" style="margin:0 0 8px">${s.resolved||0}/${s.total||0} resolved · <b>${s.ahead||0} ahead</b> / ${s.behind||0} behind${s.avgAlpha!=null?` · avg alpha <b>${s.avgAlpha>=0?'+':''}${fmt(s.avgAlpha,1)}pp</b> vs SPY`:''}</div>`;
  el.innerHTML=hdr+agSleeveStrip(D)+`<div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Trades</th><th class="tr">Contribution</th><th class="tr">Result</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* Sleeve attribution (v121) — which research sleeve is actually earning its keep. Every target name
   carries `drivers` (the sleeves that scored ≥7) and the ledger stamps them onto each BUY leg AT
   DECISION TIME, so this answers "did the names a sleeve backed outperform?" rather than "what did we
   buy". Two honesty rules, both deliberate: a sleeve under the minimum sample is rendered as
   "not yet measurable" and NEVER as a finding (attribution over two trades is noise, and a card that
   prints it as signal is worse than one that says nothing); and legs recorded before drivers existed
   carry none and are simply absent — the history is not backfilled or guessed at. */
function agSleeveStrip(D){
  const S=D&&D.sleeves; if(!S||!Object.keys(S).length) return '';
  const ent=Object.entries(S).sort((a,b)=>(b[1].alphaPct==null?-99:b[1].alphaPct)-(a[1].alphaPct==null?-99:a[1].alphaPct));
  const solid=ent.filter(([,v])=>!v.thin), thin=ent.filter(([,v])=>v.thin);
  const one=([k,v])=>`<span style="display:inline-block;margin:0 10px 4px 0"><b>${k}</b> ${v.alphaPct==null?'<span style="color:#9ca3af">—</span>':`<span style="color:${v.alphaPct>=0?'#065f46':'#991b1b'};font-weight:600">${v.alphaPct>=0?'+':''}${fmt(v.alphaPct,1)}pp</span>`} <span style="color:#9ca3af;font-size:10.5px">(${fmtD(v.dollars)}, ${v.n} buy${v.n===1?'':'s'})</span></span>`;
  return `<div class="fund-note" style="margin:0 0 8px">
    <b>🔬 By research sleeve</b> <span style="color:#9ca3af;font-size:10.5px">— alpha vs SPY on the buys each sleeve backed</span><br>
    ${solid.length?solid.map(one).join(''):'<span style="color:#9ca3af">Nothing has enough graded buys yet.</span>'}
    ${thin.length?`<div style="margin-top:6px;font-size:10.5px;color:#9ca3af">Not yet measurable (under ${AG_SLEEVE_MIN_N} graded buys): ${thin.map(([k,v])=>`${k} (${v.n})`).join(', ')} — shown so they aren't mistaken for absent, not as a result.</div>`:''}
    <div style="margin-top:6px;font-size:10.5px;color:var(--text);opacity:.7">A buy backed by more than one sleeve splits its dollars evenly between them. This is what makes a sleeve <i>removable</i>: the <b>flow</b> sleeve is measured here while its allocation weight is still 0, so it can be judged on evidence before it ever moves a dollar.</div>
  </div>`;
}

/* ═══ Flow & Positioning (v95) — WHO IS ACTING on your names, which none of the fundamental/technical
   cards read. Renders data.flow (producer/flow.mjs): analyst revision momentum, insider Form 4 clusters,
   earnings-surprise drift, federal contract awards, plus the congressional disclosure ledger.

   DISPLAY-ONLY, on purpose. Nothing here moves agentic-target.json — the sleeve sits at weight 0 through
   a burn-in so the signal can be judged on real accumulated data before it earns any say (see
   producer/PROPOSAL-flow-signals.md §8). The congressional block carries ZERO weight permanently: it lags
   40-116 days, its apparent edge is a megacap-tech beta tilt, and megacap names are excluded upstream. ═══ */
/* opts.scope: 'main' (default) = the self-directed book · 'agentic' = ••••3900's holdings and its
   research-target names. One card per account side of the Accounts tab. */
function renderFlowCard(opts){
  const O=opts||{}, scope=O.scope||'main', agOnly=scope==='agentic';
  const el=document.getElementById('flow-content'+(O.sfx||'')); if(!el)return;
  const F=(window.__DATA&&window.__DATA.flow)||null;
  if(!F||!F.symbols||!Object.keys(F.symbols).length){
    el.innerHTML='<div class="fund-note" style="margin:0">No flow data in this snapshot yet — it lands on the next full producer run (needs <code>FINNHUB_KEY</code>).</div>';
    return;
  }
  // Per-account tags — the card now lives on the Accounts page and covers BOTH books:
  // 📊 held in the self-directed margin account · 🤖 held in ••••3900 · 🎯 in the agentic
  // target but not yet held. A name in neither book keeps the old "not held" hint.
  const held=new Set((window.__SNAP&&window.__SNAP.enriched||[]).map(p=>p.symbol));
  const AG=(window.__DATA&&window.__DATA.agentic)||{};
  const agHeld=new Set((Array.isArray(AG.positions)?AG.positions:[]).filter(p=>p&&p.qty>0).map(p=>p.symbol));
  const agTgt=new Set((((AG.target||{}).names)||[]).map(n=>n&&n.ticker).filter(Boolean));
  const acctTag=(sym)=>{ const t=[];
    if(agOnly){ if(agHeld.has(sym))t.push('🤖'); else if(agTgt.has(sym))t.push('🎯'); if(held.has(sym))t.push('📊'); }
    else { if(held.has(sym))t.push('📊'); if(agHeld.has(sym))t.push('🤖'); else if(agTgt.has(sym))t.push('🎯'); }
    return t.length?` <span style="font-size:9.5px">${t.join('')}</span>`:' <span class="card-hint" style="font-size:9px">not held</span>'; };
  // Each account side shows only ITS OWN names: this card sits inside the Accounts toggle, so a
  // margin-only ticker under the Agentic side is just noise about a book you aren't looking at.
  const inScope=(sym)=>agOnly?(agHeld.has(sym)||agTgt.has(sym)):held.has(sym);
  const rows=Object.values(F.symbols)
    .filter(s=>s&&s.sym&&inScope(s.sym))
    .sort((a,b)=>((b.flow&&b.flow.score)||-1)-((a.flow&&a.flow.score)||-1));
  if(!rows.length){
    el.innerHTML=`<div class="fund-note" style="margin:0">No flow read yet for ${agOnly?'this account\'s holdings or target names':'this account\'s holdings'}. The producer covers both books, so ${agOnly?'these':'they'} fill in on its next full run.</div>`;
    return;
  }
  const pill=(v)=>{ if(v==null)return '<span style="opacity:.4">—</span>';
    const c=v>=7?'#16a34a':v>=5.5?'#65a30d':v>=4?'#a16207':'#dc2626';
    return `<b style="color:${c}">${fmt(v,1)}</b>`; };
  const body=rows.map(s=>{
    const ins=s.insider, rev=s.revision, aw=s.award;
    const insTxt=ins?(ins.cluster==='buy'?`<span style="color:#16a34a;font-weight:700">▲ ${ins.buyers} buying</span>`
      :ins.cluster==='sell'?`<span style="color:#dc2626">▼ ${ins.sellers} selling</span>`
      :`${ins.buyers}B / ${ins.sellers}S`):'<span style="opacity:.4">—</span>';
    // Flat is flat: a delta of exactly 0 must not read as "improving".
    const revTxt=rev&&rev.delta!=null?`${rev.delta>0?'▲':rev.delta<0?'▼':'–'} ${rev.delta>0?'+':''}${fmt(rev.delta,2)}`:'<span style="opacity:.4">—</span>';
    return `<tr><td><b>${s.sym}</b>${acctTag(s.sym)}</td>
      <td class="tr">${pill(s.flow&&s.flow.score)}</td>
      <td class="tr">${pill(rev&&rev.score)} <span class="card-hint" style="font-size:9.5px">${revTxt}</span></td>
      <td class="tr">${pill(ins&&ins.score)} <span class="card-hint" style="font-size:9.5px">${insTxt}</span></td>
      <td class="tr">${pill(s.surprise&&s.surprise.score)}</td>
      <td class="tr">${aw?pill(aw.score):'<span style="opacity:.4">—</span>'}</td></tr>`;
  }).join('');
  const abstain=rows.filter(s=>!s.flow).length;
  const hdr=`<div style="font-size:11.5px;color:var(--text);opacity:.75;margin:-2px 0 8px;line-height:1.5">
    Who is <i>acting</i> on ${agOnly?'the names in your <b>agentic account</b> (🤖 held · 🎯 target, not yet opened)':'the names in your <b>self-directed account</b>'}. <b>Revisions</b> = analyst consensus direction (the change matters more than the level). <b>Insider</b> = open-market Form 4 only — grants and option exercises are excluded, and selling is weighted far below buying because large caps sell constantly for reasons that aren't a view. <b>Surprise</b> = earnings drift. <b>Awards</b> = federal contract growth. A blank column means that name abstained rather than guessing.
    <b>Display-only</b> — none of this moves the agentic target yet.</div>
    <div class="fund-note" style="margin:0 0 8px">${rows.length} names read${abstain?` · ${abstain} abstaining (too little data)`:''}${F.asOf?` · as of ${F.asOf}`:''}</div>`;
  let html=hdr+`<div style="overflow-x:auto"><table><thead><tr><th>Ticker</th><th class="tr">Flow</th><th class="tr">Revisions</th><th class="tr">Insider</th><th class="tr">Surprise</th><th class="tr">Awards</th></tr></thead><tbody>${body}</tbody></table></div>`;

  // Lobbying — a policy-exposure flag, never a score. Only worth showing where it's material.
  const lob=rows.filter(s=>s.lob&&s.lob.ttm>0).sort((a,b)=>b.lob.ttm-a.lob.ttm).slice(0,6);
  if(lob.length) html+=`<div class="ac-tier" style="margin-top:12px">🏛️ Lobbying intensity <span class="card-hint">(regulatory exposure, not a signal)</span></div>
    <div class="fund-note" style="margin:0">${lob.map(s=>`<b>${s.sym}</b> ${s.lob.note}`).join(' · ')}</div>`;

  // Congressional disclosures — context only, and labelled as such.
  const pc=(F.polClusters&&Object.values(F.polClusters))||[];
  if(pc.length){
    html+=`<div class="ac-tier" style="margin-top:12px">🏛️ Congressional clusters <span class="card-hint">(context only — zero weight)</span></div>
      <div style="font-size:11.5px;color:var(--text);opacity:.75;margin:0 0 6px;line-height:1.5">≥3 members trading the same name the same way within 45 days. Shown because it's interesting, weighted at <b>zero</b> because it isn't actionable: disclosure lags the trade by 40–116 days, and the mega-cap names this feed is dominated by are excluded outright — they're already inside the concentration cap the target enforces.</div>
      <div class="fund-note" style="margin:0">${pc.map(c=>`<b>${c.sym}</b> ${c.side==='buy'?'▲':'▼'} ${c.filers} filers · last ${c.lastTxn} (~${c.staleDays}d ago)`).join(' · ')}</div>`;
  } else if(F.polEvents&&F.polEvents.length){
    html+=`<div class="fund-note" style="margin:10px 0 0">🏛️ Congressional ledger: ${F.polEvents.length} disclosures tracked, no cluster meets the ≥3-filer bar. (Context only — zero weight.)</div>`;
  }
  el.innerHTML=html;
}

let _sc='val',_sd=1,_enriched=[];

  ];

  let h='<table><thead><tr>';

  if(smallRows.length>0){

    const sPnlP=sCost>0?(sPnlD/sCost)*100:0; const syms=smallRows.sort((a,b)=>b.val-a.val).map(r=>r.symbol).join(', ');

  }
  h+='</tbody></table>';
  const el=document.getElementById('pos-table'); if(el)el.innerHTML=h;
}

/* ═══ Holdings heatmap (treemap) ═══
   Tiles sized by position value, colored by day move or total P&L. */
function squarify(items, x, y, w, h){
  /* items: [{value, ...}] · returns [{d, x, y, w, h}] in the same px coords. */
  const rects=[]; const data=items.slice().filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  const sum=data.reduce((s,d)=>s+d.value,0); if(sum<=0||w<=0||h<=0) return rects;
  const scale=(w*h)/sum; const nodes=data.map(d=>({d, area:d.value*scale}));
  let X=x,Y=y,W=w,H=h;
  function worst(row, side){ let s=0,mn=Infinity,mx=0; for(const r of row){ s+=r.area; if(r.area<mn)mn=r.area; if(r.area>mx)mx=r.area; } return Math.max((side*side*mx)/(s*s),(s*s)/(side*side*mn)); }
  let i=0;
  while(i<nodes.length){
    const side=Math.min(W,H); let row=[nodes[i]]; let j=i+1;
    while(j<nodes.length){ const test=row.concat(nodes[j]); if(worst(test,side)<=worst(row,side)){ row=test; j++; } else break; }
    const rowArea=row.reduce((s,r)=>s+r.area,0); const thick=rowArea/side;
    if(W>=H){ let oy=Y; for(const r of row){ const rh=r.area/thick; rects.push({d:r.d,x:X,y:oy,w:thick,h:rh}); oy+=rh; } X+=thick; W-=thick; }
    else { let ox=X; for(const r of row){ const rw=r.area/thick; rects.push({d:r.d,x:ox,y:Y,w:rw,h:thick}); ox+=rw; } Y+=thick; H-=thick; }
    i=j;
  }
  return rects;
}

}

/* ═══ Risk-adjusted metrics (volatility · Sharpe · max drawdown), YTD annualized ═══ */
function computeRiskMetrics(histMap, enriched, syms, macro){
  const wsyms=syms.filter(s=>histMap[s]&&histMap[s].length>20);
  const wmap={}; let wsum=0;
  for(const s of wsyms){ const p=enriched.find(e=>e.symbol===s); if(p&&p.val>0){ wmap[s]=p.val; wsum+=p.val; } }
  const keys=Object.keys(wmap); if(wsum<=0||!keys.length) return null;
  let minLen=Infinity; for(const s of keys) minLen=Math.min(minLen,histMap[s].length);
  if(!isFinite(minLen)||minLen<25) return null;
  const dr=new Array(minLen-1).fill(0);
  for(const s of keys){ const ser=histMap[s].slice(-minLen); const w=wmap[s]/wsum; for(let i=1;i<minLen;i++){ dr[i-1]+=w*(ser[i].c/ser[i-1].c-1); } }
  const N=dr.length; const mean=dr.reduce((a,b)=>a+b,0)/N;
  let v=0; for(const x of dr)v+=(x-mean)*(x-mean); v/=N; const sd=Math.sqrt(v);
  const volAnn=sd*Math.sqrt(252)*100, retAnn=mean*252*100;
  const rf=(macro&&macro.tenYrYield)?macro.tenYrYield:4.3;
  const sharpe=volAnn>0?(retAnn-rf)/volAnn:null;
  let cum=1,peak=1,mdd=0; for(const x of dr){ cum*=(1+x); if(cum>peak)peak=cum; const d=cum/peak-1; if(d<mdd)mdd=d; }
  const eq=enriched.reduce((s,p)=>s+Math.max(p.val,0),0)||1;
  return { vol:volAnn, sharpe, maxDD:mdd*100, retAnn, cov:wsum/eq*100 };
}

function switchTab(tab){

  for(const t in pages){ const pg=document.getElementById(pages[t]); if(pg)pg.style.display=(t===tab)?'':'none'; const bt=document.getElementById('tab-'+t); if(bt)bt.classList.toggle('active',t===tab); }
  try{localStorage.setItem('dash_tab',tab);}catch(e){}
  window.scrollTo(0,0);
  if(tab==='picks'&&!_picksInit){_picksInit=true;initPicks();}
  // Both tabs share `pf_acct` (v108), but each only re-renders its side while VISIBLE — a chart
  // built into a display:none container sizes to zero. So a page that fell behind while hidden is
  // brought into line here, on the way in.
  if(tab==='portfolio'){ try{ const want=_acctPref(), g=document.getElementById('agentic-app');
    const showing=(g&&g.style.display!=='none')?'agentic':'main'; if(want!==showing)setAccount(want); }catch(e){} }
  if(tab==='picks'){ try{ const want=_acctPref(), g=document.getElementById('plan-agentic-app');
    const showing=(g&&g.style.display!=='none')?'agentic':'main'; if(want!==showing)setPlanAccount(want); }catch(e){} }
  if(tab==='markets'&&!_marketsInit){_marketsInit=true;initMarkets();}
  if(tab==='options'&&!_optionsInit){_optionsInit=true;initOptions();}
  if(tab==='analyze'&&!_analyzeInit){_analyzeInit=true;initAnalyze();}
}

/* Make every card collapsible (cards rendered later are caught via MutationObserver). */
(function(){
  function enhance(card){
    var title=card.querySelector(':scope > .card-title');
    if(!title || title.dataset.coll) return;
    title.dataset.coll='1';
    if(title.classList.contains('collapsible')) return; // already wired (has its own toggleSection)
    var body=document.createElement('div'); body.className='card-body';
    var n=title.nextSibling; while(n){ var nx=n.nextSibling; body.appendChild(n); n=nx; }
    card.appendChild(body);
    if(!title.querySelector('.chevron')){ var ch=document.createElement('span'); ch.className='chevron'; ch.textContent='▼'; title.appendChild(ch); }
    title.classList.add('collapsible');
    title.addEventListener('click',function(e){
      // Only a bare-header tap collapses. Ignore taps on interactive controls that live in the
      // header (e.g. the heatmap "Day / vs S&P YTD" toggles) — otherwise one tap both flips the
      // toggle AND collapses the card.
      if(e.target.closest('button, a, select, input, label')) return;
      var hide=body.style.display!=='none'; body.style.display=hide?'none':'';
      var c=title.querySelector('.chevron'); if(c)c.style.transform=hide?'rotate(-90deg)':'';
    });
  }
  // Wrap any wide table in a horizontal-scroll container so it never spills the page.
  function wrapTables(root){ try{ (root||document).querySelectorAll('table').forEach(function(t){
    var p=t.parentElement; if(!p||p.dataset.tw)return;
    if((p.style&&p.style.overflowX==='auto'))return;
    var w=document.createElement('div'); w.dataset.tw='1'; w.style.overflowX='auto'; w.style.webkitOverflowScrolling='touch';
    p.insertBefore(w,t); w.appendChild(t);
  }); }catch(e){} }
  function scan(root){ try{ (root||document).querySelectorAll('.card').forEach(enhance); wrapTables(root); }catch(e){} }
  function start(){
    scan(document);
    try{
      var mo=new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){ var a=muts[i].addedNodes;
          for(var j=0;j<a.length;j++){ var nd=a[j]; if(!nd||nd.nodeType!==1)continue;
            if(nd.classList&&nd.classList.contains('card'))enhance(nd);
            if(nd.querySelectorAll)nd.querySelectorAll('.card').forEach(enhance); }
          wrapTables(document); }
      });
      ['page-portfolio','page-markets','page-picks','page-options','page-analyze'].forEach(function(id){ var el=document.getElementById(id); if(el)mo.observe(el,{childList:true,subtree:true}); });
    }catch(e){}
  }
  if(document.readyState!=='loading')start(); else document.addEventListener('DOMContentLoaded',start);
})();

/* Per-page quick-nav: a collapsible chip list at the top of each page listing every card's title.
   Tap a chip to (expand if collapsed and) smooth-scroll to that card. Rebuilds itself
   when a page's cards change (debounced), so dynamic pages like Analyze stay in sync. */
(function(){
  var PAGES=['page-portfolio','page-markets','page-picks','page-options','page-analyze'];
  var NAVSEQ=0; // globally-unique card ids so re-renders never collide with stale ids
  /* Open/closed is ONE preference across every page, persisted — a nav that came back expanded on
     the next tab (or collapsed on the tab you'd just opened it on) reads as a bug, not a per-page
     setting. Default collapsed: expanded, the chips wrapped to 5 rows on a phone and pushed the
     page's actual first card below the fold. Tapping a chip deliberately does NOT close the panel,
     so it behaves like an ordinary disclosure and stays put if you like it open. */
  var NAV_KEY='pf_nav_open';
  function navOpen(){ try{ return localStorage.getItem(NAV_KEY)==='1'; }catch(e){ return false; } }
  function applyOpen(nav,v){
    nav.setAttribute('data-open',v?'1':'0');
    var b=nav.querySelector('.card-nav-toggle'); if(b)b.setAttribute('aria-expanded',v?'true':'false');
  }
  function setNavOpen(v){
    try{ localStorage.setItem(NAV_KEY,v?'1':'0'); }catch(e){}
    PAGES.forEach(function(id){ var el=document.getElementById(id); if(!el)return;
      var n=el.querySelector(':scope > .card-nav'); if(n)applyOpen(n,v); });
  }
  window.__navToggle=function(){ setNavOpen(!navOpen()); };
  function titleOf(card){
    var t=card.querySelector(':scope > .card-title'); if(!t)return null;
    var c=t.cloneNode(true);
    c.querySelectorAll('.chevron,.card-hint,.help-btn').forEach(function(x){ x.remove(); });
    var s=(c.textContent||'').replace(/\s+/g,' ').trim();
    return s||null;
  }
  // Top offset to clear the sticky tab bar (which wraps to 2 rows on mobile) AND, on the Accounts
  // tab, the sticky account switcher — measured live by the shared helper. Delegating matters: once
  // the switcher became sticky (v106), a chip jump computed off the tab bar alone lands the card
  // underneath it.
  function topOffset(){
    if(window.__pfTopOffset)try{ return window.__pfTopOffset(); }catch(e){}
    var tb=document.querySelector('.tabbar');
    if(tb){ var r=tb.getBoundingClientRect(); if(r.height>0)return Math.max(0,r.bottom)+8; }
    return 96;
  }
  function jump(id){
    var card=document.getElementById(id); if(!card)return;
    var body=card.querySelector(':scope > .card-body');
    if(body&&body.style.display==='none'){ body.style.display=''; var ch=card.querySelector(':scope > .card-title .chevron'); if(ch)ch.style.transform=''; }
    var y=card.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-topOffset();
    if(y<0)y=0;
    try{ window.scrollTo({top:y,behavior:'smooth'}); }catch(e){ window.scrollTo(0,y); }
    var prev=card.style.boxShadow; card.style.transition='box-shadow .3s'; card.style.boxShadow='0 0 0 2px #6366f1';
    setTimeout(function(){ card.style.boxShadow=prev; },800);
  }
  window.__navJump=jump;
  /* A card hidden by a container INSIDE this page (the Accounts tab shows one of #app /
     #agentic-app at a time) must not get a chip — jumping to it would scroll to nothing. Only
     containers between the card and the page root are considered, so a page that is itself
     display:none (an inactive tab) still keeps its nav built and ready. */
  function hiddenWithin(el,root){
    for(var n=el.parentElement; n&&n!==root; n=n.parentElement){ if(n.style&&n.style.display==='none')return true; }
    return false;
  }
  function build(pageEl){
    var all=pageEl.querySelectorAll('.card'), cards=[], i;
    for(i=0;i<all.length;i++){ var ti=titleOf(all[i]); if(ti&&!hiddenWithin(all[i],pageEl))cards.push({card:all[i],title:ti}); }
    // Change-detect on the actual card ELEMENTS (not just titles) so a re-render — same
    // titles, brand-new nodes — still rebuilds the chips and re-points them.
    var prev=pageEl.__navCards||[], same=(prev.length===cards.length);
    if(same)for(i=0;i<cards.length;i++){ if(prev[i].card!==cards[i].card||prev[i].title!==cards[i].title){ same=false; break; } }
    if(same)return;
    pageEl.__navCards=cards;
    var nav=pageEl.querySelector(':scope > .card-nav');
    if(cards.length<2){ if(nav)nav.remove(); return; } // not worth a nav for 0–1 cards
    if(!nav){ nav=document.createElement('div'); nav.className='card-nav'; pageEl.insertBefore(nav,pageEl.firstChild); }
    var html='';
    for(i=0;i<cards.length;i++){ var c=cards[i]; c.card.id='navc-'+(++NAVSEQ); // fresh unique id every build
      html+='<button class="card-nav-chip" onclick="__navJump(\''+c.card.id+'\')">'+c.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</button>'; }
    nav.innerHTML='<button class="card-nav-toggle" type="button" onclick="__navToggle()">'
      +'<span>🧭 Jump to section</span><span class="cn-count">'+cards.length+'</span><span class="cn-chev">▼</span></button>'
      +'<div class="card-nav-chips">'+html+'</div>';
    applyOpen(nav,navOpen());   // a rebuild replaces the markup — re-assert the saved state
  }
  function buildAll(){ PAGES.forEach(function(id){ var el=document.getElementById(id); if(el)build(el); }); }
  /* The observer watches childList only, so a pure visibility flip (the Accounts toggle) has to
     ask for the rebuild itself. */
  window.__navRebuild=buildAll;
  function start(){
    buildAll();
    try{
      var t=null, schedule=function(){ clearTimeout(t); t=setTimeout(buildAll,150); };
      var mo=new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){ var tgt=muts[i].target;
          if(tgt&&tgt.closest&&tgt.closest('.card-nav'))continue; // ignore our own writes
          schedule(); break; }
      });
      PAGES.forEach(function(id){ var el=document.getElementById(id); if(el)mo.observe(el,{childList:true,subtree:true}); });
    }catch(e){}
  }
  if(document.readyState!=='loading')start(); else document.addEventListener('DOMContentLoaded',start);
})();
