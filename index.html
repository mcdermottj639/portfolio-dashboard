function renderSnapshot(stats, betaInfo, opts){
  const O=opts||{};
  const el=document.getElementById('snap-content'+(O.sfx||'')); if(!el)return;
  const {totalVal,equityVal,cashVal,bpVal,dayPnL,dayPnLP,totalPnL,totalRet,marginPct}=stats;
  /* See load(): `equityVal` is GROSS long market value, `netEq` is what you actually own. Margin is
     a fraction of the latter — the two diverge by the whole loan on a levered book. */
  const netEq=(+stats.netEq>0)?+stats.netEq:(totalVal>0?totalVal:Math.max(0,equityVal+cashVal));
  const betaTxt = betaInfo&&betaInfo.beta!=null ? fmt(betaInfo.beta,2) : '<span class="spin-sm"></span>';
  const betaColor = betaInfo&&betaInfo.beta!=null ? (betaInfo.beta>1.2?'#ef4444':betaInfo.beta>1?'#f97316':'#10b981') : '#9ca3af';
  const mUse = cashVal<0 ? Math.abs(cashVal) : 0;
  const mPct = netEq>0 ? mUse/netEq*100 : 0;          // debt ÷ equity, i.e. (leverage − 1)
  const mLev = netEq>0 ? (netEq-cashVal)/netEq : 0;    // non-cash assets ÷ equity
  /* Two legitimate denominators, and conflating them is what made "Margin Used" ambiguous. Robinhood's
     buying-power screen stacks "Margin total" over "Margin used", so THAT name reads as line
     utilisation (loan ÷ credit line). The risk number is loan ÷ equity. The tile is therefore called
     **Leverage** — no name collision — and carries utilisation on its own line. `margin total` isn't in
     the payload but is exactly buying_power + loan (verified against the app: 16,976.33 + 11,282.65 =
     28,258.98). RH's own "margin buffer %" divides by equity too, so mPct shares its basis. */
  const mLine = (mUse>0 && bpVal>0) ? bpVal+mUse : 0;
  const mUtil = mLine>0 ? mUse/mLine*100 : null;
  /* Day % headlines the EQUITY basis (see load()). The holdings basis rides along only when leverage
     makes the two differ — on an unlevered book they're the same number and printing it twice is noise. */
  const dayGross = (stats.dayPnLPGross!=null && Math.abs(stats.dayPnLPGross-dayPnLP)>=0.05) ? stats.dayPnLPGross : null;
  /* Every FIGURE on this tile is unchanged (v116/v118: loan ÷ netEq, line = buying_power + loan) —
     only the colour thresholds moved (2026-08-25). They used to be debt-to-equity 50/25, which
     painted this book permanently red at a level the owner deliberately runs. Colour now tracks the
     owner's BANDS on the line: red only over the ceiling, amber over cruise. With no line derivable
     the tile stays neutral rather than guessing a verdict. */
  const mColor = mUse>0 ? sdUtilColor(mUtil!=null?mUtil/100:null) : '#10b981';
  /* Unrealized vs YTD — two different questions, and conflating them is what made this tile
     misleading. `totalRet`/`totalPnL` is the unrealized mark on the lots you hold RIGHT NOW
     (cost basis of the current shares), so an account that just redeployed a deposit shows a
     near-zero "Total Return" while its real year is well up — realized gains and every closed
     position are simply outside that number. Hence the explicit "on current lots" sub-line and a
     separate YTD tile carrying the account's actual, deposit-adjusted year. */
  /* BOTH sides now report the same KIND of number: the account's own recorded, deposit-adjusted,
     time-weighted return (acctYTDStats over the producer's forward-recorded equity series). They
     used to disagree in kind, not just in value — the self-directed side showed the benchmark
     card's MODELLED figure (today's holdings priced back to Jan 1 at current weights), which is
     blind to everything traded during the year, to realized P&L, and — on a 1.6× book — to
     leverage itself. Robinhood publishes no account-equity history, so the self-directed series
     starts the day the producer began recording it and cannot be backfilled; until it has two
     points the modelled figure still shows, explicitly labelled as modelled. */
  const ytdSrc = O.cashTile ? ((window.__DATA&&window.__DATA.agentic)||null) : ((window.__DATA&&window.__DATA.main)||null);
  const Y = (typeof acctYTDStats==='function') ? acctYTDStats(ytdSrc) : null;
  const ytdLbl = Y ? 'YTD Return' : (O.cashTile ? 'YTD Return' : 'YTD (holdings)');
  let ytdHtml;
  if(Y){
    const sinceLbl=Y.partial?(()=>{ try{ return new Date(String(Y.since).slice(0,10)+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){ return String(Y.since).slice(0,10); } })():'';
    ytdHtml = `<div class="snap-val ${sc(Y.ret)}">${fmtP(Y.ret)}</div><div class="snap-sub">${fmtD(Y.pnl)} net of deposits${sinceLbl?` · since ${sinceLbl}`:''}</div>`;
  } else if(O.cashTile){
    ytdHtml = `<div class="snap-val" style="color:#9ca3af">—</div><div class="snap-sub">needs 2+ recorded days</div>`;
  } else {
    // Recording has just started (or this snapshot predates data.main) — fall back to the modelled
    // figure rather than a dash, and say plainly that it is modelled, not the account's year.
    const P=(window.__SNAP&&window.__SNAP.perf)||null;
    const started=!!(window.__DATA&&window.__DATA.main&&(window.__DATA.main.equityHistory||[]).length);
    ytdHtml = (P&&P.portYTD!=null)
      ? `<div class="snap-val ${sc(P.portYTD)}">${fmtP(P.portYTD)}</div><div class="snap-sub">modelled · holdings at current weights, unlevered${started?' · real tracking starts tomorrow':''}</div>`
      : `<div class="snap-val" style="color:#9ca3af"><span class="spin-sm"></span></div><div class="snap-sub">indexing to Jan 1…</div>`;
  }
  el.innerHTML=`<div class="snap-grid">
    <div class="snap"><div class="snap-lbl">${O.cashTile?'Account Value':'Buying Power'}</div><div class="snap-val">${fmtD(O.cashTile?totalVal:bpVal)}</div><div class="snap-sub">${O.cashTile?'Invested ':'Holdings '}${fmtD(equityVal)}</div></div>
    <div class="snap"><div class="snap-lbl">Day Change</div><div class="snap-val ${sc(dayPnL)}">${fmtD(dayPnL)}</div><div class="snap-sub ${sc(dayPnLP)}">${fmtP(dayPnLP)} today${dayGross!=null?` <span style="color:#9ca3af">· holdings ${fmtP(dayGross)}</span>`:''}</div></div>
    <div class="snap"><div class="snap-lbl">Unrealized</div><div class="snap-val ${sc(totalPnL)}">${fmtP(totalRet)}</div><div class="snap-sub">${fmtD(totalPnL)} on current lots</div></div>
    <div class="snap"><div class="snap-lbl">${ytdLbl}</div>${ytdHtml}</div>
    ${O.cashTile
      // The agentic account can't borrow (limited margin = instant settlement only), so "Margin
      // Used: None" is a wasted tile there — idle cash is the number that actually drives its next
      // rebalance (the deploy-cash trigger fires around 5% of book).
      ? (()=>{ const cPct=totalVal>0?Math.max(0,cashVal)/totalVal*100:0;
          return `<div class="snap"><div class="snap-lbl">Idle Cash</div><div class="snap-val" style="color:${cPct>=15?'#f97316':'#10b981'}">${fmt(cPct,1)}%</div><div class="snap-sub">${fmtD(Math.max(0,cashVal))} uninvested</div>${cPct>0?`<div class="gauge"><div class="gauge-fill" style="width:${Math.min(cPct*4,100)}%;background:${cPct>=15?'#f97316':'#10b981'}"></div></div>`:''}</div>`; })()
      : `<div class="snap"><div class="snap-lbl">Leverage</div><div class="snap-val" style="color:${mUse>0?mColor:'#10b981'}">${mUse>0?`${fmt(mPct,1)}% <span style="font-size:13px;font-weight:700;opacity:.75">· ${fmt(mLev,2)}×</span>`:'None'}</div><div class="snap-sub">${mUse>0?`${fmtD(mUse)} borrowed`:'No borrowing'}</div>${mUse>0?`<div class="gauge"><div class="gauge-fill" style="width:${Math.min(mPct,100)}%;background:${mColor}"></div></div>`:''}${mUtil!=null?`<div class="snap-sub">${fmt(mUtil,1)}% of ${fmtD(mLine)} line</div>`:''}</div>`}
    <div class="snap"><div class="snap-lbl">Portfolio Beta</div><div class="snap-val" style="color:${betaColor}">${betaTxt}</div><div class="snap-sub">vs S&P 500${betaInfo&&betaInfo.coverage?` · ${fmt(betaInfo.coverage,0)}% cov`:''}</div></div>
  </div>`;
}

/* ═══ Performance vs benchmark ═══ */
function buildNorm(series){ if(!series||series.length<2)return null; const c0=series[0].c; return series.map(b=>({t:b.t, v:(b.c/c0-1)*100})); }
/* ═══ Agentic account (••••3900) performance — the ONE source of truth ═══
   Deposit-immune TIME-WEIGHTED growth of the real account from its recorded equity history
   (data.agentic.equityHistory, written forward by the producer — Robinhood has no account-equity
   history endpoint, so it can't be backfilled).

   Raw equity/e0 is WRONG here: this is a self-funded account the owner adds to over time and there
   is no transfers feed, so a deposit inflates equity and reads as a fake return (a $1.0k→$3.5k
   funding jump = a bogus +250% — the bug this math exists to kill). We chain period returns and
   NEUTRALIZE external flows: subtract the producer's inferred cumFlow delta when present (precise),
   and fall back to zeroing any residual implausible one-period jump (a legacy deposit recorded
   before the cumFlow field existed).

   The implied flow of a step is always `cur.equity − prev.equity×(1+r)` once r is settled — the same
   number in both branches — so netFlow/cumFlows stay exactly consistent with the return series.

   Both surfaces (the Portfolio benchmark chart's "Agentic since" stat and the Agentic account page's
   performance card) call this, so they can never disagree. Returns null when fewer than 2 points
   have been recorded. `spySeries` is an optional [{t,c}] daily series for the same-window benchmark. */
function acctPerfStats(AG, spySeries){
  const EH=(AG&&Array.isArray(AG.equityHistory))?AG.equityHistory.slice().filter(e=>e&&e.equity>0).sort((a,b)=>a.t<b.t?-1:1):[];
  if(EH.length<2)return null;
  /* The implausible-jump fallback is for LEGACY points only — those recorded before the producer
     annotated cumFlow, where a deposit is indistinguishable from a return. Once both ends of a step
     carry cumFlow the transfer is already subtracted, and applying the threshold anyway would zero
     out a genuine move. That matters on the self-directed book: it is high-beta and ~1.6× levered,
     so a >20% recorded step is a bad Tuesday, not a mystery deposit, and silently discarding it
     would understate exactly the volatility this account is built to take. */
  const FLOW_JUMP=0.20;
  const mult=[1], cumFlows=[0];
  for(let i=1;i<EH.length;i++){
    const prev=EH[i-1], cur=EH[i];
    const tagged=(typeof cur.cumFlow==='number'&&typeof prev.cumFlow==='number');
    const flow=tagged?(cur.cumFlow-prev.cumFlow):0;
    let r=prev.equity>0?((cur.equity-flow)/prev.equity-1):0;
    if(!isFinite(r)||(!tagged&&Math.abs(r)>FLOW_JUMP))r=0;
    mult.push(mult[i-1]*(1+r));
    cumFlows.push(cumFlows[i-1]+(cur.equity-prev.equity*(1+r)));
  }
  const dkey=t=>String(t).slice(0,10);
  const firstT=dkey(EH[0].t);
  let spy=null;
  if(Array.isArray(spySeries)&&spySeries.length){
    const sFirst=spySeries.find(b=>dkey(b.t)>=firstT), sLast=spySeries[spySeries.length-1];
    if(sFirst&&sLast&&sFirst.c>0)spy=(sLast.c/sFirst.c-1)*100;
  }
  const firstEquity=EH[0].equity, lastEquity=EH[EH.length-1].equity;
  const netFlow=cumFlows[cumFlows.length-1];
  // The individual contribution events behind netFlow, so the card can SHOW its work: a single
  // cumulative "you put in" figure sitting next to today's deposit reads as though all of it
  // arrived today. $50 floor keeps rounding noise out of the list.
  const flows=[];
  for(let i=1;i<cumFlows.length;i++){ const amt=cumFlows[i]-cumFlows[i-1];
    if(Math.abs(amt)>=50) flows.push({t:EH[i].t, amt, tagged:typeof EH[i].cumFlow==='number'}); }
  let days=null; try{ days=Math.round((new Date(dkey(EH[EH.length-1].t)+'T00:00:00')-new Date(firstT+'T00:00:00'))/86400000); }catch(e){}
  return { EH, mult, cumFlows, flows, ret:(mult[mult.length-1]-1)*100, spy, since:EH[0].t,
           netFlow, firstEquity, lastEquity, pnl:lastEquity-firstEquity-netFlow, days };
}
window.acctPerfStats=acctPerfStats;
window.agenticPerfStats=acctPerfStats;   // legacy name, same function

/* YTD slice of the same deposit-adjusted math, for the snapshot's YTD tile.
   Rebases agenticPerfStats' chained growth to the first recorded point of the CURRENT calendar
   year, so a mid-year deposit still can't read as profit. `partial` is true when recording began
   after the year did — the tile then says "since {date}" rather than implying a full-year figure,
   because Robinhood publishes no account-equity history and it cannot be backfilled. */
function acctYTDStats(AG){
  const st=acctPerfStats(AG,null); if(!st)return null;
  const jan=String(new Date().getFullYear())+'-01-01';
  const i0=st.EH.findIndex(e=>String(e.t).slice(0,10)>=jan);
  const last=st.EH.length-1;
  if(i0<0||i0>=last)return null;
  return { ret:(st.mult[last]/st.mult[i0]-1)*100,
           pnl:st.EH[last].equity-st.EH[i0].equity-(st.cumFlows[last]-st.cumFlows[i0]),
           since:st.EH[i0].t, partial:String(st.EH[i0].t).slice(0,10)>jan };
}
window.acctYTDStats=acctYTDStats;
window.agenticYTDStats=acctYTDStats;     // legacy name, same function

function renderPerformance(histMap, enriched, coveredSyms, macroData, stats){
  const el=document.getElementById('perf-content'); if(!el)return;
  const spy=histMap['SPY'], qqq=histMap['QQQ'];
  if(!spy||spy.length<2){ el.innerHTML=`<div class="tech-empty">Benchmark history unavailable.</div>`; return; }
  const axis=spy.map(b=>b.t);
  // portfolio normalized series from covered holdings, weighted by current value
  const wsyms=coveredSyms.filter(s=>histMap[s]&&histMap[s].length>1);
  const wmap={}; let wsum=0;
  for(const s of wsyms){ const p=enriched.find(e=>e.symbol===s); if(p&&p.val>0){ wmap[s]=p.val; wsum+=p.val; } }
  let portSeries=null;
  if(wsum>0){
    const idx={}; for(const s of Object.keys(wmap)){ const m={}; for(const b of histMap[s])m[b.t]=b.c; idx[s]={m,c0:histMap[s][0].c,last:histMap[s][0].c}; }
    portSeries=axis.map(t=>{
      let acc=0;
      for(const s of Object.keys(wmap)){ const o=idx[s]; if(o.m[t]!=null)o.last=o.m[t]; acc+=(wmap[s]/wsum)*(o.last/o.c0); }
      return {t, v:(acc-1)*100};
    });
  }
  const spyN=buildNorm(spy), qqqN=buildNorm(qqq);
  const lastV=a=>a&&a.length?a[a.length-1].v:null;
  const portYTD=lastV(portSeries), spyYTD=lastV(spyN), qqqYTD=lastV(qqqN);
  // ── Agentic account (••••3900) overlay: a faint dotted MODELED lead-in (its current holdings
  // priced back to Jan 1, same trick as portSeries) spliced into the REAL recorded equity line
  // (data.agentic.equityHistory, recorded forward by the producer). dkey() aligns by calendar day so
  // the equity points map onto the SPY axis regardless of timestamp shape.
  const AG=(window.__DATA&&window.__DATA.agentic)||null;
  const dkey=t=>String(t).slice(0,10);
  let agModeled=null, agReal=null, agSince=null;
  if(AG&&Array.isArray(AG.positions)&&AG.positions.length){
    const aw={}; let asum=0;
    for(const p of AG.positions){ const s=p.symbol; if(histMap[s]&&histMap[s].length>1&&p.value>0){ aw[s]=p.value; asum+=p.value; } }
    if(asum>0){
      const idx={}; for(const s of Object.keys(aw)){ const m={}; for(const b of histMap[s])m[b.t]=b.c; idx[s]={m,c0:histMap[s][0].c,last:histMap[s][0].c}; }
      agModeled=axis.map(t=>{ let acc=0; for(const s of Object.keys(aw)){ const o=idx[s]; if(o.m[t]!=null)o.last=o.m[t]; acc+=(aw[s]/asum)*(o.last/o.c0); } return (acc-1)*100; });
    }
    // Real recorded line: mult[] is the deposit-adjusted growth factor (see agenticPerfStats above —
    // shared with the Agentic account page so the two surfaces can't drift apart).
    const st=acctPerfStats(AG, spy);
    if(st&&agModeled){
      const EH=st.EH, mult=st.mult;
      const firstT=dkey(st.since);
      let hi=axis.findIndex(t=>dkey(t)>=firstT); if(hi<0)hi=0;
      const baseMult=1+agModeled[hi]/100;
      agReal=axis.map((t,i)=>{ if(i<hi)return null; const k=dkey(t); let g=1; for(let j=0;j<EH.length;j++){ if(dkey(EH[j].t)<=k)g=mult[j]; else break; } return (baseMult*g-1)*100; });
      agSince={ ret:st.ret, spy:st.spy, since:st.since };
    }
  }
  try{ if(window.__SNAP){ const _cv=wsum>0?(wsum/enriched.reduce((s,p)=>s+Math.max(p.val,0),0)*100):0; window.__SNAP.perf={labels:axis,port:portSeries?portSeries.map(x=>x.v):null,spy:spyN.map(x=>x.v),qqq:qqqN.map(x=>x.v),portYTD,spyYTD,qqqYTD,cov:_cv}; } }catch(e){}
  const _thm=document.documentElement.getAttribute('data-theme');
  const C={ port:_thm==='gold'?'#e3c074':'#6366f1', portBg:_thm==='gold'?'rgba(227,192,116,0.12)':'rgba(99,102,241,0.08)',
    spy:_thm==='gold'?'#8a8170':'#9ca3af', qqq:_thm==='gold'?'#c98a3a':'#10b981',
    grid:_thm==='gold'?'rgba(210,180,120,0.10)':_thm==='dark'?'rgba(255,255,255,0.06)':'#f3f4f6',
    tick:_thm==='gold'?'#b9ad92':'#9ca3af', ag:_thm==='gold'?'#3fcf94':'#0891b2' };
  const agDateLbl=agSince?(()=>{ try{ return new Date(dkey(agSince.since)+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){ return dkey(agSince.since); } })():'';
  /* The self-directed account's OWN recorded return, on the same footing as the agentic one. It sits
     beside the modelled "Your holdings YTD" deliberately: the two answer different questions and the
     card is where that difference should be visible, rather than leaving the snapshot tile above
     silently disagreeing with the figure here (the v117 lesson). */
  const mdSince=(typeof acctPerfStats==='function')?acctPerfStats((window.__DATA&&window.__DATA.main)||null,spy):null;
  const mdDateLbl=mdSince?(()=>{ try{ return new Date(dkey(mdSince.since)+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){ return dkey(mdSince.since); } })():'';
  el.innerHTML=`
    <div class="perf-head">
      <div class="perf-metric"><div class="pm-l">Your holdings YTD*</div><div class="pm-v ${sc(portYTD)}">${portYTD!=null?fmtP(portYTD):'—'}</div></div>
      <div class="perf-metric"><div class="pm-l">S&P 500 (SPY)</div><div class="pm-v ${sc(spyYTD)}">${fmtP(spyYTD)}</div></div>
      <div class="perf-metric"><div class="pm-l">Nasdaq-100 (QQQ)</div><div class="pm-v ${sc(qqqYTD)}">${fmtP(qqqYTD)}</div></div>
      <div class="perf-metric"><div class="pm-l">Total return since cost</div><div class="pm-v ${sc(stats.totalPnL)}">${fmtP(stats.totalRet)}</div></div>
      ${mdSince?`<div class="perf-metric"><div class="pm-l">This account since ${mdDateLbl}</div><div class="pm-v ${sc(mdSince.ret)}">${fmtP(mdSince.ret)}</div>${mdSince.spy!=null?`<div class="pm-sub" style="font-size:10.5px;color:var(--nx-muted,#9ca3af);margin-top:2px">SPY ${fmtP(mdSince.spy)} same window</div>`:''}</div>`:''}
      ${agSince?`<div class="perf-metric"><div class="pm-l">Agentic since ${agDateLbl}</div><div class="pm-v ${sc(agSince.ret)}">${fmtP(agSince.ret)}</div>${agSince.spy!=null?`<div class="pm-sub" style="font-size:10.5px;color:var(--nx-muted,#9ca3af);margin-top:2px">SPY ${fmtP(agSince.spy)} same window</div>`:''}</div>`:''}
    </div>
    <div class="chart-wrap"><canvas id="perf-chart"></canvas></div>
    <div class="legend-row">
      <span class="legend-item"><span class="legend-dot" style="background:${C.port}"></span>Your holdings*</span>
      <span class="legend-item"><span class="legend-dot" style="background:${C.spy}"></span>SPY</span>
      <span class="legend-item"><span class="legend-dot" style="background:${C.qqq}"></span>QQQ</span>
      ${agModeled?`<span class="legend-item"><span class="legend-dot" style="background:${C.ag}"></span>Agentic${agReal?' (— real · ⋯ modeled)':' (⋯ modeled)'}</span>`:''}
    </div>
    <div class="fund-note">*Price-return of your <b>current</b> holdings held at today's weights from Jan 1 — a like-for-like comparison vs the index, not a time-weighted account return (purchase history isn't available from the broker). <b>It says nothing about your entry prices</b> — a name can be well up on the year and still be a loss for you if you bought it after the run. Covers ${fmt(wsum>0?(wsum/enriched.reduce((s,p)=>s+Math.max(p.val,0),0)*100):0,0)}% of equity. Every line's final point is today's live price, so the daily bars lagging a session can't quietly age this card.${mdSince?` <b>This account since ${mdDateLbl}</b> is the different, harder number: your real account equity, deposit-adjusted and time-weighted, including everything you traded and any leverage you carried — which is why it can differ sharply from the modelled figure. It only runs from ${mdDateLbl} because the broker publishes no account-equity history, so it can't be backfilled.`:''}${agModeled?` <b style="color:${C.ag}">Agentic</b> overlays the agentic account (••••3900): <b>⋯ dotted</b> = modeled (its current holdings priced back to Jan 1); ${agReal?`<b>— solid</b> = real tracked return since ${agDateLbl}, <b>deposit-adjusted</b> (cash you add or withdraw isn't counted as a gain — this is a time-weighted return, not the raw account balance).`:`real tracking begins once a few daily snapshots accumulate.`}`:''}</div>
    ${macroData?`<div class="macro-strip" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--surface-2)">
      <div><div class="snap-lbl">10yr Treasury</div><div style="font-size:16px;font-weight:700">${macroData.tenYrYield?fmt(macroData.tenYrYield,2)+'%':'—'}</div></div>
      <div><div class="snap-lbl">Fed Funds</div><div style="font-size:16px;font-weight:700">${macroData.fedFunds?fmt(macroData.fedFunds,2)+'%':'—'}</div></div>
      <div><div class="snap-lbl">CPI YoY</div><div style="font-size:16px;font-weight:700;color:${macroData.cpi!=null?(macroData.cpi>3?'#ef4444':macroData.cpi>2?'#f97316':'#10b981'):'#1c1c1e'}">${macroData.cpi!=null?fmt(macroData.cpi,1)+'%':'—'}</div></div>
      <div><div class="snap-lbl">VIX</div><div style="font-size:16px;font-weight:700;color:${macroData.vix?(macroData.vix>25?'#ef4444':macroData.vix>18?'#f97316':'#10b981'):'#1c1c1e'}">${macroData.vix?fmt(macroData.vix,1):'—'}</div></div>
    </div>`:''}
  `;
  const ctx=document.getElementById('perf-chart'); if(!ctx)return;
  const ds=[];
  if(portSeries) ds.push({label:'Your holdings',data:portSeries.map(x=>x.v),borderColor:C.port,backgroundColor:C.portBg,borderWidth:2.2,pointRadius:0,fill:true,tension:0.15});
  ds.push({label:'SPY',data:spyN.map(x=>x.v),borderColor:C.spy,borderWidth:1.5,pointRadius:0,tension:0.15});
  ds.push({label:'QQQ',data:qqqN.map(x=>x.v),borderColor:C.qqq,borderWidth:1.5,pointRadius:0,tension:0.15});
  if(agModeled) ds.push({label:'Agentic (modeled)',data:agModeled,borderColor:C.ag,borderWidth:1.4,borderDash:[3,3],pointRadius:0,tension:0.15});
  if(agReal) ds.push({label:'Agentic',data:agReal,borderColor:C.ag,borderWidth:2,pointRadius:0,spanGaps:false,tension:0.15});
  new Chart(ctx,{ type:'line', data:{labels:axis,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>items[0].label, label:c=>` ${c.dataset.label}: ${c.parsed.y>=0?'+':''}${c.parsed.y.toFixed(1)}%`}}},
      scales:{x:{ticks:{maxTicksLimit:6,font:{size:10},color:C.tick},grid:{display:false}},y:{ticks:{callback:v=>v+'%',font:{size:11},color:C.tick},grid:{color:C.grid}}}
    }});
}

/* ═══ Action Feed (merged alerts + recommendations) ═══ */
function buildActionFeed(enriched, port, clusters, totalVal, rsiMap, ovMap, earningsMap){
  /* `equity_value` is GROSS long market value; the account's equity is `total_value` (see load()).
     Dividing the loan by the gross figure understated the margin alert by the leverage factor. */
  const A=[]; const cash=parseFloat(port.cash||0); const grossVal=parseFloat(port.equity_value||1);
  const equity=parseFloat(port.total_value||0)||Math.max(1,grossVal+cash);
  const add=(o)=>A.push(o);
  /* Name a paydown candidate the owner could ACTUALLY sell: shares backing a covered call are not
     available, and pointing at them is how you talk someone into a naked short call. Size the
     suggestion to what's free, and pick the WEAKEST-MOMENTUM name — not the largest, which is how
     this alert came to say "sell PLTR" (the biggest position, 9.8/10 and leading) while the plan's
     own paydown table correctly sourced from the weakest. Two surfaces naming different sells for
     the same loan is worse than either one alone; both now shed where leadership is thinnest. */
  /* Margin is judged against the owner's BANDS on the credit line (2026-08-25), not against a
     leverage cap: below cruise this feed is SILENT, between cruise and the ceiling it is one amber
     informational line, and only above the ceiling is it a red do-now. Firing red on any loan at all
     — which is what `cash<-1000` did — trained the owner to ignore the alert on a book whose whole
     design is to carry one. */
  const M=sdMargin(equity,grossVal,cash,parseFloat((port.buying_power&&port.buying_power.buying_power)||0));
  const callTxt=M.callDrop!=null?`Est. margin-call distance ≈ a ${fmt(M.callDrop*100,0)}% uniform drop (25% maintenance).`:'';
  if(M.debt>0){
    const lk=(typeof sdLockedShares==='function')?sdLockedShares():{};
    const freeOf=p=>Math.max(0,(+p.qty||0)-((lk[p.symbol]&&lk[p.symbol].shares)||0));
    const overLine=(M.util!=null)?(M.util>SD_UTIL_MAX?M.debt-SD_UTIL_MAX*M.line:0)
                                 :Math.max(0,grossVal-SD_LEV_FALLBACK*equity);
    if(overLine>0){
      const scoreOf=p=>{ const mm=(typeof sdMomentum==='function')?sdMomentum(p.symbol):null;
                         return (mm&&mm.score!=null)?mm.score:99; };   // unscored never volunteers ahead of a scored laggard
      const t=[...enriched].filter(p=>p.px>0&&freeOf(p)*p.px>=250)
        .sort((a,b)=>(scoreOf(a)-scoreOf(b))||(freeOf(b)*b.px-freeOf(a)*a.px))[0];
      const need=t?Math.ceil(overLine/t.px):0, canSell=t?Math.floor(freeOf(t)):0, sh=Math.min(need,canSell);
      add({pr:0,icon:'🔴',c:'#ef4444',bg:'#fee2e2',fg:'#991b1b',tag:'MARGIN',
        title:M.util!=null?`Over your ${fmt(SD_UTIL_MAX*100,0)}% ceiling — ${fmtD(M.debt)} is ${fmt(M.util*100,1)}% of your ${fmtD(M.line)} line`
                          :`Leverage ${fmt(M.lev,2)}× — past the ${fmt(SD_LEV_FALLBACK,2)}× fallback ceiling (no buying-power figure, so the line can't be derived)`,
        detail:`Raising ≈ ${fmtD(overLine)} brings you back inside the band.${t?` Selling ~${sh} sh of ${t.symbol} (~${fmtD(t.px)}) ${sh>=need?'would do it':`covers ${fmtD(sh*t.px)} of it${lk[t.symbol]?` — the rest of ${t.symbol} is pledged to your covered calls`:`, the largest freely sellable position`}`}.`:''} ${callTxt}`});
    } else if(M.util!=null&&M.util>SD_UTIL_CRUISE){
      add({pr:3,icon:'🟠',c:'#f97316',bg:'#ffedd5',fg:'#9a3412',tag:'MARGIN',
        title:`Loan ${fmtD(M.debt)} — ${fmt(M.util*100,1)}% of your ${fmtD(M.line)} line`,
        detail:`Above your ${fmt(SD_UTIL_CRUISE*100,0)}% cruise band, below the ${fmt(SD_UTIL_MAX*100,0)}% ceiling — nothing to do, this is the band you chose. ${fmtD(Math.max(0,SD_UTIL_MAX*M.line-M.debt))} of headroom left. ${callTxt}`});
    }
  }
  /* Concentration alone is NOT an alert on this side — a leader at 90% of equity is the mandate
     working. What is dangerous is size WITHOUT leadership, so this fires only when a big name is
     also broken or under the momentum floor. (PLTR at 9.0/10 stays silent; IREN at 1.4/10 does not.) */
  const conc=[...enriched].filter(p=>p.px>0&&equity>0&&p.val>equity*SD_CONC_FLAG).map(p=>{
      const mm=(typeof sdMomentum==='function')?sdMomentum(p.symbol):null;
      const br=(typeof sdBroken==='function')?sdBroken(p.symbol,p.avg):null;
      return {p, mm, br, pctEq:p.val/equity*100,
              weak:!!((br&&br.broken)||(mm&&mm.score!=null&&mm.score<SD_MIN_SCORE))};
    }).filter(x=>x.weak).sort((a,b)=>b.pctEq-a.pctEq);
  const critSet=new Set(conc.map(x=>x.p.symbol));
  for(const x of conc.slice(0,2)){ const p=x.p; const fpe=parseFloat(ovMap[p.symbol]?.ForwardPE)||null; const vN=fpe&&fpe>60?` Fwd P/E ${fmt(fpe,0)} adds valuation risk.`:'';
    const wN=(x.br&&x.br.broken)?`its trend is broken (${x.br.why})`:`momentum is ${fmt(x.mm&&x.mm.score!=null?x.mm.score:0,1)}/10, under the ${fmt(SD_MIN_SCORE,1)} floor`;
    add({pr:1,icon:'🔴',c:'#ef4444',bg:'#fee2e2',fg:'#991b1b',tag:'TRIM',title:`${p.symbol} is ${fmt(x.pctEq,1)}% of equity and not leading`,
      detail:`Size isn't the problem here — size plus weakness is: ${wN}. A 20% drop in ${p.symbol} alone takes the account down ~${fmt(x.pctEq*0.2,1)}%.${vN}`}); }
  const upE=Object.entries(earningsMap||{}).filter(([s,e])=>enriched.find(p=>p.symbol===s&&p.val>=SMALL_THR)&&e.daysAway<=14).sort((a,b)=>a[1].daysAway-b[1].daysAway);
  for(const [s,e] of upE.slice(0,3)){ const p=enriched.find(x=>x.symbol===s); const u=e.daysAway<=3?'IMMINENT':e.daysAway<=7?'THIS WEEK':'UPCOMING'; add({pr:2,icon:'🗓️',c:'#6366f1',bg:'#ede9fe',fg:'#4c1d95',tag:'EARNINGS',title:`${s} reports in ${e.daysAway}d (${e.reportDate}) — ${u}`,detail:`You hold ${fmtD(p?.val||0)} (${fmt(p?.pct||0,1)}%). Decide: hold through, trim, or set a stop.${e.estimate?` Est EPS $${parseFloat(e.estimate).toFixed(2)}.`:''}`}); }
  const ob=[...enriched].filter(p=>rsiMap[p.symbol]>=72&&p.pct>3&&p.px>0&&!critSet.has(p.symbol)).sort((a,b)=>rsiMap[b.symbol]-rsiMap[a.symbol]);
  for(const p of ob.slice(0,2)){ add({pr:3,icon:'🟠',c:'#f97316',bg:'#ffedd5',fg:'#9a3412',tag:'OVERBOUGHT',title:`${p.symbol} RSI ${fmt(rsiMap[p.symbol],0)} — extended`,detail:`At ${fmt(p.pct,1)}% (${fmtD(p.val)}). Momentum is hot; consider trimming into strength rather than adding.`}); }
  const win=[...enriched].filter(p=>p.pnlP>40&&p.pct>4&&p.px>0&&!critSet.has(p.symbol)&&!(rsiMap[p.symbol]>=72)).sort((a,b)=>b.pnlP-a.pnlP);
  for(const p of win.slice(0,1)){ const n=Math.max(1,Math.floor(p.qty*0.25)); add({pr:4,icon:'🟢',c:'#10b981',bg:'#d1fae5',fg:'#065f46',tag:'TAKE PROFIT',title:`${p.symbol} up ${fmt(p.pnlP,0)}% from cost`,detail:`Trim 25% (~${n} sh @ ${fmtD(p.px)}) → locks ${fmtD(n*(p.px-p.avg))} gain, raises ${fmtD(n*p.px)} cash.`}); }
  const os=[...enriched].filter(p=>rsiMap[p.symbol]<=30&&p.pct>1&&p.pnlP>-40&&p.px>0).sort((a,b)=>rsiMap[a.symbol]-rsiMap[b.symbol]);
  for(const p of os.slice(0,1)){ add({pr:4,icon:'🟢',c:'#10b981',bg:'#d1fae5',fg:'#065f46',tag:'ADD',title:`${p.symbol} RSI ${fmt(rsiMap[p.symbol],0)} — oversold`,detail:`If the thesis holds, a high-conviction add point. Avg cost ${fmtD(p.avg)}, now ${fmtD(p.px)}.`}); }
  // (Tax-loss harvest is owned by the plan tier below — see renderActionPlan Step 1.)
  const bigCl=Object.entries(clusters).filter(([,c])=>c.pct>20&&c.matched.length>1).sort((a,b)=>b[1].pct-a[1].pct);
  for(const [name,c] of bigCl.slice(0,1)){ add({pr:6,icon:'🟠',c:'#f97316',bg:'#ffedd5',fg:'#9a3412',tag:'CORRELATED',title:`${name} = ${fmt(c.pct,1)}% combined`,detail:`${c.matched.map(p=>p.symbol).join(', ')} move together — effectively one macro bet. A sector hit lands on all of them.`}); }
  try{
    const soc=(window.__DATA&&window.__DATA.social)||null;
    if(soc&&soc.tickers){
      const heldSet=new Set(enriched.filter(p=>p.val>0).map(p=>p.symbol));
      const buzz=Object.entries(soc.tickers).filter(([s,t])=>heldSet.has(s)&&t.tracked&&t.rank!=null&&t.rank<=20)
        .map(([s,t])=>({s,t})).sort((a,b)=>a.t.rank-b.t.rank);
      for(const {s,t} of buzz.slice(0,1)){ const p=enriched.find(x=>x.symbol===s); const crowd=t.rank<=5;
        const vel=t.mentionChg!=null?` Mentions ${t.mentionChg>=0?'+':''}${t.mentionChg}% in 24h.`:'';
        add({pr:crowd?3:6,icon:'🗣️',c:crowd?'#f97316':'#6366f1',bg:crowd?'#ffedd5':'#ede9fe',fg:crowd?'#9a3412':'#4c1d95',tag:crowd?'CROWDED':'RETAIL BUZZ',
          title:`${s} is #${t.rank} most-talked-about on Reddit`,
          detail:`${crowd?'Peak retail attention often marks short-term tops — treat strength as a chance to trim into the crowd, not chase.':`Elevated retail chatter on a name you hold (${fmt(p?p.pct:0,1)}% of book). Watch for a momentum pop or a fade.`}${vel}`}); }
    }
  }catch(e){}
  A.sort((a,b)=>a.pr-b.pr);
  return A.slice(0,9);
}
function renderActionFeed(list){

/* Paint both tiers of the Action Center from the latest portfolio snapshot (window.__SNAP).
   The card markup now lives on the Plan & Picks page, but the data is portfolio-derived: the main
   load() flow stashes each enrichment stage into __SNAP and calls this as the data lands, and the
   Picks page calls it when it renders — so the card populates whether the Picks tab is opened before
   or after the portfolio finished loading. No-ops cleanly until both the data and the DOM exist. */
function paintActionCenter(){
  // The agentic cards live on the Accounts tab's Agentic side (rendered lazily on first visit), so
  // these no-op until that page exists — then they re-render here as ovMap/smaMap land to upgrade
  // sectors/stops. They read data.agentic + picks, never the margin book, so they're painted BEFORE
  // the margin-data early-return below: the agentic account must show even if the margin book hasn't
  // loaded (or failed).
  if(document.getElementById('agentic-content')){ try{ renderAgenticCard(); }catch(e){} }
  // The Plan tab's agentic side reads the same state; repaint it as quotes/earnings land so its
  // deferral badges track the card's (only once it has been rendered — the container always exists).
  if(_planAgInit&&document.getElementById('b-agp-target')){ try{ renderAgenticPlan(); }catch(e){} }
  if(document.getElementById('agentic-log-content')){ try{ renderAgenticLog(); }catch(e){} }
  if(document.getElementById('ag-perf-content')){ try{ renderAgenticPerf(); }catch(e){} }
  if(document.getElementById('risk-content-ag')){ try{ renderAgenticAnalytics(); }catch(e){} }
  if(document.getElementById('flow-content')){ try{ renderFlowCard({scope:'main'}); }catch(e){} }
  if(document.getElementById('flow-content-ag')){ try{ renderFlowCard({sfx:'-ag',scope:'agentic'}); }catch(e){} }
  const S=window.__SNAP; if(!S||!S.enriched)return;
  const tv=(S.stats&&S.stats.totalVal)||S.totalVal||0;
  if(document.getElementById('act-content')){
    try{ renderActionFeed(buildActionFeed(S.enriched,S.port||{},S.clusters,tv,S.rsiMap||{},S.ovMap||{},S.earn||{})); }catch(e){}
  }
  if(document.getElementById('plan-content')){
    try{ renderActionPlan(S.enriched,S.clusters,tv,S.betaInfo,S.rsiMap,S.ovMap,S.earn,S.smaMap); }catch(e){}
  }
}
window.paintActionCenter=paintActionCenter;

/* ═══ Risk & Diversification ═══ */
function renderRisk(enriched, clusters, totalVal, betaInfo, metrics, corrG, opts){
  const el=document.getElementById('risk-content'+((opts&&opts.sfx)||'')); if(!el)return;
  const eqVal=enriched.reduce((s,p)=>s+Math.max(p.val,0),0);
  const beta=betaInfo?betaInfo.beta:null;
  const stressTxt = beta!=null ? fmtP(-10*beta) : '—';
  const top=[...enriched].filter(p=>p.val>0).sort((a,b)=>b.pct-a.pct)[0];
  const topCl=Object.entries(clusters).filter(([,c])=>c.matched.length>0).sort((a,b)=>b[1].pct-a[1].pct)[0];
  // HHI on equity weights
  let hhi=0; for(const p of enriched){ if(p.val>0&&eqVal>0){ const w=p.val/eqVal; hhi+=w*w; } }
  const effN = hhi>0?1/hhi:0;
  const scn=[{l:'Market −5%',v:beta!=null?-5*beta:null},{l:'Market −10%',v:beta!=null?-10*beta:null},{l:'Market −20%',v:beta!=null?-20*beta:null}];
  const M=metrics;
  const spin='<span class="spin-sm"></span>';
  const sharpeTxt = M&&M.sharpe!=null ? fmt(M.sharpe,2) : (M?'—':spin);
  const sharpeCol = M&&M.sharpe!=null ? (M.sharpe>=1?'#10b981':M.sharpe>=0?'#f59e0b':'#ef4444') : '#9ca3af';
  const volTxt = M ? fmt(M.vol,1)+'%' : spin;
  const volCol = M ? (M.vol>=35?'#ef4444':M.vol>=22?'#f59e0b':'#10b981') : '#9ca3af';
  const ddTxt = M ? fmt(M.maxDD,1)+'%' : spin;
  const betaTileTxt = beta!=null ? fmt(beta,2) : spin;
  const betaTileCol = beta!=null ? (beta>1.2?'#ef4444':beta>1?'#f97316':'#10b981') : '#9ca3af';
  el.innerHTML=`
    <div style="font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:7px">Risk-adjusted <span style="font-weight:400;text-transform:none;letter-spacing:0">(YTD, annualized)</span></div>
    <div class="scn-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="scn"><div class="scn-lbl">Sharpe</div><div class="scn-val" style="color:${sharpeCol}">${sharpeTxt}</div></div>
      <div class="scn"><div class="scn-lbl">Volatility</div><div class="scn-val" style="color:${volCol}">${volTxt}</div></div>
      <div class="scn"><div class="scn-lbl">Max Drawdown</div><div class="scn-val ${M&&M.maxDD<0?'neg':''}">${ddTxt}</div></div>
      <div class="scn"><div class="scn-lbl">Beta</div><div class="scn-val" style="color:${betaTileCol}">${betaTileTxt}</div></div>
    </div>
    <div class="stress-row"><div class="stress-big ${beta!=null?'neg':''}">${stressTxt}</div><div class="stress-cap">estimated portfolio move if the market drops 10%${beta!=null?` (beta ${fmt(beta,2)})`:''}</div></div>
    <div class="scn-grid">${scn.map(s=>`<div class="scn"><div class="scn-lbl">${s.l}</div><div class="scn-val ${s.v!=null?'neg':''}">${s.v!=null?fmtP(s.v):'—'}</div></div>`).join('')}</div>
    <div style="margin-top:14px">
      <div class="risk-line"><span class="risk-name">Largest single position</span><span class="risk-val">${top?`${top.symbol} · ${fmt(top.pct,1)}%`:'—'}</span></div>
      <div class="risk-line"><span class="risk-name">Largest correlated cluster</span><span class="risk-val">${topCl?`${topCl[0]} · ${fmt(topCl[1].pct,1)}%`:'—'}</span></div>
      <div class="risk-line"><span class="risk-name">Effective # of bets (1/HHI)</span><span class="risk-val">${effN?fmt(effN,1):'—'} <span style="font-weight:400;color:#9ca3af">of ${enriched.filter(p=>p.val>0).length} positions</span></span></div>
      <div class="risk-line"><span class="risk-name">Portfolio beta</span><span class="risk-val">${beta!=null?fmt(beta,2):'<span class=spin-sm></span>'} <span style="font-weight:400;color:#9ca3af">vs 1.00 market</span></span></div>
    </div>
    <div class="cov-note">Beta-weighted stress assumes each name moves with its historical beta — a rough guide, not a guarantee. ${betaInfo&&betaInfo.coverage?`Beta covers ${fmt(betaInfo.coverage,0)}% of equity.`:''} "Effective # of bets" near your position count = well spread; far below = concentrated. Sharpe &amp; volatility are annualized from YTD daily returns of your covered top holdings${M?` (${fmt(M.cov,0)}% of equity, risk-free ≈ 10-yr yield)`:''}; Sharpe &gt; 1 is strong.</div>
    ${(()=>{
      const perSym=betaInfo&&betaInfo.perSym?betaInfo.perSym:null;
      const blocks=[];
      // Concentration context — the largest correlated theme, named dynamically.
      if(topCl&&topCl[1].pct>=20&&topCl[1].matched.length>1){ const mem=topCl[1].matched.sort((a,b)=>b.val-a.val).map(p=>p.symbol).join(' · ');
        blocks.push(`<div class="box-info" style="border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.45"><b>Largest theme — ${topCl[0]} at ${fmt(topCl[1].pct,1)}%.</b> ${mem} tend to move together, so a sector hit lands on all of them at once. Concentration is the bet here; size new adds with that in mind.</div>`); }
      // Empirically correlated group (from actual return correlation, not a static list).
      if(corrG&&corrG.length&&corrG[0].pct>=15){ const g=corrG[0]; const mem=g.members.slice(0,6).map(m=>m.sym).join(', ');
        blocks.push(`<div class="box-bear" style="border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.45"><b>Tightly correlated cluster — ${fmt(g.pct,1)}% of equity${g.avgCorr!=null?`, avg ρ ≈ ${fmt(g.avgCorr,2)}`:''}.</b> ${mem} have been moving as one block in YTD daily returns — effectively a single position for risk purposes.</div>`); }
      // Fragile leg — the highest-beta meaningful holding, derived from per-symbol beta.
      if(perSym){ const cand=enriched.filter(p=>p.val>0&&p.pct>=1.5&&perSym[p.symbol]!=null).map(p=>({p,b:perSym[p.symbol]})).sort((a,b)=>b.b-a.b)[0];
        if(cand&&cand.b>=1.5){ blocks.push(`<div class="cov-note" style="margin-top:0"><b style="color:var(--text)">Fragile leg:</b> ${cand.p.symbol} (β ≈ ${fmt(cand.b,1)}, ${fmt(cand.p.pct,1)}% of book) is your most market-sensitive position — a 10% market drop implies ≈ ${fmtP(-10*cand.b)} on it alone. Tighter stops and smaller size belong here, not on the low-β names.</div>`); }
      }
      // Optional owner editorial, carried in data.notes (string or {risk}). Updates with the snapshot
      // rather than living in the shell, so context never goes stale silently.
      const note=(()=>{ try{ const n=window.__DATA&&window.__DATA.notes; if(!n)return null; return typeof n==='string'?n:(n.risk||null);}catch(e){return null;} })();
      if(note) blocks.push(`<div class="box-info" style="border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.45">📝 ${note}</div>`);
      if(!blocks.length) return '';
      return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--surface-2)"><div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:7px">🔎 Concentration &amp; correlation context</div><div style="display:grid;gap:8px">${blocks.join('')}</div></div>`;
    })()}
  `;
}

function sdStop(m){ const v=(m&&m.vol)||40; return (m.px)*(1-Math.max(0.12,Math.min(0.35,v/300))); }
/* Uniform drop that would take the account to a ~25% maintenance call: after a fall of d,

  const today=_snapETDate();

/* Shares pledged as collateral against your OWN open/pending short calls — 100 per contract.

   open $50 calls, because those shares are what makes them COVERED. Sell them and the broker leaves

     2 · DEPLOY INTO THE MANDATE — four aggressive sleeves fed by the momentum lens (sdMomentum),

  const equity=(+st.totalVal>0)?+st.totalVal:exposure;

  const locked=sdLockedShares();

    const frac=r.p.qty>0?sellQty/r.p.qty:0;

  const lockedExits=broken.filter(r=>r.sellQty<=0);

     sold a leader for being large, which on 2026-08-25 meant "sell the PLTR you bought this morning
     at 9.0/10 momentum" — a dial overruling the mandate. Sourced from the WEAKEST-momentum sellable
     holdings first: if the book has to come down, it comes down where leadership is thinnest.

                          : Math.max(0,exposure-SD_LEV_FALLBACK*equity);   // no line ⇒ fallback ceiling, and the UI says so

  const payRows=[]; let payShort=0;

      const proceeds=sh*r.p.px, pl=sh*(r.p.px-r.p.avg);
      payRows.push({r,sh,proceeds,pl,capped:sh<want,lock:locked[r.p.symbol]||null});
      soldVal[r.p.symbol]=(soldVal[r.p.symbol]||0)+proceeds;
      need-=proceeds; }
    payShort=Math.max(0,need);      // collateral reserve (or simply not enough free stock) left some overage standing
  }
  const payProceeds=payRows.reduce((s,t)=>s+t.proceeds,0), payPl=payRows.reduce((s,t)=>s+t.pl,0);

  /* 1c · CONCENTRATION READOUT — advisory, never an order. Same precedent as
     producer/riskweights.mjs `LOOKTHROUGH_ENFORCE=false`: measure and disclose, don't bind. On this
     side the concentration IS the mandate; what the reader needs is the size of the bet stated
     plainly plus the level that protects it, not a cap that liquidates a winner. */
  const concRows=keep.filter(r=>equity>0&&r.p.val>equity*SD_CONC_FLAG)
    .sort((a,b)=>b.p.val-a.p.val)
    .map(r=>({ r, pctEq:r.p.val/equity*100, hit:(r.p.val/equity*100)*0.2,
               stop:(r.m&&r.m.px>0)?sdStop(r.m):null,
               score:(r.m&&r.m.score!=null)?r.m.score:null }));
  const aiVal=keep.filter(r=>SD_AI_CLUSTERS.indexOf((typeof clusterFor==='function')?clusterFor(r.p.symbol):null)>=0)
                  .reduce((s,r)=>s+r.p.val,0);

  const freed=exitProceeds+payProceeds;          // ONE pass — no shares counted twice
  const netTaxable=exitPl+payPl;
  const sellOrders=[
    ...exits.map(r=>({side:'SELL',sym:r.p.symbol,qty:+fmt(r.sellQty,r.sellQty<1?3:2),limit:r.p.px,
      note:'exit — thesis broken'+(r.lock?` (only the ${fmt(r.sellQty,2)} sh not backing your ${r.lock.contracts} short call${r.lock.contracts===1?'':'s'})`:'')})),
    ...payRows.map(t=>({side:'SELL',sym:t.r.p.symbol,qty:t.sh,limit:t.r.p.px,note:`raise cash — back under the ${fmt(SD_UTIL_MAX*100,0)}% margin ceiling`})),
  ];

  /* ── 2 · The deployable pool ─────────────────────────────────────────────────────────────── */
  /* The pool borrows only up to the CRUISE band — the level the owner is comfortable running at
     without thinking about it. Everything between cruise and the ceiling is deliberately NOT
     spent here; it is offered separately as "press room", because borrowing into the top fifth of
     the line is a decision he makes, not one the plan makes for him. */
  const payDown=onMargin?Math.min(freed,debt):0;   // proceeds net against the loan at the broker
  const expAfter=exposure-freed;
  const debtAfter=Math.max(0,M.debt-payDown);
  const roomToCruise=utilKnown ? Math.max(0,SD_UTIL_CRUISE*M.line-debtAfter)
                               : Math.max(0,SD_LEV_FALLBACK*equity-expAfter);
  const marginUse=Math.min(roomToCruise,M.brokerRoom);
  const pool=(freed-payDown)+cashAvail+marginUse;
  /* Press room: what's left between cruise and the ceiling, net of what the pool already borrows —
     subtracting `marginUse` is what stops the two figures double-counting the same dollars. */
  /* Suppressed while a paydown is in flight — offering "you could borrow more" in the same breath as
     "you are over your ceiling" is incoherent — and floored at PRESS_MIN so a few dollars of residual
     line doesn't render a whole block. */
  const PRESS_MIN=100;
  const pressRaw=utilKnown ? Math.min(Math.max(0,SD_UTIL_MAX*M.line-debtAfter-marginUse),Math.max(0,M.brokerRoom-marginUse)) : 0;
  const pressRoom=(payNeed>0||pressRaw<PRESS_MIN)?0:pressRaw;

  /* ── The momentum lens: rank the mandate's universe, then gate it ────────────────────────── */
  const heldSyms=new Set(held.map(p=>p.symbol));
  const universe=[...new Set([...Object.keys(SD_BENCH),...heldSyms])];
  const tierOf=(m)=>SD_BENCH[m.sym]||(m.vol<50?'core':(m.vol<80?'sat':'asym'));
  const scored=[], abstained=[];
  for(const s of universe){ const m=sdMomentum(s); if(!m)continue;
    if(m.score==null){ if(SD_BENCH[s])abstained.push({sym:s,reason:m.reason}); continue; }
    scored.push({...m,tier:tierOf(m)}); }
  scored.sort((a,b)=>b.rank-a.rank);

  // Value of each name AFTER step 1 — the book the buy legs size against.
  const baseAfter={}; for(const r of rows) baseAfter[r.p.symbol]=exitSet.has(r.p.symbol)?0:Math.max(0,r.p.val-(soldVal[r.p.symbol]||0));
  const sellingNow=new Set([...exitSet,...payRows.map(t=>t.r.p.symbol)]);

  const blocked=[];   // why an otherwise-good name can't be bought right now
  /* No name/cluster CAP filter here any more (2026-08-25). A leader being large is not a reason to
     stop buying it on this side — the sizing clamp inside the allocator is the whole restraint, and
     it shrinks a leg rather than vetoing a name. */
  const eligible=scored.filter(m=>{
    if(sellingNow.has(m.sym)){ return false; }                       // never buy what we're selling
    if(wash[m.sym]){ blocked.push({sym:m.sym,kind:'wash',t:wash[m.sym]}); return false; }
    const br=sdBroken(m.sym,0); if(br.broken){ blocked.push({sym:m.sym,kind:'broken',why:br.why}); return false; }
    return true;
  });

  /* Only names clearing the momentum floor may be bought; the rest are named so the reader can see
     what was considered and rejected rather than wondering why a sleeve is empty. */
  const byTier={core:[],sat:[],asym:[]}, belowBar=[];
  for(const m of eligible){ if(!byTier[m.tier])continue;
    if(m.score>=SD_MIN_SCORE)byTier[m.tier].push(m); else belowBar.push(m); }
  /* An empty sleeve's weight cascades UP toward core (asym → sat → core) rather than being forced
     into a name that failed the screen. If no sleeve qualifies, it all stays as dry powder — "there
     is no leadership to buy today" is a legitimate answer and a much better one than a bad fill. */
  const wOf={core:0,sat:0,asym:0}; let carry=0;
  for(const k of ['asym','sat','core']){ const S=SD_SLEEVES.find(x=>x.k===k);
    if(byTier[k].length){ wOf[k]=S.w+carry; carry=0; } else carry+=S.w; }

  /* Allocate each sleeve INVERSE-VOL across its top names: a 114%-vol miner and a 39%-vol megacap
     do not belong in the book at the same dollar size, even at the same conviction. Factored into a
     pure-ish function because it is run TWICE — once on the cruise pool, once on pool+press room —
     and the press block renders only the delta. Each run starts from `baseAfter`, never from the
     other run's state. */
  function sdAllocate(budget){
    const after={}; for(const k of Object.keys(baseAfter))after[k]=baseAfter[k];
    /* Sizing denominator = the book this pass would END with. The clamp exists because an
       inverse-vol split still piles a sleeve into whichever leader it likes best; it is a rule for
       NEW money and NEVER a reason to sell. The cluster clamp is gone on purpose — this whole book
       is one cluster by design, and the sleeves' 4/4/2 structure plus inverse-vol IS the diversifier. */
    const expTarget=Math.max(1,expAfter+Math.max(0,budget));
    const buys=[], sleeveRows=[];
    for(const S of SD_SLEEVES){
      if(S.k==='cash')continue;
      const w=wOf[S.k], cands=byTier[S.k].slice(0,S.n);
      if(!cands.length){ sleeveRows.push({S,w:0,picks:[],none:true}); continue; }
      const bucket=Math.max(0,budget)*w;
      const inv=cands.map(m=>1/Math.max(15,m.vol||40)), sInv=inv.reduce((a,b)=>a+b,0)||1;
      const picks=[];
      cands.forEach((m,i)=>{
        const d=bucket*(inv[i]/sInv);
        const room=Math.max(0,SD_SINGLE_MAX_X*expTarget-(after[m.sym]||0));
        const sized=Math.min(d,room);
        const sh=(m.px>0)?Math.floor(sized/m.px):0;
        if(sh<=0){ picks.push({m,sh:0,d:0,noRoom:true,atMax:room<d}); return; }
        const dollars=sh*m.px;
        after[m.sym]=(after[m.sym]||0)+dollars;
        const stop=sdStop(m), tgt=m.px+3*(m.px-stop);
        const er=(typeof azEarn==='function')?azEarn(m.sym):null;
        const erWarn=(er&&er.days!=null&&er.days>=0&&er.days<=10)?` <span style="color:#b45309">⚠️ earnings in ${er.days===0?'<1d':er.days+'d'}</span>`:'';
        picks.push({m,sh,d:dollars,stop,tgt,erWarn,cappedBy:sized<d?'sizing clamp':null});
        buys.push({side:'BUY',sym:m.sym,qty:sh,limit:m.px,stop:+stop.toFixed(2),note:S.label+' · momentum '+fmt(m.score,1)+'/10'});
      });
      sleeveRows.push({S,w,picks});
    }
    const deployed=buys.reduce((s,o)=>s+o.qty*o.limit,0);
    return {buys,sleeveRows,deployed};
  }
  const A1=sdAllocate(pool);
  const buys=A1.buys, sleeveRows=A1.sleeveRows, deployed=A1.deployed;
  const undeployed=Math.max(0,pool-deployed);

  /* ── Press room — the owner's call, not the plan's ───────────────────────────────────────── */
  const A2=pressRoom>0?sdAllocate(pool+pressRoom):null;
  const pressLegs=A2?A2.buys.map(b=>{ const b1=buys.find(x=>x.sym===b.sym);
      const q=b.qty-(b1?b1.qty:0); return q>0?{...b,qty:q}:null; }).filter(Boolean):[];
  const borrowed=pressLegs.reduce((s,o)=>s+o.qty*o.limit,0);
  const pressCarry=(debtAfter+borrowed)*SD_MARGIN_APR/12;
  const lmvNow=expAfter+deployed;
  const callNow=sdCallDrop(equity,lmvNow), callPressed=sdCallDrop(equity,lmvNow+borrowed);

  /* ── Rotation advisory — torque without more margin. Text only; it places nothing. ───────── */
  const rotFrom=keep.filter(r=>r.m&&r.m.score!=null&&r.m.score<SD_MIN_SCORE&&r.p.px>0
                               &&sellableOf(r.p)*r.p.px>=250&&!sellingNow.has(r.p.symbol))
                    .sort((a,b)=>sellableOf(b.p)*b.p.px-sellableOf(a.p)*a.p.px)[0]||null;
  const rotTo=[...byTier.core,...byTier.sat].filter(m=>m.score>=7).sort((a,b)=>b.rank-a.rank)[0]||null;
  const rotation=(rotFrom&&rotTo&&rotTo.sym!==rotFrom.p.symbol)
    ? {from:rotFrom,to:rotTo,dollars:sellableOf(rotFrom.p)*rotFrom.p.px} : null;
  // Badge any buy that is ALSO one of today's vetted picks, so the Top-3 cards can say so.
  try{ const m={}; const pk=new Set(((typeof PICK_PICKS!=='undefined'&&Array.isArray(PICK_PICKS))?PICK_PICKS:[]).map(p=>p&&p.ticker));
    buys.forEach(o=>{ if(pk.has(o.sym))m[o.sym]={rank:null,shares:o.qty,dollars:o.qty*o.limit}; });
    window.__PLAN_ADDS=m; if(document.getElementById('picks-cards')&&typeof renderPicksCards==='function')renderPicksCards();
  }catch(e){}

  /* ── 3 · Guardrail inputs ────────────────────────────────────────────────────────────────── */
  /* Concentration is reported over what you'd still HOLD — a name being exited wholesale is not
     "your largest position", and quoting it as one contradicted the trim table right above it. */
  const top=keep.map(r=>r.p).sort((a,b)=>b.val-a.val), t1=top[0]||null;
  const houseMoney=held.filter(p=>p.avg>0&&p.px>=p.avg*SD_HOUSE_MONEY).sort((a,b)=>b.val-a.val);
  const earnSoon=held.map(p=>({p,e:earningsMap[p.symbol]})).filter(x=>x.e&&x.e.daysAway!=null&&x.e.daysAway<=14).sort((a,b)=>a.e.daysAway-b.e.daysAway);
  const utilPct=utilKnown?M.util*100:null;
  const utilCol=sdUtilColor(M.util);
  const utilSub=utilKnown
    ? `${fmt(utilPct,1)}% of line · cruise ${fmt(SD_UTIL_CRUISE*100,0)} / max ${fmt(SD_UTIL_MAX*100,0)}`
    : (M.debt>0?`line unknown · ${fmt(SD_LEV_FALLBACK,2)}× fallback`:'unlevered');
  const headroom=utilKnown?Math.max(0,SD_UTIL_MAX*M.line-M.debt):null;

  const washStrip=Object.keys(wash).length?`<div class="fund-note" style="margin-top:8px">🚫 <b>Wash-sale hold</b> — ${Object.entries(wash).map(([s,w])=>`<b>${s}</b> (loss ${fmtD(w.realized)} in ${[...w.accts].join(' + ')}, clear ${w.clear})`).join(' · ')}. Blocked from every buy ticket below until the window closes. The window is per <i>taxpayer</i>, so a loss in either account blocks a rebuy in both. Not tax advice — check your lots.</div>`:'';

  el.innerHTML=`
    <div class="box-info" style="border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px">
      <b>Mandate: aggressive growth.</b> This book runs concentrated and high-beta on purpose — ballast, bonds and diversification are the <span class="dp-link" onclick="switchTab('portfolio')">agentic account's</span> job, not this one's. So the plan <b>cuts what's broken, not what's red</b>, and redeploys into momentum leadership rather than into the oversold screen.
      <b>Margin is a tool here, not a sin</b>: it is measured as utilisation of your credit line, in two bands — cruise ≤${fmt(SD_UTIL_CRUISE*100,0)}% (deploy freely) and a hard ceiling at ${fmt(SD_UTIL_MAX*100,0)}%. The only sells this plan generates are <b>broken theses</b> and, above ${fmt(SD_UTIL_MAX*100,0)}%, a paydown. <b>Concentration is reported, not policed</b> — no name is ever sold here for being large.${beta!=null?` Book beta ≈ <b>${fmt(beta,2)}</b> — a 10% market drop ≈ ${fmtP(-10*beta)}.`:''}
    </div>

    <div class="snap-grid" style="margin-bottom:12px">
      <div class="snap"><div class="snap-lbl">Exposure</div><div class="snap-val">${fmtD(exposure)}</div><div class="snap-sub">what the book controls</div></div>
      <div class="snap"><div class="snap-lbl">Your equity</div><div class="snap-val">${fmtD(equity)}</div><div class="snap-sub">what you actually own</div></div>
      <div class="snap"><div class="snap-lbl">Leverage</div><div class="snap-val" style="color:${M.debt>0?utilCol:'#10b981'}">${fmt(lev,2)}×</div><div class="snap-sub">${utilSub}</div></div>
      <div class="snap"><div class="snap-lbl">${onMargin?'Margin debt':'Idle cash'}</div><div class="snap-val">${fmtD(onMargin?debt:cashAvail)}</div><div class="snap-sub">${onMargin?(headroom!=null?`${fmtD(headroom)} room to your ${fmt(SD_UTIL_MAX*100,0)}% line`:`buying power ${fmtD(bpVal)} · line not derivable`):`buying power ${fmtD(bpVal)}`}</div></div>
    </div>

    <div class="col-title">1 · Cut what's broken <span class="card-hint">(${exits.length?`${exits.length} exit${exits.length===1?'':'s'} · `:''}≈ ${fmtD(freed)} freed)</span></div>
    <div style="font-size:11.5px;font-weight:700;color:var(--text);opacity:.75;margin:2px 0 6px">Broken theses — trend rolled over or a stop breached</div>
    ${exits.length
      ? `<table><thead><tr><th>Sell all</th><th class="tr">Shares</th><th class="tr">Limit</th><th class="tr">Proceeds</th><th class="tr">P&amp;L realized</th></tr></thead><tbody>${exits.map(r=>`<tr><td><span class="sym">${r.p.symbol}</span><div style="color:#9ca3af;font-size:11px;line-height:1.35;margin-top:2px">${r.why}${r.lock?` <b style="color:#b45309">Holding back ${fmt(r.lock.shares,0)} sh</b> — collateral for ${r.lock.contracts} short call${r.lock.contracts===1?'':'s'}; selling them would leave you naked.`:''}</div></td><td class="tr">${fmt(r.sellQty,r.sellQty<1?3:2)}${r.lock?`<div style="color:#9ca3af;font-size:10px">of ${fmt(r.p.qty,2)}</div>`:''}</td><td class="tr">${P(r.p.px)}</td><td class="tr">${fmtD(r.sellVal)}</td><td class="tr"><span class="${r.sellPl>=0?'pos':'neg'}">${fmtD(r.sellPl)}</span></td></tr>`).join('')}<tr style="background:var(--surface-2);font-weight:700"><td>Total</td><td class="tr"></td><td class="tr"></td><td class="tr">${fmtD(exitProceeds)}</td><td class="tr ${exitPl>=0?'pos':'neg'}">${fmtD(exitPl)}</td></tr></tbody></table>`
      : (lockedExits.length
        /* Same trap as the paydown empty state: a broken name whose shares are ALL pledged never
           reaches `exits`, and "Nothing is broken" would then contradict the 🔒 callout below it. */
        ? `<div class="tech-empty">${lockedExits.map(r=>r.p.symbol).join(', ')} ${lockedExits.length===1?'reads':'read'} broken, but every share is collateral for your covered calls — see below for how to unwind it. Nothing else here is broken.</div>`
        : `<div class="tech-empty">Nothing is broken. ${rows.length?`${rows.length} holding${rows.length===1?'':'s'} checked — being underwater is <b>not</b> an exit signal in a book like this; the test is a rolled-over trend (50-DMA under the 100-DMA, price decisively below it) or a −25% stop breach.${rows.filter(r=>r.p.pnlD<0).length?` ${rows.filter(r=>r.p.pnlD<0).map(r=>r.p.symbol).join(', ')} ${rows.filter(r=>r.p.pnlD<0).length===1?'is':'are'} red but intact — hold.`:''}`:'No holdings to check.'}</div>`)}
    <div style="font-size:11.5px;font-weight:700;color:var(--text);opacity:.75;margin:12px 0 6px">Margin posture — bands on your credit line</div>
    ${payRows.length
      ? `<table><thead><tr><th>Raise cash</th><th class="tr">Shares</th><th class="tr">Limit</th><th class="tr">Proceeds</th><th class="tr">P&amp;L</th></tr></thead><tbody>${payRows.map(t=>`<tr><td><span class="sym">${t.r.p.symbol}</span> <span style="color:#9ca3af">weakest momentum${t.r.m&&t.r.m.score!=null?` ${fmt(t.r.m.score,1)}/10`:''}</span></td><td class="tr">${t.sh}${t.capped?`<div style="color:#b45309;font-size:10px">capped — collateral</div>`:''}</td><td class="tr">${P(t.r.p.px)}</td><td class="tr">${fmtD(t.proceeds)}</td><td class="tr"><span class="${t.pl>=0?'pos':'neg'}">${fmtD(t.pl)}</span></td></tr>`).join('')}<tr style="background:var(--surface-2);font-weight:700"><td>Total</td><td class="tr"></td><td class="tr"></td><td class="tr">${fmtD(payProceeds)}</td><td class="tr ${payPl>=0?'pos':'neg'}">${fmtD(payPl)}</td></tr></tbody></table>
        <div class="fund-note">${utilKnown?`Your loan is ${fmtD(M.debt)} — <b>${fmt(utilPct,1)}%</b> of your ${fmtD(M.line)} line, over the ${fmt(SD_UTIL_MAX*100,0)}% ceiling by ≈ <b>${fmtD(payNeed)}</b>.`:`No buying-power figure in this snapshot, so the line can't be derived — this falls back to the ${fmt(SD_LEV_FALLBACK,2)}× exposure/equity ceiling (now ${fmt(lev,2)}×), which is a cruder test.`} Sourced from the weakest-momentum names you can actually deliver. <b>Indicative</b>: selling stock also shrinks the collateral behind the line, so the line moves with it.${payShort>0?` ${fmtD(payShort)} of the raise can't be reached from freely sellable shares — see below.`:''}</div>`
      : `<div class="tech-empty">${M.debt>0
          ? (utilKnown
            ? `Your loan is <b>${fmtD(M.debt)}</b> = <b>${fmt(utilPct,1)}%</b> of your ${fmtD(M.line)} line — inside your band (cruise ${fmt(SD_UTIL_CRUISE*100,0)} / max ${fmt(SD_UTIL_MAX*100,0)}). <b>No forced selling.</b> ${fmtD(headroom)} of headroom to the ceiling.${M.callDrop!=null?` Est. margin-call distance ≈ a <b>${fmt(M.callDrop*100,0)}%</b> uniform drop from here (25% maintenance — Robinhood's real requirement runs higher on volatile names).`:''}`
            : `You're carrying ${fmtD(M.debt)}, but this snapshot has no buying-power figure so your credit line can't be derived. Falling back to the ${fmt(SD_LEV_FALLBACK,2)}× exposure/equity ceiling: now ${fmt(lev,2)}× — inside it, no forced selling.`)
          : `No margin drawn. Nothing to pay down.`}</div>`}
    <div style="font-size:11.5px;font-weight:700;color:var(--text);opacity:.75;margin:12px 0 6px">Concentration — reported, not policed</div>
    ${concRows.length||aiVal>0
      ? `<div style="font-size:12.5px;color:var(--text);opacity:.85;line-height:1.5">
        ${concRows.map(c=>`<div style="padding:5px 0;border-top:1px dashed var(--surface-2)"><b>${c.r.p.symbol}</b> is <b>${fmt(c.pctEq,0)}%</b> of equity <span style="color:#9ca3af">(${fmtD(c.r.p.val)})</span> — a −20% ${c.r.p.symbol} day ≈ <b class="neg">−${fmt(c.hit,1)}%</b> of the account at ${fmt(lev,2)}× leverage.${c.stop?` <span style="color:#9ca3af">The protection is the level, not a trim: vol-scaled stop ≈ ${P(c.stop)} (${fmt((1-c.stop/c.r.m.px)*100,0)}% below).</span>`:''}${c.score!=null?` <span style="color:#9ca3af">Momentum ${fmt(c.score,1)}/10.</span>`:''}</div>`).join('')}
        ${aiVal>0?`<div style="padding:5px 0;border-top:1px dashed var(--surface-2)"><b>AI / compute complex</b> ${fmtD(aiVal)} — <b>${fmt(equity>0?aiVal/equity*100:0,0)}%</b> of equity, ${fmt(exposure>0?aiVal/exposure*100:0,0)}% of exposure. One macro bet, by design.</div>`:''}
        <div class="fund-note">Stated, not acted on. Nothing here generates an order: on this side a large position that is still leading is the mandate working, and selling it to satisfy a percentage would be a dial overruling the strategy. Size becomes a <i>problem</i> when the name stops leading — that's what the broken-thesis test above and the vol-scaled stops are for.</div>
      </div>`
      : `<div class="tech-empty">No holding is above ${fmt(SD_CONC_FLAG*100,0)}% of equity.${t1?` Largest is ${t1.symbol} at ${fmt(t1.val/equity*100,1)}%.`:''}</div>`}
    ${(lockedExits.length||payShort>0)?`<div class="box-warn" style="border-radius:10px;padding:8px 12px;font-size:11.5px;margin-top:8px">
      <b>🔒 Held back by your own covered calls.</b>
      ${lockedExits.map(r=>`<div style="padding:3px 0">${r.p.symbol} reads broken, but all ${fmt(r.p.qty,2)} sh back ${r.lock?r.lock.contracts:0} short call${r.lock&&r.lock.contracts===1?'':'s'}${r.lock&&r.lock.legs[0]?` ($${r.lock.legs[0].strike} exp ${r.lock.legs[0].expiration})`:''}. To exit, <b>buy the call${r.lock&&r.lock.contracts===1?'':'s'} back first</b> (or let ${r.lock&&r.lock.contracts===1?'it':'them'} expire), then sell the shares — selling first leaves you short naked calls.</div>`).join('')}
      ${payShort>0?`<div style="padding:3px 0">${fmtD(payShort)} of the margin paydown can't be raised — the remaining shares are pledged to your short calls${Object.keys(locked).length?` (${Object.entries(locked).map(([k,v])=>`${k} ${fmt(v.shares,0)} sh`).join(' · ')})`:''}. Roll or close them to free the stock; until then the loan stays above your ${fmt(SD_UTIL_MAX*100,0)}% ceiling.</div>`:''}

/* ═══ Agentic Portfolio (the recommended portfolio for the ••••3900 agentic account) ═══
   Standalone card — formerly Step 4 of the Action Center, split out because the recommended
   portfolio is now the blueprint for the agentic account, not a restructuring of the margin
   book. Builds a from-scratch, long-only, UNLEVERED target from a FULLY-INDEPENDENT universe
   (top scored picks ∪ mega-cap leaders ∪ SPY/QQQ index core ∪ whatever ••••3900 already holds —
   the margin account is ignored), sector-diversified + conviction-weighted, capped at
   PLAN_SINGLE_CAP/name, sized to the account's own equity (cash + positions). Renders the target vs.
   the account's ACTUAL holdings vs. per-name drift, with a deploy/rebalance hand-off. Reads
   data.agentic (the account's real cash + positions, emitted by the producer); no-ops cleanly until
   picks + DOM exist, and shows target weights only until the first agentic snapshot lands. */
const AGENTIC_DRIFT=5; // pp — rebalance a name once it drifts this far from target (drift-triggered)
/* ═══════════════════════════════════════════
   AGENTIC ACCOUNT VIEW  (Accounts tab · ••••3900 side of the segmented control)
   The self-directed margin book and the agentic account are two real accounts with different rules
   (unlevered/limited margin, wash-sale ledger, PDT guard, the auto-tier executor), so they get one
   surface each behind the Accounts toggle. This page owns everything ••••3900: the account-level
   performance the card never had, the holdings-vs-target tracker, and the graded decision log.
═══════════════════════════════════════════ */
let _agenticInit=false, _agPerfMode='ret', _agChart=null;

/* Which account side of the Accounts tab is showing. Lazily renders the agentic page on first
   visit (like the tab inits) and persists the choice, so the app reopens where you left it. */
/* ── Sticky-header geometry + section matching for the Accounts toggle (v106) ──
   The account switcher is sticky, so it's reachable mid-scroll — but a switch that dumps you back
   at the top makes comparing the two books a scrolling chore. Both sides carry matching `data-sec`
   keys (the aligned card spine), so we note which section the reader is on, swap, and land on the
   same one. A section with no counterpart (self-directed 🧹 smalls, agentic 🧾 Rebalance Log) falls
   back to the nearest section ABOVE it that both sides have. */
const SEC_ORDER=['snapshot','holdings','performance','heatmap','risk','allocation','income','technicals','fundamentals','smalls','flow','rebalance-log'];
// Every programmatic scroll has to clear the tab bar AND (on this tab) the sticky switcher, or the
// target card lands underneath them. Built from HEIGHTS plus the tab bar's resolved sticky `top`,
// never from live rects: a rect-based offset reads ~50px larger while the page sits at scroll 0
// (nothing is stuck yet), so a scroll computed at the top of the page and judged after it stuck
// disagreed with itself and landed every jump a section early. Heights are scroll-independent.
// The tab row wraps to two lines on a phone; the switcher measures 0 on pages that don't show it.
function __pfTopOffset(){
  const tb=document.querySelector('.tabbar'); if(!tb||!tb.offsetHeight)return 96;
  let safe=0; try{ safe=parseFloat(getComputedStyle(tb).top)||0; }catch(e){}
  let y=safe+tb.offsetHeight;
  // Two pages carry a sticky switcher (Accounts + Plan) but only one page is visible at a time, so
  // the one with a non-zero height IS the one on screen. Keyed by class, not id, since v108 added
  // the Plan tab's own switcher.
  const ws=document.querySelectorAll('.acct-seg-wrap');
  for(let i=0;i<ws.length;i++){ if(ws[i].offsetHeight>0){ y+=ws[i].offsetHeight; break; } }
  return y+8;
}
window.__pfTopOffset=__pfTopOffset;
function _syncTabbarH(){ const tb=document.querySelector('.tabbar');
  if(tb&&tb.offsetHeight>0)document.documentElement.style.setProperty('--tabbar-h',tb.offsetHeight+'px'); }
window.addEventListener('resize',_syncTabbarH);
window.addEventListener('orientationchange',()=>setTimeout(_syncTabbarH,150));
try{ _syncTabbarH(); if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_syncTabbarH); }catch(e){}
/* Which section is the reader actually on? The FIRST one still meaningfully on screen — i.e. whose
   bottom clears the sticky header by more than SEC_EDGE. Two heuristics were tried and rejected:
   "last card whose top is above the header" flips to the PREVIOUS section the moment a card starts
   a pixel below the line (exactly when that card is the one you're reading), and "whichever card
   fills the most pixels" tips to the NEXT section whenever the current one is short — a compact
   Allocation card would hand you off to Income. Topmost-still-visible matches how people read. */
const SEC_EDGE=40;
/* Not every pixel of a side is inside a tagged section: BOTH heroes (the account-value headline)
   and the self-directed margin banner sit ABOVE the first `data-sec` card and carry no key of
   their own. Matching them to 'snapshot' — the old behaviour — meant that switching accounts while
   sitting at the very top scrolled the incoming side DOWN to its snapshot tiles, cutting the
   balance off the screen: the reader hadn't scrolled at all, yet the app jumped. So the region
   above the first section is its own answer, '__top', which lands at scroll 0 on either side. */
const SEC_TOP='__top';
function _currentSec(rootId){
  const root=document.getElementById(rootId); if(!root)return null;
  const cut=__pfTopOffset()+SEC_EDGE; let last=null;
  const els=root.querySelectorAll('[data-sec]');
  // Anything above the first tagged section still on screen ⇒ the reader is in the hero region.
  if(els.length&&els[0].getBoundingClientRect().top>__pfTopOffset())return SEC_TOP;
  for(let i=0;i<els.length;i++){
    if(els[i].getBoundingClientRect().bottom>cut)return els[i].getAttribute('data-sec');
    last=els[i].getAttribute('data-sec');
  }
  return last;   // scrolled past every section (short page pinned at its bottom) → the final one
}
function _landOnSec(rootId,sec){
  const root=document.getElementById(rootId); if(!root||!sec)return false;
  // The hero region has no card to align to — the top of the page IS the target. Returned as a
  // success so the caller still runs the settle pass (harmless at 0, and it holds the top while
  // the incoming side's cards fill in rather than letting a growing layout nudge it).
  if(sec===SEC_TOP){ window.scrollTo(0,0); return true; }
  const place=()=>{
    let i=SEC_ORDER.indexOf(sec), el=root.querySelector('[data-sec="'+sec+'"]');
    while(!el&&i>0){ i--; el=root.querySelector('[data-sec="'+SEC_ORDER[i]+'"]'); }
    if(!el)return false;
    const y=(window.pageYOffset||document.documentElement.scrollTop||0)+el.getBoundingClientRect().top-__pfTopOffset();
    window.scrollTo(0,Math.max(0,y)); return true;
  };
  if(!place())return false;
  requestAnimationFrame(place);   // second pass — the sticky header has settled into place by now
  return true;
}
/* First visit to a side: its cards are still filling in (spinners → tables), so everything ABOVE
   the target grows and pushes it back out of view. Re-place for a beat — and stop the instant the
   reader scrolls themselves, since fighting a deliberate scroll is worse than landing imprecisely. */
function _settleOnSec(rootId,sec){
  let n=0,done=false;
  const stop=()=>{ done=true; ['wheel','touchstart','keydown'].forEach(e=>window.removeEventListener(e,stop)); };
  ['wheel','touchstart','keydown'].forEach(e=>window.addEventListener(e,stop,{passive:true}));
  const t=setInterval(()=>{ if(done||++n>8){ clearInterval(t); stop(); return; } _landOnSec(rootId,sec); },150);
}
function setAccount(which,opts){
  const isAg=which==='agentic';
  // Note the reader's section BEFORE the swap (the outgoing side is still laid out and measurable).
  const keepSec=(opts&&opts.keepSection)?_currentSec(isAg?'app':'agentic-app'):null;
  const a=document.getElementById('app'), g=document.getElementById('agentic-app');
  if(a)a.style.display=isAg?'none':'';
  if(g)g.style.display=isAg?'':'none';
  const bm=document.getElementById('acct-tg-main'), bg=document.getElementById('acct-tg-agentic');
  if(bm){ bm.classList.toggle('active',!isAg); bm.setAttribute('aria-selected',String(!isAg)); }
  if(bg){ bg.classList.toggle('active',isAg); bg.setAttribute('aria-selected',String(isAg)); }
  try{ localStorage.setItem('pf_acct',which); }catch(e){}
  const land=(settle)=>{
    const root=isAg?'agentic-app':'app';
    if(keepSec&&_landOnSec(root,keepSec)){ if(settle)_settleOnSec(root,keepSec); }
    else window.scrollTo(0,0);   // no section to match (boot restore, tab switch) → top, as before
  };
  if(isAg&&!_agenticInit){ _agenticInit=true;
    // Gate the first render on the snapshot settling. The boot restore (pf_acct='agentic') calls
    // this synchronously during script parse, BEFORE data.json is decrypted — rendering then would
    // freeze the hero at "—" behind a false "producer hasn't captured ••••3900" banner, since
    // nothing below repaints the hero. Once __dataReady has settled this fires on a microtask, so a
    // mid-session toggle still paints instantly. `.then(r,r)`: render either way — a failed decrypt
    // should show the honest no-snapshot state, not a spinner forever.
    const r=()=>{ try{ renderAgenticPage(); }catch(e){ try{console.warn('[render] agenticPage',e&&e.message);}catch(_){} }
      try{ if(window.__navRebuild)window.__navRebuild(); }catch(e){}
      land(true);   // the side only just materialised — land once it exists, then hold through its fills
    };
    if(window.__dataReady&&window.__dataReady.then)window.__dataReady.then(r,r); else r();
    try{ if(window.__navRebuild)window.__navRebuild(); }catch(e){}
    return;   // land() runs from r(); scrolling now would only fight it
  }
  try{ if(window.__navRebuild)window.__navRebuild(); }catch(e){}   // chips follow the visible side
  land(false);
}
window.setAccount=setAccount;

/* ── Plan tab's account switcher (v108) ────────────────────────────────────────────────────────
   Same two accounts, same persisted key (`pf_acct`), so flipping to Agentic anywhere flips it
   everywhere: Accounts = what you own, Plan = what happens next. The Accounts tab's heavy render
   is NOT triggered from here — its charts would size to a zero-height hidden container — so we
   only mirror the button state and let switchTab('portfolio') apply the account when that page is
   actually visible. No section-matching: the two Plan sides are different documents, not the
   aligned card spine the Accounts tab pairs up. */
let _planAgInit=false;
function setPlanAccount(which){
  const isAg=which==='agentic';
