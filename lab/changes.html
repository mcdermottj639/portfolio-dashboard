<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio LAB — what changed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7f6f2;color:#1f2328;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
a.back{display:inline-flex;align-items:center;min-height:44px;color:#b45309;font-weight:700;text-decoration:none}
h1{font-size:20px;margin:2px 0 12px}
.run{background:#fff;border:1px solid #e5e2d9;border-radius:14px;padding:14px;margin-bottom:16px}
.run h2{font-size:15px;margin:0 0 4px}.run p{margin:0 0 10px;color:#57606a;font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #d0d7de;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:inherit}
.bar button[aria-pressed="true"]{background:#b45309;border-color:#b45309;color:#fff}
.bar span{font-size:12px;color:#57606a;margin-left:auto}
.run img{display:block;width:100%;height:auto;border:1px solid #e5e2d9;border-radius:10px}
@media (prefers-color-scheme:dark){html,body{background:#111;color:#eee}.run{background:#1a1a1a;border-color:#333}.bar button{background:#1a1a1a;border-color:#444}.run p,.bar span{color:#aaa}.run img{border-color:#333}}
</style></head><body><main>
<a class="back" href="index.html">← Back to the app</a>
<h1>What changed in the practice copy</h1>
<div id="runs"></div>
</main>
<script>
/* Newest run first. Each run: build, date, page, the one-line changelog text, and its before/after pairs. */
var RUNS=[
 {n:3,date:"2026-11-25",page:"Analyze",text:"New My models strip: where the stock stands in Apex, Agentic and the v2.9 paper track, with the reason.",
  pairs:[["Phone","lab3-analyze-390"],["Duo open","lab3-analyze-960"],["PC","lab3-analyze-1440"]]},
 {n:2,date:"2026-11-25",page:"Analyze",text:"Verdict, setup score and price on the first screen; PC shows two columns; less chrome.",
  pairs:[["Phone","lab2-analyze-390"],["Duo open","lab2-analyze-960"],["PC","lab2-analyze-1440"]]}
];
var host=document.getElementById('runs');
RUNS.forEach(function(r){
  var el=document.createElement('section');el.className='run';var i=0,side='after';
  el.innerHTML='<h2>lab'+r.n+' · '+r.date+' · '+r.page+'</h2><p></p><div class="bar"><button type="button" data-s="before">Before</button><button type="button" data-s="after">After</button><button type="button" data-next>Next ›</button><span></span></div><img alt="">';
  el.querySelector('p').textContent=r.text;
  var img=el.querySelector('img'),lab=el.querySelector('.bar span');
  function draw(){var p=r.pairs[i];img.src='shots/'+p[1]+'-'+side+'.jpg';img.alt=r.page+' '+p[0]+' '+side;lab.textContent=p[0]+' · '+(i+1)+' of '+r.pairs.length;
    el.querySelectorAll('[data-s]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.s===side));});}
  el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.s)side=b.dataset.s;else{i=(i+1)%r.pairs.length;}draw();});
  draw();host.appendChild(el);
});
</script></body></html>
