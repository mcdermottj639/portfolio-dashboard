name: Prediction market snapshots
on:
  push:
    branches: [main]
    paths: ['producer/predictions-fetch.mjs', 'ui/predictions-model.js', '.github/workflows/predictions.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prediction-market-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect public markets and settle recorded observations
        run: node producer/predictions-fetch.mjs
      - name: Publish only the public prediction snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/predictions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh prediction market snapshot'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
