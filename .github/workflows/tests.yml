name: Producer tests

# Offline unit + integration tests for the producer pipeline (producer/*.test.mjs). No network,
# no MCP, no secrets — the build-data integration test runs against fixtures and restores the
# workspace copy of data.json afterward.

on:
  pull_request:
    paths: ['producer/**', 'ui/**', 'tests/**', 'index.html', 'sw.js', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['producer/**', 'ui/**', 'tests/**', 'index.html', 'sw.js', '.github/workflows/tests.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    # Pin the OS alongside Playwright so a new ubuntu-latest image cannot break browser support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run producer test suites
        run: |
          rc=0
          for t in producer/*.test.mjs; do
            echo "::group::$t"
            node "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Run dashboard model tests
        run: node --test tests/*.test.cjs

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Check synthetic dashboard in Chromium
        run: |
          node tests/preview.mjs > /tmp/portfolio-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/brief-browser.mjs
          node tests/sd-plan-browser.mjs
          node tests/apex-browser.mjs
          node tests/journey-browser.mjs

      - name: Verify published UI after a main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 tests/verify-live-shell.py
          PF_PREVIEW_URL=https://mcdermottj639.github.io/portfolio-dashboard/ node tests/journey-browser.mjs

      - name: Save synthetic layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-browser-evidence
          path: tmp/journey-evidence/
          if-no-files-found: ignore
          retention-days: 14
