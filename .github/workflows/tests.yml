name: Producer tests
# TEMPORARY scratch-branch workflow (sweep baseline for v255). Never merged.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - run: |
          node tests/preview.mjs > /tmp/p.log 2>&1 &
          for a in $(seq 1 30); do curl -fsS http://127.0.0.1:8767/ >/dev/null && break; sleep 1; done
          node tests/duo-checks.mjs && echo DUO_OK || echo DUO_FAIL
          node tests/brief-browser.mjs && echo BRIEF_OK || echo BRIEF_FAIL
          node tests/sweep-browser.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sweep, path: tmp/sweep/ }
